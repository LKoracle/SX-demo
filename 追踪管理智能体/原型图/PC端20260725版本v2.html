0\" fill=\"' + d.color + '\" opacity=\"0\">' +\n           d.count +\n           '<animate attributeName=\"opacity\" from=\"0\" to=\"1\" dur=\"0.3s\" fill=\"freeze\" begin=\"' + (idx * 0.05 + 0.3) + 's\"/>' +\n           '</text>';\n\n    // X-axis label\n    svg += '<text x=\"' + (bx + barW / 2) + '\" y=\"' + (H - 8) + '\" text-anchor=\"middle\" font-size=\"11\" fill=\"#64748b\" font-weight=\"500\">' + d.name + '</text>';\n  });\n\n  // Y-axis title\n  svg += '<text x=\"8\" y=\"' + (padT + chartH / 2) + '\" text-anchor=\"middle\" font-size=\"10\" fill=\"#94a3b8\" transform=\"rotate(-90, 8, ' + (padT + chartH / 2) + ')\">数量</text>';\n\n  svg += '</svg>';\n\n  var el = document.getElementById(containerId);\n  if (el) el.innerHTML = svg;\n}\n\n// ===== Client Profile Card for path flow (chains to 客户达成测算) =====\nfunction appendClientProfileCardForPath() {\n  var uid = '_cp_' + Date.now();\n  var totalClients = 0;\n  var currentTenure = getClientCurrentTenureRow();\n  totalClients = currentTenure.newCnt + currentTenure.oldCnt;\n  var totalTemp = 0;\n  clientData.temperature.forEach(function(t) { totalTemp += t.count; });\n  var profileWrap = document.getElementById('achieveClientProfileWrap');\n  if (profileWrap) {\n    var profileHeadWrap = document.getElementById('achieveClientProfileHeadWrap');\n    if (profileHeadWrap) {\n      profileHeadWrap.innerHTML =\n        '<span style=\"font-size:12px;color:var(--text-muted);\">存量客户</span>' +\n        '<span style=\"font-size:12px;font-weight:600;color:var(--text-primary);\">' + totalClients + ' 人</span>';\n    }\n    var tmpDiv = document.createElement('div');\n    tmpDiv.innerHTML = buildClientProfileCardHTML(uid, totalClients, totalTemp);\n    var profileCard = tmpDiv.querySelector('.team-profile-card');\n    if (profileCard) {\n      var hdr = profileCard.querySelector('.team-profile-header');\n      if (hdr) hdr.remove();\n      var innerDiv = document.createElement('div');\n      innerDiv.style.cssText = 'padding:0;';\n      innerDiv.appendChild(profileCard);\n      profileWrap.innerHTML = '';\n      profileWrap.appendChild(innerDiv);\n      profileWrap.style.display = 'block';\n      renderClientProfileCharts(uid, totalClients, totalTemp);\n    }\n  }\n  setTimeout(function(){ appendClientAchieveCard(); }, 400);\n}\n\n// ===== Atomic Tool: 客户达成测算 =====\nvar clientAchieveData = {\n  // 各客温的人均NBEV贡献（万元）— 顺序: 冷却→低温→中温→高温\n  tempNbev: [\n    { name: '冷却', nbevPer: 0.1, color: '#94a3b8' },\n    { name: '低温', nbevPer: 0.6, color: '#0891b2' },\n    { name: '中温', nbevPer: 1.5, color: '#f59e0b' },\n    { name: '高温', nbevPer: 3.2, color: '#ef4444' }\n  ],\n  // 各客价的人均NBEV贡献（万元）\n  valNbev: [\n    { name: 'A1', nbevPer: 6.8, color: '#1e40af' },\n    { name: 'A2', nbevPer: 4.5, color: '#6d28d9' },\n    { name: 'A3', nbevPer: 3.0, color: '#2563eb' },\n    { name: 'A4', nbevPer: 2.2, color: '#3b82f6' },\n    { name: 'B',  nbevPer: 1.2, color: '#0891b2' },\n    { name: 'C',  nbevPer: 0.6, color: '#10b981' },\n    { name: 'D',  nbevPer: 0.3, color: '#f59e0b' },\n    { name: 'E',  nbevPer: 0.1, color: '#f97316' },\n    { name: 'F',  nbevPer: 0.02, color: '#94a3b8' }\n  ]\n};\n\n// ===== 2D Matrix: client distribution (rows=客价, cols=客温) =====\n// Default matrix distributes clientData proportionally: matrix[valIdx][tempIdx]\nfunction buildDefaultMatrix() {\n  var tempTotal = 0; clientData.temperature.forEach(function(t) { tempTotal += t.count; });\n  var valTotal = 0; clientData.value.forEach(function(v) { valTotal += v.count; });\n  var matrix = [];\n  var currentTenure = getClientCurrentTenureRow();\n  var targetTotal = currentTenure.newCnt + currentTenure.oldCnt;\n  var scale = valTotal > 0 ? targetTotal / valTotal : 1;\n  clientData.value.forEach(function(v, vi) {\n    var row = [];\n    var rowSum = 0;\n    clientData.temperature.forEach(function(t, ti) {\n      var cell = Math.round(v.count * t.count / tempTotal * scale);\n      row.push(cell);\n      rowSum += cell;\n    });\n    matrix.push(row);\n  });\n  return matrix;\n}\n\nvar adjustedClientMatrix = null; // null = use default\n\nfunction getClientMatrix() {\n  if (adjustedClientMatrix) return adjustedClientMatrix;\n  return buildDefaultMatrix();\n}\n\n// Derive temp/val counts from matrix for backward compatibility\nfunction getClientTempCounts() {\n  var m = getClientMatrix();\n  var tempCounts = [];\n  for (var ti = 0; ti < clientData.temperature.length; ti++) {\n    var sum = 0;\n    for (var vi = 0; vi < clientData.value.length; vi++) { sum += m[vi][ti]; }\n    tempCounts.push(sum);\n  }\n  return tempCounts;\n}\nfunction getClientValCounts() {\n  var m = getClientMatrix();\n  var valCounts = [];\n  for (var vi = 0; vi < clientData.value.length; vi++) {\n    var sum = 0;\n    for (var ti = 0; ti < clientData.temperature.length; ti++) { sum += m[vi][ti]; }\n    valCounts.push(sum);\n  }\n  return valCounts;\n}\n\n// Compute NBEV for a cell: use geometric mean of tempNbev and valNbev per person\nfunction getCellNbev(valIdx, tempIdx, count) {\n  var tPer = clientAchieveData.tempNbev[tempIdx].nbevPer;\n  var vPer = clientAchieveData.valNbev[valIdx].nbevPer;\n  return Math.round(count * Math.sqrt(tPer * vPer) * 100) / 100;\n}\n\nvar CLIENT_PATH_DEFAULTS = { newCnt: 1280, newAvg: 18.5, oldCnt: 2460, oldAvg: 12.8 };\nvar CLIENT_PATH_TEMP_FACTORS = [0.46, 1.08, 2.04];\nvar CLIENT_PATH_VALUE_FACTORS = [2.28, 1.12, 0.46];\nvar CLIENT_PATH_TYPE_CONFIG = [\n  { key: 'new', name: '新客', color: '#2563eb', scoreFactor: 0.92, weights: [[0.05,0.12,0.16],[0.08,0.17,0.20],[0.06,0.08,0.08]] },\n  { key: 'old', name: '老客', color: '#16a34a', scoreFactor: 1.08, weights: [[0.07,0.12,0.24],[0.05,0.10,0.17],[0.03,0.07,0.15]] }\n];\n\nfunction cpaRound1(num) { return Math.round((num || 0) * 10) / 10; }\nfunction cpaNum(id, fallback) {\n  var el = document.getElementById(id);\n  var n = el ? parseFloat(el.value) : fallback;\n  return isNaN(n) ? fallback : n;\n}\nfunction cpaInt(id, fallback) {\n  return Math.max(0, Math.round(cpaNum(id, fallback)));\n}\nfunction cpaFmt(num, unit) {\n  return cpaRound1(num) + (unit || '');\n}\nfunction cpaAllocate(total, weights) {\n  total = Math.max(0, Math.round(total || 0));\n  var sum = 0, out = [], fractions = [], allocated = 0;\n  weights.forEach(function(row) { row.forEach(function(w) { sum += w; }); });\n  for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n    out.push([]);\n    for (var ci = 0; ci < GROUPED_COLS.length; ci++) {\n      var exact = sum > 0 ? total * ((weights[ri] && weights[ri][ci]) || 0) / sum : 0;\n      var flo = Math.floor(exact);\n      out[ri].push(flo);\n      allocated += flo;\n      fractions.push({ ri: ri, ci: ci, frac: exact - flo });\n    }\n  }\n  fractions.sort(function(a, b) { return b.frac - a.frac; });\n  for (var i = 0; i < total - allocated && i < fractions.length; i++) out[fractions[i].ri][fractions[i].ci]++;\n  return out;\n}\n\nfunction cpaBuildTypeGrid(cfg, count, avg) {\n  var cntGrid = cpaAllocate(count, cfg.weights);\n  var scoreGrid = [], rawNbev = 0, desiredNbev = cpaRound1(count * avg);\n  for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n    scoreGrid.push([]);\n    for (var ci = 0; ci < GROUPED_COLS.length; ci++) {\n      var score = CLIENT_PATH_VALUE_FACTORS[ri] * CLIENT_PATH_TEMP_FACTORS[ci] * cfg.scoreFactor;\n      scoreGrid[ri].push(score);\n      rawNbev += cntGrid[ri][ci] * score;\n    }\n  }\n  var scale = rawNbev > 0 ? desiredNbev / rawNbev : 0;\n  var grid = [], roundedTotal = 0, maxCell = { ri: 0, ci: 0, cnt: -1 };\n  for (var r = 0; r < GROUPED_ROWS.length; r++) {\n    grid.push([]);\n    for (var c = 0; c < GROUPED_COLS.length; c++) {\n      var cnt = cntGrid[r][c];\n      var nbev = cpaRound1(cnt * scoreGrid[r][c] * scale);\n      roundedTotal += nbev;\n      if (cnt > maxCell.cnt) maxCell = { ri: r, ci: c, cnt: cnt };\n      grid[r].push({ cnt: cnt, nbev: nbev, avg: cnt > 0 ? cpaRound1(nbev / cnt) : 0 });\n    }\n  }\n  var diff = cpaRound1(desiredNbev - roundedTotal);\n  if (diff !== 0 && maxCell.cnt > 0) {\n    var target = grid[maxCell.ri][maxCell.ci];\n    target.nbev = cpaRound1(Math.max(0, target.nbev + diff));\n    target.avg = target.cnt > 0 ? cpaRound1(target.nbev / target.cnt) : 0;\n  }\n  return grid;\n}\n\nfunction cpaSummarize(details) {\n  var cnt = [], nbev = [], avg = [], rowTotals = [], colTotals = [], total = { cnt: 0, nbev: 0, avg: 0 };\n  for (var ci = 0; ci < GROUPED_COLS.length; ci++) colTotals.push({ cnt: 0, nbev: 0, avg: 0 });\n  for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n    cnt.push([]); nbev.push([]); avg.push([]);\n    var row = { cnt: 0, nbev: 0, avg: 0 };\n    for (var ci2 = 0; ci2 < GROUPED_COLS.length; ci2++) {\n      var cellCnt = 0, cellNbev = 0;\n      CLIENT_PATH_TYPE_CONFIG.forEach(function(cfg) {\n        var d = details[cfg.key][ri][ci2];\n        cellCnt += d.cnt;\n        cellNbev += d.nbev;\n      });\n      cellNbev = cpaRound1(cellNbev);\n      cnt[ri][ci2] = cellCnt;\n      nbev[ri][ci2] = cellNbev;\n      avg[ri][ci2] = cellCnt > 0 ? cpaRound1(cellNbev / cellCnt) : 0;\n      row.cnt += cellCnt; row.nbev += cellNbev;\n      colTotals[ci2].cnt += cellCnt; colTotals[ci2].nbev += cellNbev;\n      total.cnt += cellCnt; total.nbev += cellNbev;\n    }\n    row.nbev = cpaRound1(row.nbev);\n    row.avg = row.cnt > 0 ? cpaRound1(row.nbev / row.cnt) : 0;\n    rowTotals.push(row);\n  }\n  total.nbev = cpaRound1(total.nbev);\n  total.avg = total.cnt > 0 ? cpaRound1(total.nbev / total.cnt) : 0;\n  colTotals.forEach(function(col) {\n    col.nbev = cpaRound1(col.nbev);\n    col.avg = col.cnt > 0 ? cpaRound1(col.nbev / col.cnt) : 0;\n  });\n  var typeTotals = {};\n  CLIENT_PATH_TYPE_CONFIG.forEach(function(cfg) {\n    var t = { cnt: 0, nbev: 0, avg: 0 };\n    for (var tr = 0; tr < GROUPED_ROWS.length; tr++) {\n      for (var tc = 0; tc < GROUPED_COLS.length; tc++) {\n        t.cnt += details[cfg.key][tr][tc].cnt;\n        t.nbev += details[cfg.key][tr][tc].nbev;\n      }\n    }\n    t.nbev = cpaRound1(t.nbev);\n    t.avg = t.cnt > 0 ? cpaRound1(t.nbev / t.cnt) : 0;\n    typeTotals[cfg.key] = t;\n  });\n  return { details: details, cnt: cnt, nbev: nbev, avg: avg, rowTotals: rowTotals, colTotals: colTotals, total: total, typeTotals: typeTotals };\n}\n\nfunction cpaBuildModel(newCnt, newAvg, oldCnt, oldAvg) {\n  var details = {};\n  details.new = cpaBuildTypeGrid(CLIENT_PATH_TYPE_CONFIG[0], Math.max(0, Math.round(newCnt || 0)), Math.max(0, parseFloat(newAvg) || 0));\n  details.old = cpaBuildTypeGrid(CLIENT_PATH_TYPE_CONFIG[1], Math.max(0, Math.round(oldCnt || 0)), Math.max(0, parseFloat(oldAvg) || 0));\n  return cpaSummarize(details);\n}\n\nfunction cpaReadSummary(uid) {\n  var newCnt = cpaInt('cpaNewCnt_' + uid, CLIENT_PATH_DEFAULTS.newCnt);\n  var oldCnt = cpaInt('cpaOldCnt_' + uid, CLIENT_PATH_DEFAULTS.oldCnt);\n  return {\n    newCnt: newCnt,\n    oldCnt: oldCnt,\n    newAvg: Math.max(0, cpaNum('cpaNewAvg_' + uid, CLIENT_PATH_DEFAULTS.newAvg)),\n    oldAvg: Math.max(0, cpaNum('cpaOldAvg_' + uid, CLIENT_PATH_DEFAULTS.oldAvg)),\n    totalCnt: newCnt + oldCnt\n  };\n}\n\nfunction cpaInputBlock(label, id, value, unit, oninput) {\n  return '<div><div class=\"cpa-field-label\">' + label + '</div><div class=\"cpa-input-wrap\" id=\"' + id + '_wrap\"><input id=\"' + id + '\" type=\"number\" min=\"0\" step=\"' + (unit === '万' ? '0.1' : '1') + '\" value=\"' + value + '\" oninput=\"' + oninput + '\"><span class=\"cpa-unit\">' + unit + '</span></div></div>';\n}\n\nfunction cpaFixedBlock(label, id, value, unit) {\n  return '<div><div class=\"cpa-field-label\">' + label + '</div><div class=\"cpa-fixed-wrap\" id=\"' + id + '_wrap\"><span class=\"cpa-fixed-val\" id=\"' + id + '_text\">' + value + '</span><span class=\"cpa-unit\">' + unit + '</span><input id=\"' + id + '\" type=\"hidden\" value=\"' + value + '\"></div></div>';\n}\n\nfunction buildCpaControlHtml(uid, model) {\n  return '<div class=\"cpa-control-panel\">' +\n    '<div class=\"cpa-control-head\">' +\n      '<div><div class=\"cpa-control-title\">新客 / 老客路径汇总</div></div>' +\n      '<div class=\"cfa-total-pill\"><span id=\"cpaTotalCntText_' + uid + '\">' + model.total.cnt + '</span>人 · 客均 <span id=\"cpaTotalAvgText_' + uid + '\">' + model.total.avg + '</span> 万 · NBEV <span id=\"cpaTotalNbevText_' + uid + '\">' + model.total.nbev + '</span> 万</div>' +\n    '</div>' +\n    '<div class=\"cpa-control-grid\">' +\n      '<div class=\"cpa-input-card total\"><div class=\"cpa-input-title\"><span class=\"tp-level-dot\" style=\"background:#1e40af;\"></span>新客+老客合计</div>' +\n        cpaFixedBlock('投保人数', 'cpaTotalCnt_' + uid, model.total.cnt, '人') +\n        cpaFixedBlock('客均NBEV', 'cpaTotalAvg_' + uid, model.total.avg, '万') +\n      '</div>' +\n      '<div class=\"cpa-input-card new\"><div class=\"cpa-input-title\"><span class=\"tp-level-dot\" style=\"background:#2563eb;\"></span>新客</div><div class=\"cpa-inline-inputs\">' +\n        cpaInputBlock('投保人数', 'cpaNewCnt_' + uid, model.typeTotals.new.cnt, '人', \"onCpaTypeCountChange('\" + uid + \"','new')\") +\n        cpaInputBlock('客均NBEV', 'cpaNewAvg_' + uid, model.typeTotals.new.avg, '万', \"onCpaSummaryChange('\" + uid + \"')\") +\n      '</div><div class=\"cpa-type-nbev\">NBEV <b><span id=\"cpaNewNbevText_' + uid + '\">' + model.typeTotals.new.nbev + '</span> 万</b></div></div>' +\n      '<div class=\"cpa-input-card old\"><div class=\"cpa-input-title\"><span class=\"tp-level-dot\" style=\"background:#16a34a;\"></span>老客</div><div class=\"cpa-inline-inputs\">' +\n        cpaInputBlock('投保人数', 'cpaOldCnt_' + uid, model.typeTotals.old.cnt, '人', \"onCpaTypeCountChange('\" + uid + \"','old')\") +\n        cpaInputBlock('客均NBEV', 'cpaOldAvg_' + uid, model.typeTotals.old.avg, '万', \"onCpaSummaryChange('\" + uid + \"')\") +\n      '</div><div class=\"cpa-type-nbev\">NBEV <b><span id=\"cpaOldNbevText_' + uid + '\">' + model.typeTotals.old.nbev + '</span> 万</b></div></div>' +\n    '</div>' +\n  '</div>';\n}\n\nfunction cpaMini(label, value) {\n  return '<div class=\"cpa-mini\"><div class=\"cpa-mini-label\">' + label + '</div><div class=\"cpa-mini-val\">' + value + '</div></div>';\n}\n\nfunction cpaCellHtml(uid, model, ri, ci, revealed, confirmed) {\n  return '<div class=\"cpa-cell\" id=\"cpaCell_' + uid + '_' + ri + '_' + ci + '\">' +\n    '<div class=\"cpa-cell-main\">' +\n      cpaMini('人数', '<span id=\"cpaCellCnt_' + uid + '_' + ri + '_' + ci + '\">' + model.cnt[ri][ci] + '</span>人') +\n      cpaMini('NBEV', '<span id=\"cpaCellNbev_' + uid + '_' + ri + '_' + ci + '\">' + model.nbev[ri][ci] + '</span>万') +\n      cpaMini('客均', '<span id=\"cpaCellAvg_' + uid + '_' + ri + '_' + ci + '\">' + model.avg[ri][ci] + '</span>万') +\n    '</div>' +\n  '</div>';\n}\n\nfunction cpaTotalCell(cnt, nbev, avg, extraClass) {\n  return '<div class=\"cpa-cell cpa-total-cell ' + (extraClass || '') + '\"><div class=\"cpa-cell-main\">' +\n    cpaMini('人数', cnt + '人') +\n    cpaMini('NBEV', nbev + '万') +\n    cpaMini('客均', avg + '万') +\n  '</div></div>';\n}\n\nfunction buildCpaMatrixHtml(uid, model, revealed, confirmed) {\n  var html = '<table class=\"cpa-table\"><thead><tr><th>客价 \\\\ 客温</th>';\n  GROUPED_COLS.forEach(function(cg) {\n    html += '<th><span class=\"tp-level-tag\"><span class=\"tp-level-dot\" style=\"background:' + cg.color + ';\"></span>' + cg.name + '</span></th>';\n  });\n  html += '<th>合计</th></tr></thead><tbody>';\n  GROUPED_ROWS.forEach(function(rg, ri) {\n    html += '<tr><td><div class=\"cpa-row-label\"><span class=\"tp-level-dot\" style=\"background:' + rg.color + ';\"></span>' + rg.name + '</div></td>';\n    GROUPED_COLS.forEach(function(cg, ci) { html += '<td>' + cpaCellHtml(uid, model, ri, ci, revealed, confirmed) + '</td>'; });\n    html += '<td>' + cpaTotalCell(model.rowTotals[ri].cnt, model.rowTotals[ri].nbev, model.rowTotals[ri].avg) + '</td></tr>';\n  });\n  html += '<tr><td><div class=\"cpa-row-label\">合计</div></td>';\n  GROUPED_COLS.forEach(function(cg, ci) {\n    html += '<td>' + cpaTotalCell(model.colTotals[ci].cnt, model.colTotals[ci].nbev, model.colTotals[ci].avg) + '</td>';\n  });\n  html += '<td>' + cpaTotalCell(model.total.cnt, model.total.nbev, model.total.avg, 'grid-grand-total') + '</td></tr>';\n  html += '</tbody></table>';\n  return html;\n}\n\nfunction cpaSetSummaryReadonly(uid, readonly) {\n  ['cpaTotalCnt_', 'cpaTotalAvg_', 'cpaNewCnt_', 'cpaNewAvg_', 'cpaOldCnt_', 'cpaOldAvg_'].forEach(function(prefix) {\n    var input = document.getElementById(prefix + uid);\n    var wrap = document.getElementById(prefix + uid + '_wrap');\n    if (input) input.readOnly = readonly;\n    if (wrap) wrap.classList.toggle('is-readonly', readonly);\n  });\n}\n\nfunction cpaSetStageMask(uid, locked) {\n  var stage = document.getElementById('cpaStageResult_' + uid);\n  if (stage) stage.classList.toggle('is-locked', !!locked);\n}\n\nfunction cpaApplyNumbers(uid, model) {\n  var setVal = function(id, val) { var el = document.getElementById(id); if (el) el.value = val; };\n  var setText = function(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; };\n  setVal('cpaTotalCnt_' + uid, model.total.cnt);\n  setVal('cpaTotalAvg_' + uid, model.total.avg);\n  setVal('cpaNewCnt_' + uid, model.typeTotals.new.cnt);\n  setVal('cpaNewAvg_' + uid, model.typeTotals.new.avg);\n  setVal('cpaOldCnt_' + uid, model.typeTotals.old.cnt);\n  setVal('cpaOldAvg_' + uid, model.typeTotals.old.avg);\n  setText('cpaTotalCnt_' + uid + '_text', model.total.cnt);\n  setText('cpaTotalAvg_' + uid + '_text', model.total.avg);\n  setText('cpaNewCnt_' + uid + '_text', model.typeTotals.new.cnt);\n  setText('cpaOldCnt_' + uid + '_text', model.typeTotals.old.cnt);\n  setText('cpaTotalCntText_' + uid, model.total.cnt);\n  setText('cpaTotalAvgText_' + uid, model.total.avg);\n  setText('cpaTotalNbevText_' + uid, model.total.nbev);\n  setText('cpaNewNbevText_' + uid, model.typeTotals.new.nbev);\n  setText('cpaOldNbevText_' + uid, model.typeTotals.old.nbev);\n  for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n    for (var ci = 0; ci < GROUPED_COLS.length; ci++) {\n      setText('cpaCellCnt_' + uid + '_' + ri + '_' + ci, model.cnt[ri][ci]);\n      setText('cpaCellNbev_' + uid + '_' + ri + '_' + ci, model.nbev[ri][ci]);\n      setText('cpaCellAvg_' + uid + '_' + ri + '_' + ci, model.avg[ri][ci]);\n      CLIENT_PATH_TYPE_CONFIG.forEach(function(cfg) {\n        var d = model.details[cfg.key][ri][ci];\n        setText('cpaDetailCnt_' + uid + '_' + cfg.key + '_' + ri + '_' + ci, d.cnt);\n        setText('cpaDetailNbev_' + uid + '_' + cfg.key + '_' + ri + '_' + ci, d.nbev);\n        setText('cpaDetailAvg_' + uid + '_' + cfg.key + '_' + ri + '_' + ci, d.avg);\n      });\n    }\n  }\n  window['cpaState_' + uid] = window['cpaState_' + uid] || {};\n  window['cpaState_' + uid].model = model;\n  window['cfaGrandCnt_' + uid] = model.total.cnt;\n  achievePlanValues.client = model.total.nbev;\n  updateAchieveSummary();\n}\n\nfunction cpaRender(uid, model, revealed, confirmed) {\n  var box = document.getElementById('cpaMatrixWrap_' + uid);\n  if (box) box.innerHTML = buildCpaMatrixHtml(uid, model, revealed, confirmed);\n  cpaApplyNumbers(uid, model);\n  cpaSetSummaryReadonly(uid, revealed || confirmed);\n  cpaSetStageMask(uid, !revealed);\n}\n\nfunction onCpaSummaryChange(uid) {\n  var s = cpaReadSummary(uid);\n  var totalEl = document.getElementById('cpaTotalCnt_' + uid);\n  if (totalEl) totalEl.value = s.totalCnt;\n  var model = cpaBuildModel(s.newCnt, s.newAvg, s.oldCnt, s.oldAvg);\n  var state = window['cpaState_' + uid] || {};\n  state.revealed = false;\n  state.confirmed = false;\n  state.model = model;\n  window['cpaState_' + uid] = state;\n  cpaRender(uid, model, false, false);\n  var btn = document.getElementById('cfaConfirmBtn_' + uid);\n  if (btn) { btn.disabled = false; var sp = btn.querySelector('span'); if (sp) sp.textContent = '确认'; }\n  var editBtn = document.getElementById('clientStep3EditBtn_' + uid);\n  if (editBtn) editBtn.style.display = 'none';\n  var bar = document.getElementById('clientStep3Bar_' + uid);\n  if (bar) bar.classList.remove('confirmed');\n  var titleEl = document.getElementById('clientStep3Title_' + uid);\n  var subEl = document.getElementById('clientStep3Sub_' + uid);\n  if (titleEl) titleEl.textContent = '请先确认新客 / 老客路径汇总数';\n  if (subEl) subEl.textContent = '';\n  var lockDiv = document.getElementById('achieveClient1vNLock');\n  var wrapDiv = document.getElementById('achieveClient1vNWrap');\n  if (lockDiv) { lockDiv.textContent = '请先确认新客 / 老客路径汇总数，确认后自动生成活动次数建议'; lockDiv.style.display = ''; }\n  if (wrapDiv) { wrapDiv.innerHTML = ''; wrapDiv.style.display = 'none'; }\n}\n\nfunction onCpaTypeCountChange(uid, changedType) {\n  onCpaSummaryChange(uid);\n}\n\nfunction onCpaRefPeriodChange(uid, value) {\n  var hint = document.getElementById('cpaRefHint_' + uid);\n  if (!hint) return;\n  var parts = (value || '').split('-');\n  var label = parts.length === 2 ? (parseInt(parts[0], 10) + '年' + parseInt(parts[1], 10) + '月') : value;\n  hint.textContent = '当前对比期间：' + label;\n}\n\nfunction onCpaTotalChange(uid) {\n  var total = cpaInt('cpaTotalCnt_' + uid, CLIENT_PATH_DEFAULTS.newCnt + CLIENT_PATH_DEFAULTS.oldCnt);\n  var newCnt = cpaInt('cpaNewCnt_' + uid, CLIENT_PATH_DEFAULTS.newCnt);\n  if (newCnt > total) newCnt = total;\n  var oldCnt = Math.max(0, total - newCnt);\n  var newEl = document.getElementById('cpaNewCnt_' + uid);\n  var oldEl = document.getElementById('cpaOldCnt_' + uid);\n  if (newEl) newEl.value = newCnt;\n  if (oldEl) oldEl.value = oldCnt;\n  onCpaSummaryChange(uid);\n}\n\nfunction cpaModelFromDetails(uid) {\n  var details = { new: [], old: [] };\n  CLIENT_PATH_TYPE_CONFIG.forEach(function(cfg) {\n    for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n      details[cfg.key].push([]);\n      for (var ci = 0; ci < GROUPED_COLS.length; ci++) {\n        var cnt = cpaInt('cpaDetailCnt_' + uid + '_' + cfg.key + '_' + ri + '_' + ci, 0);\n        var nbev = cpaRound1(cpaNum('cpaDetailNbev_' + uid + '_' + cfg.key + '_' + ri + '_' + ci, 0));\n        details[cfg.key][ri].push({ cnt: cnt, nbev: nbev, avg: cnt > 0 ? cpaRound1(nbev / cnt) : 0 });\n      }\n    }\n  });\n  return cpaSummarize(details);\n}\n\nfunction onCpaDetailChange(uid) {\n  var model = cpaModelFromDetails(uid);\n  cpaApplyNumbers(uid, model);\n}\n\nfunction commitClientPathModel(uid, model) {\n  adjustedClientMatrix = expandGroupedMatrixToFull(model.cnt);\n  clientConfirmedGroupData = { nbev: model.nbev, cnt: model.cnt };\n  clientAdjustedPredictedNbev = model.total.nbev;\n  window['cfaGrandCnt_' + uid] = model.total.cnt;\n}\n\nfunction appendClientAchieveCard() {\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row client-achieve-added';\n\n  var uid = '_ca_' + Date.now();\n  var target = userNbevTarget || 300;\n  var matrix = getClientMatrix();\n\n  // Calculate total NBEV from 2D matrix\n  var rawNbev = 0;\n  var grandTotal = 0;\n  clientData.value.forEach(function(v, vi) {\n    clientData.temperature.forEach(function(t, ti) {\n      var cnt = matrix[vi][ti];\n      rawNbev += getCellNbev(vi, ti, cnt);\n      grandTotal += cnt;\n    });\n  });\n  rawNbev = Math.round(rawNbev * 10) / 10;\n\n  // After client adjustment: use stored confirmed NBEV, otherwise random scale-up\n  var predictedNbev;\n  if (clientAdjustedPredictedNbev !== null) {\n    predictedNbev = clientAdjustedPredictedNbev;\n    clientAdjustedPredictedNbev = null; // consume once\n  } else if (rawNbev < target) {\n    predictedNbev = Math.round(target * (1.02 + Math.random() * 0.06) * 10) / 10;\n  } else {\n    predictedNbev = rawNbev;\n  }\n\n  var achieveRate = Math.round(predictedNbev / target * 1000) / 10;\n  var isOnTrack = true;\n  var gap = 0;\n  var nbevScale = rawNbev > 0 ? predictedNbev / rawNbev : 1;\n  clientAchievedNbevScale = nbevScale;\n\n  // Build 4x4 grid table: rows=A/BC/DEF/合计, cols=冷却/低温/中高温/合计\n  var gm = buildGroupedMatrix();\n\n  // If confirmed group data exists, override groupedCellNbev with exact stored values\n  var _confirmedData = clientConfirmedGroupData;\n  clientConfirmedGroupData = null; // consume once\n\n  // Compute grouped-cell NBEV: use confirmed values if available, else scale from raw\n  function groupedCellNbev(rg, cg) {\n    var ri = GROUPED_ROWS.indexOf(rg), ci = GROUPED_COLS.indexOf(cg);\n    if (_confirmedData && ri >= 0 && ci >= 0) {\n      return _confirmedData.nbev[ri][ci];\n    }\n    var n = 0;\n    rg.valIdxs.forEach(function(vi) {\n      cg.tempIdxs.forEach(function(ti) {\n        n += getCellNbev(vi, ti, (matrix[vi] && matrix[vi][ti]) || 0);\n      });\n    });\n    return Math.round(n * nbevScale * 10) / 10;\n  }\n\n  // Use confirmed counts for gm when re-rendering after adjustment\n  if (_confirmedData) {\n    GROUPED_ROWS.forEach(function(rg, ri) {\n      GROUPED_COLS.forEach(function(cg, ci) { gm[ri][ci] = _confirmedData.cnt[ri][ci]; });\n    });\n  }\n\n  // Column totals (合计 row at bottom)\n  var colTotals = [];\n  var colNbevs = [];\n  for (var ci = 0; ci < GROUPED_COLS.length; ci++) {\n    var colSum = 0;\n    var colNbevSum = 0;\n    for (var ri = 0; ri < GROUPED_ROWS.length; ri++) {\n      colSum += gm[ri][ci];\n      colNbevSum += groupedCellNbev(GROUPED_ROWS[ri], GROUPED_COLS[ci]);\n    }\n    colTotals.push(colSum);\n    colNbevs.push(Math.round(colNbevSum * 10) / 10);\n  }\n  var totalCount = 0; colTotals.forEach(function(c) { totalCount += c; });\n\n  function make3val(cnt, nbev) {\n    var avg = cnt > 0 ? Math.round(nbev / cnt * 10) / 10 : 0;\n    return '<div class=\"cag-cell\">' +\n      '<div class=\"cag-cell-count\">' + cnt + '人</div>' +\n      '<div class=\"cag-cell-sub\">' + nbev + '万 · 均' + avg + '万</div>' +\n    '</div>';\n  }\n  function makeTotalCol(cnt, nbev, color) {\n    return '<div class=\"cag-col-total\">' +\n      '<div class=\"cag-col-total-count\">' + cnt + '人</div>' +\n      '<div class=\"cag-col-total-nbev\">' + nbev + '万</div>' +\n    '</div>';\n  }\n  function makeRowTotal(cnt, nbev) {\n    return '<div class=\"cag-row-total\">' +\n      '<div class=\"cag-row-total-count\">' + cnt + '人</div>' +\n      '<div class=\"cag-row-total-nbev\">' + nbev + '万</div>' +\n    '</div>';\n  }\n\n  // Header row\n  var tableHtml = '<table class=\"cag-table\"><thead><tr><th>客价 \\\\ 客温</th>';\n  GROUPED_COLS.forEach(function(cg) {\n    tableHtml += '<th style=\"color:' + cg.color + ';\">' +\n      '<span style=\"display:inline-block;width:6px;height:6px;border-radius:50%;background:' + cg.color + ';margin-right:3px;vertical-align:middle;\"></span>' +\n      cg.name + '</th>';\n  });\n  tableHtml += '<th style=\"font-weight:700;color:var(--text-primary);\">合计</th></tr></thead><tbody>';\n\n  // Data rows\n  GROUPED_ROWS.forEach(function(rg, ri) {\n    var rowSum = 0, rowNbev = 0, cells = '';\n    GROUPED_COLS.forEach(function(cg, ci) {\n      var cnt = gm[ri][ci];\n      var cn = groupedCellNbev(rg, cg);\n      rowSum += cnt; rowNbev += cn;\n      cells += '<td>' + make3val(cnt, cn) + '</td>';\n    });\n    rowNbev = Math.round(rowNbev * 10) / 10;\n    tableHtml += '<tr><td><span class=\"tp-level-tag\"><span class=\"tp-level-dot\" style=\"background:' + rg.color + ';\"></span>' + rg.name + '</span></td>' +\n      cells + '<td>' + makeTotalCol(rowSum, rowNbev, rg.color) + '</td></tr>';\n  });\n\n  // 合计 row (no colored borders)\n  tableHtml += '<tr><td style=\"font-weight:600;font-size:12px;color:var(--text-secondary);\">合计</td>';\n  colTotals.forEach(function(c, ci) {\n    tableHtml += '<td>' + makeRowTotal(c, colNbevs[ci]) + '</td>';\n  });\n  tableHtml += '<td><div class=\"cag-grand\"><div class=\"cag-grand-count\">' + totalCount + '人</div><div class=\"cag-grand-nbev\">' + predictedNbev + '万</div></div></td></tr>';\n\n  tableHtml += '</tbody></table>';\n\n  // ── 客户达成测算 AI研判动态指标 ──────────────────────────────\n  // 高价值热温客（A × 中高温 + A × 低温）\n  var keyGroupCnt  = gm[0][2] + gm[0][1];\n vEl) nbevEl.textContent = nbev;\n        // 人数占比\n        var hcPctEl = document.getElementById('tdRowHcPct' + uid + '_' + i);\n        if (hcPctEl) hcPctEl.textContent = inServiceCount > 0 ? (cnt / inServiceCount * 100).toFixed(1) + '%' : '—';\n      } else {\n        rowNbevs.push(0);\n      }\n    }\n    if (nbevPerInp) {\n      if (isNaN(parseFloat(nbevPerInp.value)) || parseFloat(nbevPerInp.value) < 0) {\n        nbevPerInp.classList.add('td-input-error');\n        hasError = true;\n      } else {\n        nbevPerInp.classList.remove('td-input-error');\n      }\n    }\n  });\n\n  // NBEV占比 (computed after totalNbev is known)\n  rowNbevs.forEach(function(nbev, i) {\n    var pctEl = document.getElementById('tdRowNbevPct' + uid + '_' + i);\n    if (pctEl) pctEl.textContent = totalNbev > 0 ? (nbev / totalNbev * 100).toFixed(1) + '%' : '—';\n  });\n\n  var nonActiveVal = inServiceCount - activeSum;\n  var nonActiveEl  = document.getElementById('tdNonActive' + uid);\n  var totalNbevEl  = document.getElementById('tdTotalNbev' + uid);\n  var totalHcEl    = document.getElementById('tdTotalHc' + uid);\n  var errorEl      = document.getElementById('tdError' + uid);\n  var errorTextEl  = document.getElementById('tdErrorText' + uid);\n\n  if (nonActiveEl) nonActiveEl.textContent = nonActiveVal >= 0 ? nonActiveVal : 0;\n  if (totalNbevEl) totalNbevEl.textContent = (Math.round(totalNbev * 10) / 10) + '万';\n  if (totalHcEl)   totalHcEl.textContent = inServiceCount;\n\n  // 钻石及以上占比 — combined total of indices 0-3\n  var _diaTotalEl = document.getElementById('tdDiaTotalPct' + uid);\n  if (_diaTotalEl) {\n    var _diaCntSum = 0;\n    for (var _di = 0; _di < 4; _di++) {\n      var _diaInp = document.querySelector('.td-input[data-type=\"count\"][data-idx=\"' + _di + '\"][data-uid=\"' + uid + '\"]');\n      _diaCntSum += _diaInp ? (parseInt(_diaInp.value) || 0) : 0;\n    }\n    _diaTotalEl.textContent = inServiceCount > 0 ? (_diaCntSum / inServiceCount * 100).toFixed(1) + '%' : '—';\n  }\n\n  if (hasError) {\n    if (errorEl) errorEl.classList.add('visible');\n    if (errorTextEl) errorTextEl.textContent = '请输入有效的非负数值';\n  } else if (nonActiveVal < 0) {\n    if (errorEl) errorEl.classList.add('visible');\n    if (errorTextEl) errorTextEl.textContent = '各层级人数之和不能超过在职人力 ' + inServiceCount + ' 人（当前超出 ' + Math.abs(nonActiveVal) + ' 人）';\n    if (nonActiveEl) nonActiveEl.style.color = 'var(--accent-red)';\n  } else {\n    if (errorEl) errorEl.classList.remove('visible');\n    if (nonActiveEl) nonActiveEl.style.color = '';\n  }\n}\n\nfunction resetDistInputs(uid) {\n  var countInputs   = document.querySelectorAll('.td-input[data-type=\"count\"][data-uid=\"' + uid + '\"]');\n  var nbevPerInputs = document.querySelectorAll('.td-input[data-type=\"nbevper\"][data-uid=\"' + uid + '\"]');\n  var nbevPers = window['_tdNbevPer_' + uid] || [];\n  var activeNames = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];\n  var editIdx = 0;\n  achieveData.levels.forEach(function(lv) {\n    if (activeNames.indexOf(lv.name) !== -1) {\n      if (countInputs[editIdx]) {\n        countInputs[editIdx].value = lv.count;\n        countInputs[editIdx].classList.remove('td-input-error');\n      }\n      if (nbevPerInputs[editIdx]) {\n        nbevPerInputs[editIdx].value = nbevPers[editIdx] !== undefined ? nbevPers[editIdx] : lv.nbevPer;\n        nbevPerInputs[editIdx].classList.remove('td-input-error');\n      }\n      editIdx++;\n    }\n  });\n  onDistInputChange(uid);\n}\n\nfunction confirmDistAdjust(uid) {\n  var countInputs   = document.querySelectorAll('.td-input[data-type=\"count\"][data-uid=\"' + uid + '\"]');\n  var nbevPerInputs = document.querySelectorAll('.td-input[data-type=\"nbevper\"][data-uid=\"' + uid + '\"]');\n  var inServiceCount = window['_tdInService_' + uid] || 0;\n  var activeNames = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];\n  var newLevels = [];\n  var activeSum = 0;\n  var editIdx = 0;\n\n  achieveData.levels.forEach(function(lv) {\n    if (activeNames.indexOf(lv.name) != adjustThinkingExpanded = false;\n\nfunction appendAdjustThinkingCard() {\n  // Remove old thinking card if exists\n  var oldThink = document.querySelector('.adjust-thinking-card-added');\n  if (oldThink) oldThink.remove();\n\n  adjustThinkingFullText = '';\n  adjustThinkingExpanded = false;\n\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row adjust-thinking-card-added';\n  row.innerHTML = '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble tool-bubble\">' +\n      '<div class=\"thinking-card\">' +\n        '<div class=\"thinking-header\">' +\n          '<div class=\"thinking-spinner\" id=\"adjustThinkingSpinner\"></div>' +\n          '<span id=\"adjustThinkingLabel\">思考中...</span>' +\n        '</div>' +\n        '<div class=\"thinking-body collapsed\" id=\"adjustThinkingBody\"></div>' +\n        '<button class=\"thinking-toggle\" id=\"adjustThinkingToggle\" onclick=\"toggleAdjustThinking()\">' +\n          '<span id=\"adjustThinkingToggleText\">展开全部</span>' +\n          '<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9 12 15 18 9\"/></svg>' +\n        '</button>' +\n      '</div>' +\n    '</div>';\n  msgs.appendChild(row);\n  msgs.scrollTop = msgs.scrollHeight;\n\n  typewriteAdjustThinking(0, 0);\n}\n\nfunction typewriteAdjustThinking(lineIdx, charIdx) {\n  if (lineIdx >= adjustThinkingTexts.length) {\n    var cursor = document.querySelector('#adjustThinkingBody .cursor');\n    if (cursor) cursor.remove();\n    var spinner = document.getElementById('adjustThinkingSpinner');\n    if (spinner) spinner.classList.add('done');\n    var label = document.getElementById('adjustThinkingLabel');\n    if (label) label.textContent = '思考完成';\n\n    // Sync adjusted levels back into achieveData so appendTeamAchieveCard reads new values\n    if (adjustedLevels) { achieveData.levels = adjustedLevels; }\n    var old1 = document.querySelector('.team-achieve-added');\n    if (old1) old1.remove();\n    setTimeout(function(){ appendTeamAchieveCard(); }, 600);\n    return;\n  }\n\n  var body = document.getElementById('adjustThinkingBody');\n  if (!body) return;\n\n  var line = adjustThinkingTexts[lineIdx];\n\n  if (charIdx === 0 && lineIdx > 0) {\n    adjustThinkingFullText += ' ';\n  }\n\n  if (charIdx < line.length) {\n    adjustThinkingFullText += line[charIdx];\n    body.innerHTML = adjustThinkingFullText + '<span class=\"cursor\"></span>';\n\n    // Check overflow\n    var toggle = document.getElementById('adjustThinkingToggle');\n    if (toggle && body.scrollHeight > body.clientHeight + 4) {\n      toggle.classList.add('visible');\n    }\n\n    if (!adjustThinkingExpanded) {\n      body.scrollTop = body.scrollHeight;\n    }\n\n    var msgs = document.querySelector('.chat-messages');\n    msgs.scrollTop = msgs.scrollHeight;\n\n    setTimeout(function() { typewriteAdjustThinking(lineIdx, charIdx + 1); }, 30);\n  } else {\n    setTimeout(function() { typewriteAdjustThinking(lineIdx + 1, 0); }, 300);\n  }\n}\n\nfunction toggleAdjustThinking() {\n  var body = document.getElementById('adjustThinkingBody');\n  var toggle = document.getElementById('adjustThinkingToggle');\n  var label = document.getElementById('adjustThinkingToggleText');\n  if (!body) return;\n\n  adjustThinkingExpanded = !adjustThinkingExpanded;\n\n  if (adjustThinkingExpanded) {\n    body.classList.remove('collapsed');\n    body.style.maxHeight = body.scrollHeight + 'px';\n    label.textContent = '收起';\n    toggle.classList.add('expanded');\n  } else {\n    body.classList.add('collapsed');\n    body.style.maxHeight = '';\n    label.textContent = '展开全部';\n    toggle.classList.remove('expanded');\n    body.scrollTop = body.scrollHeight;\n  }\n}\n\n// ===== Atomic Tool: Team Premium Estimation Card (队伍保费测算) =====\nfunction appendTeamPremiumCard() {\n oductPieLegend(uid, pieData);\n  appendAchieveAdjustCard('product');\n\n  if (!multiPathInProgress) setGenerating(false);\n}\n\n// ===== Product Distribution: Add / Delete product =====\nfunction _getProdDistAddPool(uid) {\n  var table = document.getElementById('prodDistTable_' + uid);\n  var shown = {};\n  if (table) {\n    table.querySelectorAll('.prod-group').forEach(function(g) {\n      shown[g.getAttribute('data-name')] = true;\n    });\n  }\n  return _prodDistPool.filter(function(p) { return !shown[p.name]; });\n}\n\nfunction _closeProdDistPanels(uid) {\n  var ap = document.getElementById('addProdPanel_' + uid);\n  var dp = document.getElementById('delProdPanel_' + uid);\n  if (ap) ap.style.display = 'none';\n  if (dp) dp.style.display = 'none';\n}\n\nfunction showAddProductPanel(uid) {\n  var addPanel = document.getElementById('addProdPanel_' + uid);\n  var delPanel = document.getElementById('delProdPanel_' + uid);\n  if (!addPanel) return;\n  if (delPanel) delPanel.style.display = 'none';\n  if (addPanel.style.display !== 'none') { addPanel.style.display = 'none'; return; }\n\n  _prodDistCurrentPool = _getProdDistAddPool(uid);\n  var html = '';\n  if (!_prodDistCurrentPool.length) {\n    html = '<div style=\"padding:8px 10px;font-size:12px;color:var(--text-muted);\">没有更多可添加的产品</div>';\n  } else {\n    html += '<div class=\"prod-dist-panel-label\">选择要增加的产品</div>';\n    _prodDistCurrentPool.forEach(function(p, i) {\n      html += '<div class=\"prod-dist-panel-item\" onclick=\"doAddProduct(\\'' + uid + '\\',' + i + ')\">' +\n        '<span style=\"width:8px;height:8px;border-radius:50%;background:' + p.color + ';flex-shrink:0;display:inline-block;\"></span>' +\n        '<span>' + p.short + '</span>' +\n      '</div>';\n    });\n  }\n  addPanel.innerHTML = html;\n  addPanel.style.display = 'block';\n}\n\nfunction doAddProduct(uid, poolIdx) {\n  _closeProdDistPanels(uid);\n  var p = _prodDistCurrentPool[poolIdx];\n  if (!p) return;\n\n  var table = document.getElementById('prodDistTable_' + uid);\n  var totalTbody = document.getElementById('prodDistTotal_' + uid);\n  if (!table || !totalTbody) return;\n\n  var target = userNbevTarget || 300;\n  var newNbev = Math.round(target * (0.07 + Math.random() * 0.05) * 10) / 10;\n  var groupId = 'prodGroup_' + (_prodGroupCounter++) + '_' + uid;\n\n  var newTbody = document.createElement('tbody');\n  newTbody.id = groupId;\n  newTbody.className = 'prod-group';\n  newTbody.setAttribute('data-name', p.name);\n  newTbody.setAttribute('data-nbev', newNbev);\n  newTbody.innerHTML =\n    '<tr>' +\n      '<td style=\"text-align:left;vertical-align:middle;font-size:11px;line-height:1.4;padding-left:6px;\">' + p.short + '<br><span style=\"font-size:10px;color:var(--text-muted);\">附推</span></td>' +\n      '<td style=\"text-align:left;\">综合</td>' +\n      '<td>120</td>' +\n      '<td>' + p.actRate + '%</td>' +\n      '<td>' + p.pp + '</td>' +\n      '<td>' + p.fyp.toLocaleString() + '</td>' +\n      '<td>' + p.margin + '%</td>' +\n      '<td style=\"font-weight:600;\">' + newNbev + '</td>' +\n      '<td>—</td>' +\n    '</tr>';\n\n  table.insertBefore(newTbody, totalTbody);\n  newTbody.style.opacity = '0';\n  newTbody.style.transition = 'opacity 0.25s';\n  setTimeout(function() { newTbody.style.opacity = '1'; }, 20);\n\n  _refreshProdDistTotals(uid);\n  _updateProdDistBtnState(uid);\n}\n\nfunction showDeleteProductPanel(uid) {\n  var delPanel = document.getElementById('delProdPanel_' + uid);\n  var addPanel = document.getElementById('addProdPanel_' + uid);\n  if (!delPanel) return;\n  if (addPanel) addPanel.style.display = 'none';\n  if (delPanel.style.display !== 'none') { delPanel.style.display = 'none'; return; }\n\n  var table = document.getElementById('prodDistTable_' + uid);\n  if (!table) return;\n  var groups = table.querySelectorAll('.prod-group');\n\n  var html = '';\n  if (groups.length <= 1) {\n    html = '<div style=\"padding:8px 10px;font-size:12px;color:var(--text-muted);\">至少保留一种产品</div>';\n  } else {\n    html += '<div class=\"prod-dist-panel-label\">选择要删除的产品</div>';\n    groups.forEach(function(g) {\n      var name = g.getAttribute('data-name') || '';\n      var shortName = name.replace(/（[^）]*）/g, '').trim() || name;\n      var gid = g.id;\n      html += '<div class=\"prod-dist-panel-item danger\" onclick=\"doDeleteProduct(\\'' + uid + '\\',\\'' + gid + '\\')\">' +\n        '<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2\"/></svg>' +\n        '<span>' + shortName + '</span>' +\n      '</div>';\n    });\n  }\n  delPanel.innerHTML = html;\n  delPanel.style.display = 'block';\n}\n\nfunction doDeleteProduct(uid, groupId) {\n  _closeProdDistPanels(uid);\n  var table = document.getElementById('prodDistTable_' + uid);\n  if (!table) return;\n  if (table.querySelectorAll('.prod-group').length <= 1) return;\n\n  var groupEl = document.getElementById(groupId);\n  if (!groupEl) return;\n  groupEl.style.transition = 'opacity 0.2s';\n  groupEl.style.opacity = '0';\n  setTimeout(function() {\n    if (groupEl.parentNode) groupEl.parentNode.removeChild(groupEl);\n    _refreshProdDistTotals(uid);\n    _updateProdDistBtnState(uid);\n  }, 200);\n}\n\nfunction _refreshProdDistTotals(uid) {\n  var table = document.getElementById('prodDistTable_' + uid);\n  if (!table) return;\n  var total = 0;\n  table.querySelectorAll('.prod-group').forEach(function(g) {\n    total += parseFloat(g.getAttribute('data-nbev')) || 0;\n  });\n  total = Math.round(total * 10) / 10;\n\n  var el1 = document.getElementById('prodDistTotalNbev_' + uid);\n  if (el1) el1.textContent = total;\n  var el2 = document.getElementById('prodDistPredNbev_' + uid);\n  if (el2) el2.textContent = total;\n  var el3 = document.getElementById('prodPieCenterVal_' + uid);\n  if (el3) el3.textContent = total;\n}\n\nfunction _updateProdDistBtnState(uid) {\n  var table = document.getElementById('prodDistTable_' + uid);\n  if (!table) return;\n  var count = table.querySelectorAll('.prod-group').length;\n  var addBtn = document.getElementById('addProdBtn_' + uid);\n  if (addBtn) addBtn.disabled = (count >= 5 || _getProdDistAddPool(uid).length === 0);\n  var delBtn = document.getElementById('delProdBtn_' + uid);\n  if (delBtn) delBtn.disabled = (count <= 1);\n}\n\nfunction triggerProductNextStep(name) {\n  var nextRow = document.querySelector('.product-achieve-next-row');\n  if (nextRow) fadeOutCard(nextRow);\n\n  if (name === '调整目标值') {\n    appendUserBubble('我要调整目标');\n    routeQuery('我要调整目标');\n  } else if (name === '调整产品分布') {\n    appendUserBubble('我要调整产品分布');\n    setTimeout(function() { appendProductFeeCalcCard(); }, 600);\n  } else if (name === '调整辅推产品') {\n    appendUserBubble('我要调整辅推产品');\n    setTimeout(function() { appendSubProductSelectCard(); }, 600);\n  }\n}\n\nfunction appendSubProductSelectCard() {\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row sub-product-select-row';\n\n  var subOptionsHtml = '';\n  productData.subProducts.forEach(function(p, i) {\n    var isSelected = (selectedSubProduct && selectedSubProduct.name === p.name);\n    subOptionsHtml += '<div class=\"path-option' + (isSelected ? ' selected current-sub' : '') + '\" onclick=\"selectSubProduct(this, ' + i + ')\">' +\n      '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n      '<div class=\"path-option-label\">' + p.name + (isSelected ? ' <span style=&quot;font-size:11px;color:var(--text-muted);font-weight:400;&quot;>(当前)</span>' : '') + '</div>' +\n    '</div>';\n  });\n\n  row.innerHTML = '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble\">' +\n      '<div class=\"path-response-header\" style=\"display:flex;align-items:center;gap:6px;\">' +\n        '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><path d=\"M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z\"/></svg>' +\n        '<span style=\"font-weight:600;color:var(--text-primary);\">调整辅推产品</span>' +\n      '</div>' +\n      '<div style=\"font-size:13px;color:var(--text-secondary);margin:8px 0 4px;line-height:1.6;\">当前主推：<strong style=\"color:var(--text-primary);\">' + selectedMainProduct.name + '</strong></div>' +\n      '<div style=\"font-size:13px;color:var(--text-secondary);margin:0 0 12px;line-height:1.6;\">请选择辅推产品：</div>' +\n      '<div class=\"path-options-wrap\">' + subOptionsHtml + '</div>' +\n    '</div>';\n  msgs.appendChild(row);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nfunction selectSubProduct(el, idx) {\n  var wrap = el.closest('.path-options-wrap');\n  wrap.querySelectorAll('.path-option').forEach(function(o) { o.classList.remove('selected'); });\n  el.classList.add('selected');\n\n  selectedSubProduct = productData.subProducts[idx];\n\n  var cardRow = el.closest('.sub-product-select-row');\n  fadeOutCard(cardRow);\n\n  // Remove old product achieve card\n  var oldCard = document.querySelector('.product-achieve-added');\n  if (oldCard) oldCard.classList.remove('product-achieve-added');\n  var oldNext = document.querySelector('.product-achieve-next-row');\n  if (oldNext) fadeOutCard(oldNext);\n\n  appendUserBubble('辅推产品调整为：' + selectedSubProduct.name);\n\n  // Recalculate: main stays, sub fills the gap to exceed target\n  var target = userNbevTarget || 300;\n  var gap = target - selectedMainProduct._contrib;\n  selectedSubProduct._contrib = Math.round((gap * (1.04 + Math.random() * 0.06)) * 10) / 10;\n\n  // Show thinking card first, then product achieve card\n  setTimeout(function() { appendProductSubThinkingCard(); }, 500);\n}\n\n// ===== Product sub-product adjustment thinking card =====\nvar prodSubThinkingTexts = [\n  '正在重新评估辅推产品与主推产品的客群匹配度...',\n  '对比各辅推产品的件均NBEV贡献与历史转化率...',\n  '基于新的产品组合，重新计算NBEV预测达成值...',\n  '评估交叉销售可行性与产品互补性，优化组合策略...',\n  '正在生成调整后的产品达成测算结果...'\n];\nvar prodSubThinkFullText = '';\nvar prodSubThinkExpanded = false;\n\nfunction appendProductSubThinkingCard() {\n  // Remove old product thinking card if exists\n  var oldThink = document.querySelector('.prod-sub-thinking-added');\n  if (oldThink) oldThink.remove();\n\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row prod-sub-thinking-added';\n  row.innerHTML = '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble tool-bubble\">' +\n      '<div class=\"thinking-card\">' +\n        '<div class=\"thinking-header\">' +\n          '<div class=\"thinking-spinner\" id=\"prodSubThinkSpinner\"></div>' +\n          '<span id=\"prodSubThinkLabel\">思考中...</span>' +\n        '</div>' +\n        '<div class=\"thinking-body collapsed\" id=\"prodSubThinkBody\"></div>' +\n        '<button class=\"thinking-toggle\" id=\"prodSubThinkToggle\" onclick=\"toggleProdSubThinking()\">' +\n          '<span id=\"prodSubThinkToggleText\">展开全部</span>' +\n          '<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9 12 15 18 9\"/></svg>' +\n        '</button>' +\n      '</div>' +\n    '</div>';\n  msgs.appendChild(row);\n  msgs.scrollTop = msgs.scrollHeight;\n\n  prodSubThinkFullText = '';\n  prodSubThinkExpanded = false;\n  typewriteProdSubThinking(0, 0);\n}\n\nfunction typewriteProdSubThinking(lineIdx, charIdx) {\n  if (lineIdx >= prodSubThinkingTexts.length) {\n    var cursor = document.querySelector('#prodSubThinkBody .cursor');\n    if (cursor) cursor.remove();\n    var spinner = document.getElementById('prodSubThinkSpinner');\n    if (spinner) spinner.classList.add('done');\n    var label = document.getElementById('prodSubThinkLabel');\n    if (label) label.textContent = '思考完成';\n\n    setTimeout(function() { appendProductAchieveCard(); }, 600);\n    return;\n  }\n\n  var body = document.getElementById('prodSubThinkBody');\n  if (!body) return;\n\n  var line = prodSubThinkingTexts[lineIdx];\n\n  if (charIdx === 0 && lineIdx > 0) {\n    prodSubThinkFullText += ' ';\n  }\n\n  if (charIdx < line.length) {\n    prodSubThinkFullText += line[charIdx];\n    body.innerHTML = prodSubThinkFullText + '<span class=\"cursor\"></span>';\n\n    var toggle = document.getElementById('prodSubThinkToggle');\n    if (toggle && body.scrollHeight > body.clientHeight + 4) {\n      toggle.classList.add('visible');\n    }\n\n    if (!prodSubThinkExpanded) {\n      body.scrollTop = body.scrollHeight;\n    }\n\n    var msgs = document.querySelector('.chat-messages');\n    msgs.scrollTop = msgs.scrollHeight;\n\n    setTimeout(function() { typewriteProdSubThinking(lineIdx, charIdx + 1); }, 30);\n  } else {\n    setTimeout(function() { typewriteProdSubThinking(lineIdx + 1, 0); }, 300);\n  }\n}\n\nfunction toggleProdSubThinking() {\n  var body = document.getElementById('prodSubThinkBody');\n  var toggle = document.getElementById('prodSubThinkToggle');\n  var label = document.getElementById('prodSubThinkToggleText');\n  if (!body) return;\n\n  prodSubThinkExpanded = !prodSubThinkExpanded;\n\n  if (prodSubThinkExpanded) {\n    body.classList.remove('collapsed');\n    body.style.maxHeight = body.scrollHeight + 'px';\n    label.textContent = '收起';\n    toggle.classList.add('expanded');\n  } else {\n    body.classList.add('collapsed');\n    body.style.maxHeight = '';\n    label.textContent = '展开全部';\n    toggle.classList.remove('expanded');\n    body.scrollTop = body.scrollHeight;\n  }\n}\n\nfunction renderProductPieChart(uid, pieData) {\n  var R = 58, cx = 75, cy = 75, gap = 2;\n  var svg = '<svg viewBox=\"0 0 150 150\">';\n  var startAngle = -90;\n  var total = 0;\n  pieData.forEach(function(d) { total += d.pct; });\n\n  pieData.forEach(function(d) {\n    var angle = d.pct / total * 360;\n    var drawAngle = Math.max(angle - gap, 0.5);\n    var startRad = (startAngle + gap / 2) * Math.PI / 180;\n    var endRad = (startAngle + gap / 2 + drawAngle) * Math.PI / 180;\n    var x1 = cx + R * Math.cos(startRad);\n    var y1 = cy + R * Math.sin(startRad);\n    var x2 = cx + R * Math.cos(endRad);\n    var y2 = cy + R * Math.sin(endRad);\n    var large = drawAngle > 180 ? 1 : 0;\n\n    svg += '<path d=\"M' + cx + ',' + cy + ' L' + x1 + ',' + y1 +\n           ' A' + R + ',' + R + ' 0 ' + large + ',1 ' + x2 + ',' + y2 +\n           ' Z\" fill=\"' + d.color + '\" opacity=\"0.85\">' +\n           '<animate attributeName=\"opacity\" from=\"0\" to=\"0.85\" dur=\"0.5s\" fill=\"freeze\"/>' +\n           '</path>';\n    startAngle += angle;\n  });\n\n  svg += '<circle cx=\"' + cx + '\" cy=\"' + cy + '\" r=\"36\" fill=\"white\"/>';\n  svg += '</svg>';\n\n  var wrap = document.getElementById('prodPieChart' + uid);\n  if (wrap) {\n    var totalNbev = 0;\n    pieData.forEach(function(d) { totalNbev += d.nbev; });\n    wrap.innerHTML = svg +\n      '<div class=\"ta-pie-center\">' +\n        '<div class=\"ta-pie-center-val\" id=\"prodPieCenterVal_' + uid + '\">' + Math.round(totalNbev * 10) / 10 + '</div>' +\n        '<div class=\"ta-pie-center-label\">预测万元</div>' +\n      '</div>';\n  }\n}\n\nfunction renderProductPieLegend(uid, pieData) {\n  var html = '';\n  pieData.forEach(function(d) {\n    html += '<div class=\"ta-legend-item\">' +\n      '<div class=\"ta-legend-dot\" style=\"background:' + d.color + ';\"></div>' +\n      '<div class=\"ta-legend-name\">' + d.name + '</div>' +\n      '<div class=\"ta-legend-count\">' + d.nbev + '万</div>' +\n      '<div class=\"ta-legend-pct\">' + d.pct + '%</div>' +\n    '</div>';\n  });\n  var el = document.getElementById('prodPieLegend' + uid);\n  if (el) el.innerHTML = html;\n}\n\n// ===== 参考期间下拉选项（2025年1月 ~ 2026年5月，默认选2026年5月）=====\nfunction makeRefPeriodOpts() {\n  var opts = '';\n  for (var y = 2025; y <= 2026; y++) {\n    var endM = (y === 2026) ? 5 : 12;\n    for (var m = 1; m <= endM; m++) {\n      var val = y + '-' + (m < 10 ? '0' + m : m);\n      var sel = (y === 2026 && m === 5) ? ' selected' : '';\n      opts += '<option value=\"' + val + '\"' + sel + '>' + y + '年' + m + '月</option>';\n    }\n  }\n  return opts;\n}\nvar _refPeriodSelectStyle = 'font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-primary);cursor:pointer;font-family:inherit;';\n\n// ===== 产品保费测算卡片 =====\nvar feeCalcData = {};\nvar confirmedFeeRows = null; // set by confirmFeeCalc, consumed by appendProductAchieveCard\nvar feeMonthState = {};\n\n// 各缴期参数（相对于产品基准值的系数）\nvar _FEE_PERIOD_PARAMS = {\n  '趸缴':   { arF: 0.36, ppF: 0.90, fypM: 0.12, mgF: 0.62 },\n  '2年缴':  { arF: 0.56, ppF: 1.10, fypM: 0.22, mgF: 0.78 },\n  '6年缴':  { arF: 0.82, ppF: 0.95, fypM: 0.68, mgF: 0.82 },\n  '10年缴': { arF: 1.00, ppF: 1.00, fypM: 1.00, mgF: 1.00 },\n  '15年缴': { arF: 0.48, ppF: 1.18, fypM: 1.55, mgF: 1.34 }\n};\n\n// 每个产品适用的缴期列表\nfunction getProductPeriodNames(prodName) {\n  var n = prodName;\n  if (n.indexOf('医疗') >= 0 || n.indexOf('e生保') >= 0) return ['趸缴', '2年缴'];\n  if (n.indexOf('意外') >= 0 || n.indexOf('守护百分百') >= 0) return ['趸缴', '2年缴'];\n  if (n.indexOf('少儿') >= 0 || n.indexOf('儿童') >= 0)      return ['趸缴', '6年缴', '10年缴'];\n  if (n.indexOf('年金') >= 0)                                  return ['趸缴', '6年缴', '10年缴', '15年缴'];\n  if (n.indexOf('重疾') >= 0 || n.indexOf('六福') >= 0)       return ['趸缴', '6年缴', '10年缴', '15年缴'];\n  if (n.indexOf('万能险') >= 0)                                return ['趸缴', '6年缴', '10年缴', '15年缴'];\n  if (n.indexOf('寿险') >= 0 || n.indexOf('终身') >= 0 || n.indexOf('智盈') >= 0) return ['6年缴', '10年缴', '15年缴'];\n  return ['趸缴', '6年缴', '10年缴', '15年缴']; // 默认\n}\n\n// 根据产品名和基准参数生成 periodDefs\nfunction buildProdPeriodDefs(prodName, baseAr, basePp, baseMg) {\n  return getProductPeriodNames(prodName).map(function(pName) {\n    var p = _FEE_PERIOD_PARAMS[pName];\n    return {\n      name: pName,\n      ar:   Math.round(baseAr  * p.arF  * 10) / 10,\n      pp:   Math.round(basePp  * p.ppF  * 100) / 100,\n      fypM: p.fypM,\n      mg:   Math.round(baseMg  * p.mgF  * 10) / 10\n    };\n  });\n}\nfunction getFeeProductBase(prodName) {\n  var pool = (typeof productData !== 'undefined' ? (productData.mainProducts || []).concat(productData.subProducts || []) : []);\n  var found = null;\n  pool.forEach(function(p) {\n    if (p.name === prodName || prodName.indexOf(p.name) >= 0 || p.name.indexOf(prodName) >= 0) found = p;\n  });\n  if (found) return { ar: found.actRate || 35.9, pp: found.pp || 2.4, fyp: found.fyp || 2221, mg: found.margin || 1.6 };\n  var profile = null;\n  (typeof profileBaseProds !== 'undefined' ? profileBaseProds : []).forEach(function(p) {\n    if (p.name === prodName) profile = p;\n  });\n  return {\n    ar: profile ? profile.baseAct : 35.9,\n    pp: prodName.indexOf('年金') >= 0 ? 2.4 : 1.4,\n    fyp: prodName.indexOf('年金') >= 0 ? 2226 : 2221,\n    mg: prodName.indexOf('年金') >= 0 ? 2.4 : 1.6\n  };\n}\nfunction buildFeeReferenceRows(prodName, sharedHc) {\n  var base = getFeeProductBase(prodName);\n  return getProductPeriodNames(prodName).map(function(periodName) {\n    var param = _FEE_PERIOD_PARAMS[periodName] || _FEE_PERIOD_PARAMS['10年缴'];\n    var ar = Math.round(base.ar * param.arF * 10) / 10;\n    var pp = Math.round(base.pp * param.ppF * 10) / 10;\n    var fyp = Math.round(base.fyp * param.fypM);\n    var mg = Math.round(base.mg * param.mgF * 10) / 10;\n    var active = Math.round((sharedHc || 120) * ar / 100);\n    var policies = Math.round(active * pp);\n    return {\n      period: periodName,\n      activeCount: active,\n      policyCount: policies,\n      actRate: ar,\n      perPolicies: pp,\n      fyp: fyp,\n      margin: mg\n    };\n  });\n}\nfunction nbevOf(fyp, pp, hc, ar, mg) {\n  return Math.round(fyp * pp * hc * (ar / 100) * (mg / 100) / 10000 * 10) / 10;\n}\n\nfunction appendProductFeeCalcCard(targetWrap) {\n\n  var uid = 'fee' + Date.now();\n  var target = userNbevTarget || 300;\n\n  // Expand series name to individual product names.\n  // Only splits when brackets contain multiple products (separated by 、).\n  // Single-product entries keep the full series name.\n  function extractProdNames(seriesName) {\n    var m = seriesName.match(/（([^）]+)）/);\n    if (!m) return [seriesName];\n    var inner = m[1];\n    if (inner.indexOf('、') !== -1) {\n      return inner.split('、').map(function(s){ return s.trim(); });\n    }\n    return [seriesName]; // single product: use full name\n  }\n\n  // Build feeCalcData from prodAchieveRows (carry values from 产品达成测算).\n  // 件均FYP is back-calculated from the actual nbev so the formula stays consistent.\n  var srcRows = prodAchieveRows.length ? prodAchieveRows : [\n    { name: selectedMainProduct ? selectedMainProduct.name : '金越系列（平安御享金越(2026)终身寿险、平安御享金越年金保险）',\n      tag: '主推', color: '#2563eb', perPolicies: 1.6, headcount: 120, actRate: 68, margin: 24.5,\n      nbev: (selectedMainProduct && selectedMainProduct._contrib) || 195 },\n    { name: selectedSubProduct ? selectedSubProduct.name : '平安e生保（百万医疗险）',\n      tag: '辅推', color: '#10b981', perPolicies: 2.4, headcount: 120, actRate: 42, margin: 16.8,\n      nbev: (selectedSubProduct && selectedSubProduct._contrib) || 115 }\n  ];\n  if (!srcRows.some(function(r) { return r._groupKey === 'new_default_ref'; })) {\n    srcRows.push({\n      name: '智盈人生（平安智盈人生终身寿险）',\n      tag: '新产品',\n      color: '#ec4899',\n      perPolicies: 1.8,\n      headcount: 120,\n      actRate: 40,\n      margin: 18.5,\n      nbev: Math.round(target * 0.09 * 10) / 10,\n      _isNewProduct: true,\n      _groupKey: 'new_default_ref',\n      _refDefault: '平安御享金越年金保险'\n    });\n  }\n  if (!srcRows.some(function(r) { return r._groupKey === 'new_switched_ref'; })) {\n    srcRows.push({\n      name: '智盈人生（平安智盈人生终身寿险）',\n      tag: '新产品',\n      color: '#ec4899',\n      perPolicies: 1.8,\n      headcount: 120,\n      actRate: 40,\n      margin: 18.5,\n      nbev: Math.round(target * 0.08 * 10) / 10,\n      _isNewProduct: true,\n      _groupKey: 'new_switched_ref',\n      _refDefault: '平安智盈人生（万能险）'\n    });\n  }\n\n  feeCalcData[uid] = [];\n  srcRows.forEach(function(series) {\n    var names   = extractProdNames(series.name);\n    var n       = names.length;\n    var pp      = series.perPolicies;\n    var hc      = series.headcount;\n    var ar      = series.actRate;\n    var mg      = series.margin;\n    // Divide nbev equally across expanded products; back-calculate FYP per product\n    var nbevEach = Math.round(series.nbev / n * 10) / 10;\n    // FYP = nbev(万) × 10000 / (pp × hc × ar% × mg%)\n    var denominator = pp * hc * (ar / 100) * (mg / 100);\n    var calcFyp = denominator > 0 ? Math.round(nbevEach * 10000 / denominator) : (series.fyp || 28600);\n\n    // Last-year same-period baselines (2025年4月 去年同期)\n    var lyF = series.tag === '主推'\n      ? { ar: 0.955, pp: 0.9375, fyp: 0.968, mg: 1.02 }\n      : { ar: 0.952, pp: 0.9167, fyp: 0.982, mg: 0.997 };\n    var lyAr  = Math.round(ar       * lyF.ar  * 10)  / 10;\n    var lyPp  = Math.round(pp       * lyF.pp  * 100) / 100;\n    var lyFyp = Math.round(calcFyp  * lyF.fyp);\n    var lyMg  = Math.round(mg       * lyF.mg  * 10)  / 10;\n\n    names.forEach(function(prodName) {\n      var periodDefs = buildProdPeriodDefs(prodName, ar, pp, mg);\n      periodDefs.forEach(function(pDef) {\n        var pFyp = Math.round(calcFyp * pDef.fypM);\n        feeCalcData[uid].push({\n          name:        prodName,\n          tag:         series.tag,\n          period:      pDef.name,\n          color:       series.color,\n          fyp:         pFyp,\n          perPolicies: pDef.pp,\n          headcount:   hc,\n          actRate:     pDef.ar,\n          margin:      pDef.mg,\n          _isNewProduct: !!series._isNewProduct,\n          _groupKey:    series._groupKey || prodName,\n          _refDefault:  series._refDefault || '',\n          _origFyp:    pFyp,\n          _origPp:     pDef.pp,\n          _origHc:     hc,\n          _origAr:     pDef.ar,\n          _origMg:     pDef.mg,\n          _lyAr:       Math.round(pDef.ar  * lyF.ar  * 10)  / 10,\n          _lyPp:       Math.round(pDef.pp  * lyF.pp  * 100) / 100,\n          _lyFyp:      Math.round(pFyp     * lyF.fyp),\n          _lyMg:       Math.round(pDef.mg  * lyF.mg  * 10)  / 10\n        });\n      });\n    });\n  });\n\n  // Shared headcount: use headcount from first row (all rows share the same value)\n  var sharedHc = feeCalcData[uid].length ? feeCalcData[uid][0].headcount : 120;\n  feeCalcData[uid]._sharedHc = sharedHc;\n  var onRosterHc = Math.round(sharedHc * 1.15); // 在职人力（参考值，略高于可投入人力）\n\n  // First pass: collect NBEVs to compute initial pcts\n  // Derive 活动人数 and 件数 from existing actRate / perPolicies\n  var rowNbevs = [];\n  var totalNbev = 0;\n  feeCalcData[uid].forEach(function(r, i) {\n    r.headcount = sharedHc;\n    r.activeCount = Math.round(sharedHc * r.actRate / 100);\n    r.policyCount = Math.round(r.activeCount * r.perPolicies);\n    r._origAn  = r.activeCount;\n    r._origCnt = r.policyCount;\n    var nbev = Math.round(r.policyCount * r.fyp * (r.margin / 100) / 10000 * 10) / 10;\n    rowNbevs.push(nbev);\n    totalNbev += nbev;\n  });\n  totalNbev = Math.round(totalNbev * 10) / 10;\n  window['_feeRefProd_' + uid] = window['_feeRefProd_' + uid] || {};\n  feeCalcData[uid].forEach(function(r) {\n    var refKey = r._groupKey || r.name;\n    if ((r._isNewProduct || r.tag === '新产品') && r._refDefault && !window['_feeRefProd_' + uid][refKey]) {\n      window['_feeRefProd_' + uid][refKey] = r._refDefault;\n    }\n  });\n\n  // YoY badge: compares current value vs 去年同期 baseline\n  // Red(↑)=上升, Green(↓)=下降 (Chinese finance convention)\n  function yoyHtml(cur, ly) {\n    if (!ly) return '<span style=\"font-size:10px;color:#94a3b8;\">—</span>';\n    var chg = Math.round((cur - ly) / ly * 1000) / 10;\n    if (chg > 0)  return '<span style=\"font-size:10px;font-weight:600;color:#ef4444;white-space:nowrap;\">↑' + chg + '%</span>';\n    if (chg < 0)  return '<span style=\"font-size:10px;font-weight:600;color:#16a34a;white-space:nowrap;\">↓' + Math.abs(chg) + '%</span>';\n    return '<span style=\"font-size:10px;color:#94a3b8;\">持平</span>';\n  }\n  function yoySpan(uid, field, idx, cur, ly) {\n    return '<span id=\"' + uid + '_yoy_' + field + '_' + idx + '\" title=\"与2025年4月去年同期对比\" style=\"cursor:default;\">' + yoyHtml(cur, ly) + '</span>';\n  }\n  function feeCell(inputHtml, badge) {\n    return '<td style=\"white-space:nowrap;\"><div style=\"display:flex;align-items:center;gap:3px;\">' + inputHtml + badge + '</div></td>';\n  }\n\n  var achieveRate = Math.round(totalNbev / target * 1000) / 10;\n  var isOnTrack = achieveRate >= 100;\n\n  var innerHtml =\n      '<div class=\"cp-dim-section\" style=\"border-bottom:none;\">' +\n        '<div class=\"fee-formula-tip\">NBEV(万) 按活动率、人均件数、件均FYP与Margin自动测算；活动率与人均件数可直接修改，参考历史产品可用于导入对照明细。</div>' +\n        '<div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:6px 0 8px;font-size:12px;\">' +\n          '<div style=\"display:flex;align-items:center;gap:8px;color:var(--text-secondary);\">' +\n            '<span>可投入人力：</span>' +\n            '<input class=\"fee-input\" id=\"' + uid + '_shared_hc\" type=\"number\" value=\"' + sharedHc + '\" style=\"width:60px;\" oninput=\"recalcFeeAllRows(\\'' + uid + '\\')\">' +\n            '<span style=\"color:var(--text-muted);\">人（所有产品共用）</span>' +\n            '<span style=\"margin-left:10px;display:inline-flex;align-items:baseline;gap:4px;\">' +\n              '<span style=\"font-size:11px;color:#94a3b8;\">在职人力</span>' +\n              '<span style=\"font-size:14px;font-weight:700;color:#1e293b;\">' + onRosterHc + '</span>' +\n              '<span style=\"font-size:11px;color:#64748b;\">人</span>' +\n            '</span>' +\n          '</div>' +\n          '<div style=\"display:flex;align-items:center;gap:3px;font-size:11px;color:#94a3b8;white-space:nowrap;\">' +\n            '<svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" style=\"flex-shrink:0;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>' +\n            '<span>数值右侧 <strong style=\"color:#ef4444;\">↑</strong><strong style=\"color:#16a34a;\">↓</strong> 为与对比期间对比</span>' +\n          '</div>' +\n        '</div>' +\n        '<div class=\"fee-plan-shell fee-table-scroll\">' +\n          '<table class=\"tp-table fee-plan-table\" id=\"feeTable_' + uid + '\">' +\n            '<thead><tr>' +\n              '<th style=\"text-align:left;width:210px;\">产品名称</th>' +\n              '<th style=\"width:78px;white-space:nowrap;\">缴期</th>' +\n              '<th style=\"width:104px;\">活动率(%)</th>' +\n              '<th style=\"width:108px;\">人均件数(件)</th>' +\n              '<th style=\"width:114px;\">件均FYP(元)</th>' +\n              '<th style=\"width:100px;\">Margin</th>' +\n              '<th style=\"white-space:nowrap;width:78px;\">NBEV(万)</th>' +\n              '<th style=\"white-space:nowrap;width:70px;\">NBEV占比</th>' +\n              '<th style=\"width:72px;\">操作</th>' +\n            '</tr></thead>' +\n            '<tbody id=\"feeTbody_' + uid + '\"></tbody>' +\n            '<tfoot><tr class=\"tp-row-total\">' +\n              '<td colspan=\"6\">合计</td>' +\n              '<td id=\"' + uid + '_total_cell\" style=\"font-weight:800;white-space:nowrap;min-width:72px;\">' + totalNbev + '</td>' +\n              '<td id=\"' + uid + '_pct_total\" style=\"font-weight:800;white-space:nowrap;min-width:72px;\">100%</td>' +\n              '<td></td>' +\n            '</tr></tfoot>' +\n
