  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script>
  // ── Workbench Breadcrumb ──
  var _wbBcOrgData = {
    '深圳市': [
      { name: '罗湖区', outlets: ['罗湖网点'] },
      { name: '福田区', outlets: ['华强网点', '下沙网点', '福田网点'] },
      { name: '南山区', outlets: ['奔腾网点', '南山网点', '西丽网点'] },
      { name: '宝安区', outlets: ['宝安网点'] },
      { name: '龙岗区', outlets: ['龙岗网点', '布吉网点'] },
      { name: '龙华区', outlets: ['龙华网点'] },
      { name: '光明区', outlets: ['光明网点'] }
    ]
  };
  // Path: [{label, type}]
  var _wbBcPath = [
    {label:'总公司', type:'root'},
    {label:'深圳分公司', type:'region', city:'深圳市'}
  ];
  var _wbBcOpen = false;
  var _wbBcTgt  = null;  // element that opened the dropdown

  function _wbBcRender() {
    var container = document.getElementById('wbBcItems');
    var dd = document.getElementById('wbBcDropdown');
    if (!container) return;
    var html = '';
    _wbBcPath.forEach(function(node, i) {
      if (i > 0) html += '<span class="wb-bc-sep">&#8250;</span>';
      var isLast = i === _wbBcPath.length - 1;
      var cls = isLast ? (i === 0 ? 'wb-bc-item leaf' : 'wb-bc-item active') : 'wb-bc-item';
      html += '<div class="' + cls + '" onclick="_wbBcClick(event,' + i + ')" id="wbBcN' + i + '">' +
        node.label + (isLast && node.type !== 'outlet' ? ' <span style="font-size:10px;opacity:0.6;">▾</span>' : '') +
        '</div>';
    });
    container.innerHTML = html;
    if (dd) { dd.style.display='none'; _wbBcOpen=false; }
  }

  function _wbBcClick(event, level) {
    event.stopPropagation();
    var dd = document.getElementById('wbBcDropdown');
    if (!dd) return;
    var node = _wbBcPath[level];
    // Click on non-last item: navigate up
    if (level < _wbBcPath.length - 1) {
      _wbBcPath = _wbBcPath.slice(0, level + 1);
      _wbBcRender();
      return;
    }
    // Click on last item: show sub-level dropdown
    if (_wbBcOpen && _wbBcTgt === event.currentTarget) {
      dd.style.display = 'none'; _wbBcOpen = false; return;
    }
    _wbBcTgt = event.currentTarget;
    _wbBcOpen = true;
    // Build dropdown items
    var items = [];
    var title = '';
    if (node.type === 'root') {
      title = '分公司';
      items = [{label:'深圳分公司', type:'region', city:'深圳市'}];
    } else if (node.type === 'region') {
      title = '行政区';
      var dists = _wbBcOrgData[node.city] || [];
      items = dists.map(function(d){ return {label:d.name, type:'district', city:node.city}; });
    } else if (node.type === 'district') {
      title = '网点';
      var dists2 = _wbBcOrgData[node.city] || [];
      var found = null;
      dists2.forEach(function(d){ if(d.name===node.label) found=d; });
      items = found ? found.outlets.map(function(o){ return {label:o, type:'outlet'}; }) : [];
    }
    if (!items.length) return;
    // Position dropdown under the clicked node
    var bcEl = document.getElementById('wbBreadcrumb');
    var nodeEl = event.currentTarget;
    var bcRect = bcEl.getBoundingClientRect();
    var nodeRect = nodeEl.getBoundingClientRect();
    var leftOffset = nodeRect.left - bcRect.left;
    var ddHtml = '';
    if (title) ddHtml += '<div class="wb-bc-drop-title">' + title + '</div>';
    items.forEach(function(item, idx) {
      var hasChildren = item.type !== 'outlet';
      ddHtml += '<div class="wb-bc-drop-item" onclick="_wbBcSelect(event,' + idx + ')">' +
        item.label +
        (hasChildren ? '<span class="wb-bc-arr">&#8250;</span>' : '') +
        '</div>';
    });
    dd.innerHTML = ddHtml;
    dd.style.left = leftOffset + 'px';
    dd.style.display = 'block';
    // Store items for selection
    dd._items = items;
  }

  function _wbBcSelect(event, idx) {
    event.stopPropagation();
    var dd = document.getElementById('wbBcDropdown');
    if (!dd || !dd._items) return;
    var item = dd._items[idx];
    _wbBcPath.push(item);
    _wbBcRender();
  }

  // Close dropdown on outside click
  document.addEventListener('click', function() {
    var dd = document.getElementById('wbBcDropdown');
    if (dd) { dd.style.display='none'; _wbBcOpen=false; }
  });

  // Init on load
  window.addEventListener('load', function() {
    _wbBcRender();
  });
  </script>

eight: 1.2; }\n  .cag-col-total-nbev { font-size: 11px; color: #475569; margin-top: 3px; line-height: 1.3; }\n  .cag-row-total {\n    background: #f8fafc; border-radius: 8px; padding: 8px 4px; text-align: center;\n  }\n  .cag-row-total-count { font-size: 14px; font-weight: 600; color: #475569; line-height: 1.2; }\n  .cag-row-total-nbev { font-size: 10px; color: #94a3b8; margin-top: 3px; }\n  .cag-grand {\n    background: linear-gradient(135deg, #1e40af, #2563eb); border-radius: 8px; padding: 8px 4px; text-align: center;\n    box-shadow: 0 2px 8px rgba(37,99,235,0.25);\n  }\n  .cag-grand-count { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.2; }\n  .cag-grand-nbev { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 3px; }\n\n  /* 3-value sub-cell layout in 客户达成测算 */\n  .grid-cell-3val {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 4px;\n  }\n  .gcv-cnt {\n    font-weight: 700;\n    font-size: 14px;\n    color: var(--text-primary);\n    letter-spacing: -0.3px;\n    line-height: 1;\n  }\n  .gcv-divider {\n    display: block;\n    width: 28px;\n    height: 1px;\n    background: #e2e8f0;\n    flex-shrink: 0;\n  }\n  .gcv-sub {\n    display: flex;\n    align-items: center;\n    gap: 4px;\n    line-height: 1;\n  }\n  .gcv-nbev {\n    font-size: 10px;\n    font-weight: 500;\n    color: #2563eb;\n  }\n  .gcv-sep {\n    font-size: 9px;\n    color: #cbd5e1;\n  }\n  .gcv-avg {\n    font-size: 10px;\n    color: #94a3b8;\n    font-weight: 400;\n  }\n\n  /* SVG helpers */\n  .chart-svg { width: 100%; height: 100%; }\n  .grid-line { stroke: #f0f0f0; stroke-width: 1; }\n\n  /* Scrollbar global */\n  ::-webkit-scrollbar { width: 5px; }\n  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n\n  /* ===== 产品保费测算 editable inputs ===== */\n  .fee-input {\n    width: 76px;\n    padding: 4px 6px;\n    border: 1px solid var(--border);\n    border-rad -events: none;\n    transition: left 1.3s cubic-bezier(0.22,1,0.36,1), opacity 1.1s ease-out;\n    display: flex;\n    flex-direction: column;\n    background: #eef3f9;\n    z-index: 10;\n  }\n  .app-body.workbench-open #workbench-panel {\n    opacity: 1;\n    pointer-events: auto;\n    /* left 由 JS openGoalBreakdown() 写入 inline style */\n  }\n  /* 工作台全屏：从 52px 侧边栏轨道边缘铺满，left 由 JS inline style 写入 52px */\n  .app-body.workbench-fullscreen #workbench-panel {\n    z-index: 60;\n  }\n  /* 全屏态下禁用聊天区交互（被工作台覆盖），侧边栏保持可用 */\n  .app-body.workbench-fullscreen .center-panel {\n    pointer-events: none;\n  }\n\n  /* 工作台外层折叠 tab（不依赖 iframe 内容）*/\n  .wb-fold-tab {\n    position: absolute;\n    left: 0;\n    top: 50%;\n    transform: translateY(-50%);\n    z-index: 20;\n    width: 20px;\n    height: 64px;\n    border: none;\n    border-radius: 0 8px 8px 0;\n    background: rgba(255,255,255,0.82);\n    color: #64748b;\n    box-shadow: 2px 0 8px rgba(15,23,42,0.08);\n    cursor: pointer;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    transition: all 0.18s ease;\n    font-family: inherit;\n  }\n  .wb-fold-tab:hover {\n    width: 28px;\n    background: #2563eb;\n    color: #fff;\n    box-shadow: 2px 0 12px rgba(37,99,235,0.3);\n  }\n\n  #workbenchIframe {\n    width: 100%;\n    height: 100%;\n    flex: 1;\n    min-height: 0;\n    border: none;\n    display: block;\n  }\n\n  /* ===== 工作台白板内联样式（从 最新版.html 迁移）===== */\n  .board-panel { flex:1; min-width:0; min-height:0; max-width:100%; display:flex; flex-direction:column; background:#eef3f9; overflow:visible; position:relative; }\n  /* 工作台左边缘竖条按钮组（位于工作台与聊天框中间）*/\n  .board-edge-tabs { position:absolute; left:0; top:50%; transform:translateY(-50%); z-index:80; display:flex; flex-direction:column; gap:6px; }\n  .board-edge-btn { width:18px; height:48px; border:none; border-radius:0 8px 8px 0; background:rgba(255,255,255,0.6); color:var(--text-muted); display:flex; align-items:center; justify-content:center; tr>\n                  <tr data-month=\"8月\">\n                    <td class=\"month-label\">8月</td>\n                    <td class=\"r\" style=\"white-space:nowrap;\"><input class=\"bmt-input\" type=\"text\" value=\"4,200\" oninput=\"onMonthlyTargetEdit(this,'8月')\"> 万元</td>\n                    <td class=\"r\" data-col=\"share\">14.0%</td>\n                    <td class=\"r\" data-col=\"yoy\"><span class=\"bmt-up\">+8.1%</span></td>\n                    <td class=\"r\">3,883 万元</td>\n                    <td class=\"r\">14.9%</td>\n                  </tr>\n                </tbody>\n                <tfoot>\n                  <tr>\n                    <td>合计</td>\n                    <td class=\"r\" id=\"bmtTotalTarget\">30,000 万元</td>\n                    <td class=\"r\" id=\"bmtTotalShare\">100%</td>\n                    <td class=\"r\">—</td>\n                    <td class=\"r\">25,518 万元</td>\n                    <td class=\"r\">—</td>\n                  </tr>\n                </tfoot>\n              </table>\n\n              <div class=\"banner-status\"><span class=\"banner-status-dot\"></span>季度目标已接收 · 月度测算盘用于下发 12 个网点</div>\n              </div><!-- ↑ end monthlyEditArea ↑ -->\n\n              <!-- 确认月度目标：确认后才能进行下方按口径拆解 -->\n              <div class=\"month-confirm-bar\" id=\"monthConfirmBar\">\n                <div class=\"month-confirm-text\">\n                  <span class=\"month-confirm-title\">请先核对并确认 6 / 7 / 8 月的月度推动目标</span>\n                  <span class=\"month-confirm-sub\">确认后方可进入下方「按口径拆解到 12 个网点」</span>\n                </div>\n                <div class=\"month-confirm-actions\">\n                  <button class=\"month-confirm-btn\" id=\"monthConfirmBtn\" onclick=\"confirmMonthlyTargets()\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg>\n plitPlan('b')\">\n                  <div class=\"plan-code\">B</div>\n                  <div class=\"plan-name\">参考最近表现</div>\n                  <div class=\"plan-desc\">按今年 1–5 月业绩，结合活动率、完成率来分</div>\n                </div>\n              </div>\n              <div class=\"plan-rationale\" id=\"planRationale\"><b>AskBob 建议采用 B。</b> 先把季度问责目标按月度节奏拆出 6 月承接盘，再按今年 1–5 月累计贡献、活动率和上月完成率分到各网点。</div>\n            </div>\n            <div class=\"linkage-workbench\" id=\"linkageWorkbench\" style=\"display:none;\"></div>\n            <!-- 月份选择：放在各网点月度目标表格上方 -->\n            <div class=\"month-switcher-bar\">\n              <span class=\"month-switcher-bar-label\">第二步 · 选择拆解月份</span>\n              <div class=\"month-switcher\" id=\"monthSwitcher\">\n                <span class=\"month-switcher-label\">2026年</span>\n                <button class=\"month-tab active\" onclick=\"switchMonth('6月', this)\">6月</button>\n                <button class=\"month-tab\" onclick=\"switchMonth('7月', this)\">7月</button>\n                <button class=\"month-tab\" onclick=\"switchMonth('8月', this)\">8月</button>\n              </div>\n            </div>\n            <div class=\"split-table-wrap\">\n              <table class=\"split-table\" id=\"splitTable\">\n                <thead>\n                  <tr>\n                    <th>业务发展区</th>\n                    <th class=\"num\">NBEV目标</th>\n                    <th class=\"num\">NBEV占比</th>\n                    <th class=\"num\">在职人数</th>\n                    <th class=\"num\" id=\"zoneRefHeader\">累计至上月NBEV</th>\n                    <th class=\"num\" id=\"zoneRefShareHeader\">累计至上月NBEV占比</th>\n                  </tr>\n                </thead>\n                <tbody id=\"splitTableBody\"></tbody>\n              </table>\n            </div>\n          </div>\n          </div><!-- ↑↑↑ end decompSection 按口径拆解区 ↑↑↑ -->\n\n        </div><!-- end board-content -->\n      </div><!-- end board-body / boardGoalBody -->\n\n      <!-- ===== 达成路径工作台（产品/客         <th style=\"text-align:left;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">网点</th>\n                <th style=\"text-align:left;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">所属营业部/组</th>\n                <th style=\"text-align:left;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">P值</th>\n                <th style=\"text-align:left;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">M值</th>\n                <th style=\"text-align:left;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">面谈主题</th>\n                <th style=\"text-align:right;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">待面谈数量</th>\n                <th style=\"text-align:right;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;\">共需面谈数量</th>\n                <th style=\"position:sticky;right:0;z-index:2;background:#f8fafc;text-align:center;padding:10px 14px;font-weight:600;color:#64748b;font-size:12px;white-space:nowrap;box-shadow:-2px 0 6px rgba(0,0,0,0.06);\">操作</th>\n              </tr>\n            </thead>\n            <tbody id=\"interviewTableBody\"></tbody>\n          </table>\n          </div>\n          <div id=\"interviewEmptyTip\" style=\"display:none;padding:32px 16px;text-align:center;font-size:13px;color:#94a3b8;\">未找到匹配结果</div>\n        </div>\n      </div>\n      <!-- 面谈对象名单翻页底栏 -->\n      <div id=\"interviewPagination\" style=\"display:none;flex-shrink:0;border-top:1px solid #e2e8f0;background:linear-gradient(135deg,#fdf4ff 0%,#fff 78%);padding:10px 24px;align-items:center;justify-content:flex-end;gap:8px;\"></div>\n\n      <!-- 代理人详情页 -->\n      <div id=\"boardAgentDetailContent\" style=\"display:none;flex:1;overflow-y:auto;min-height:0;flex-direction:column;padding:20px 24px 0;gap:0;\"></div>\n      <!-- 代理人详情底部工具栏 -->\n      <div id=\"boardAgentDetailFooter\" style=\"display:none;flex-shrink:0;background:#fff;border-top:1px solid #e2e8f0;flex-direction:row;\"></div>\n\n      <!-- 代理人档案详情页 -->\n      <div id=\"boardAgentProfileContent\" style=\"display:none;flex:1;overflow-y:auto;min-height:0;flex-direction:column;padding:20px 24px 0;gap:12px;\"></div>\n\n      <div class=\"stage2-sticky-footer\">\n        <div class=\"stage2-sticky-footer-left\">\n          <div class=\"stage2-sticky-footer-title\" id=\"footerTitle\">当前拆解方案已平衡</div>\n          <div class=\"stage2-sticky-footer-desc\" id=\"footerDesc\">深圳分公司可直接确认当前 12 个网点目标。</div>\n        </div>\n        <div class=\"stage2-sticky-footer-actions\">\n          <!-- 目标拆解模式按钮 -->\n          <div id=\"footerGoalBtns\" style=\"display:flex;align-items:center;gap:10px;\">\n            <div id=\"footerBalanceHint\" style=\"font-size:12px;color:#ef4444;font-weight:500;white-space:nowrap;display:none;margin-right:6px;\"></div>\n            <button class=\"stage2-sticky-secondary-btn\" id=\"stage2EditMonthBtn\" onclick=\"editConfirmedStageMonth()\" style=\"display:none;\">\n              修改本月\n            </button>\n            <button class=\"stage2-sticky-primary-btn\" id=\"stage2ConfirmBtn\" onclick=\"confirmStage2Plan()\" disabled=\"\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg><span id=\"stage2ConfirmText\">确认6月方案</span>\n            </button>\n          </div>\n          <!-- 达成路径模式按钮 -->\n          <div id=\"footerAchieveBtns\" style=\"display:none;align-items:center;gap:10px;\">\n            <div id=\"achieveFooterBtnArea\" style=\"display:flex;align-items:center;gap:8px;\"></div>\n          </div>\n          <!-- 达钻名单模式按钮 -->\n          <div id=\"footerDiamondBtns\" style=\"display:none;align-items:center;gap:10px;\">\n            <button class=\"stage2-sticky-secondary-btn\" onclick=\"closeWorkbench()\">关闭</button>\n          </div>\n        </div>\n      </div>\n\n    </div><!-- end gPathSelected = [];\n    setTimeout(function(){ appendAchievePlanCard(); }, 400);\n  } else if (isSpecificPathQuery(query)) {\n    // 帮我规划X达成路径 → 单路径流程，NBEV目标值追问\n    multiPathMode = false;\n    var match = query.match(/帮我规划(.+)达成路径/);\n    if (match) selectedPathLabel = match[1];\n    setTimeout(function(){ appendNbevCard(); }, 400);\n  } else if (query === '我要调整目标') {\n    // 我要调整目标 → NBEV目标值追问\n    setTimeout(function(){ showTargetFollowUp(); }, 400);\n  } else if (isTeamProfileQuery(query)) {\n    // 队伍画像分析\n    var old = document.querySelector('.team-profile-added');\n    if (old) old.classList.remove('team-profile-added');\n    setTimeout(function(){ appendTeamProfileCard(true); }, 400);\n  } else if (isClientProfileQuery(query)) {\n    // 客户画像分析\n    setTimeout(function(){ appendClientProfileCard(); }, 400);\n  } else if (query.indexOf('目标制定') >= 0 || query.indexOf('目标拆解') >= 0 || query.indexOf('拆解推动目标') >= 0) {\n    achievePathMode = false;\n    setTimeout(function(){ appendGoalDecompFollowUp(); }, 400);\n  } else if (query.indexOf('达钻潜力人员') >= 0 || query.indexOf('达钻潜力') >= 0) {\n    setTimeout(function(){ appendDiamondAgentArtifact(); }, 400);\n  } else if (query.indexOf('钻石达成') >= 0) {\n    setTimeout(function(){ appendDiamondStreakArtifact(); }, 400);\n  } else if (query.indexOf('开展面谈') >= 0) {\n    setTimeout(function(){ appendInterviewFollowUp(); }, 400);\n  } else if (query.indexOf('面谈对象') >= 0) {\n    setTimeout(function(){ appendInterviewArtifactCard(); }, 400);\n  } else if (query.indexOf('客户经营') >= 0 || query.indexOf('客经') >= 0) {\n    setTimeout(function(){ appendCustomerOperationArtifact(); }, 400);\n  } else if (query.indexOf('保单') >= 0) {\n    setTimeout(function(){ appendPolicyArtifact(); }, 400);\n  }\n}\n\n/* ── 目标拆解：追问推动目标 ── */\nfunction appendGoalDecompFollowUp() {\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row goal-decomp-followup-row';\n  row.innerHTML =\n    '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble\">' +\n      '<div class=\"mq-card-header\">' +\n        '<span class=\"mq-card-title\">开始目标拆解前请确认</span>' +\n        '<span class=\"mq-step-tag\" id=\"gdStepTag\">1 / 2</span>' +\n      '</div>' +\n      '<div class=\"mq-step\" id=\"gdStep1\">' +\n        '<div class=\"path-response-header\">请选择本次拆解的业务季</div>' +\n        '<div class=\"path-options-wrap\">' +\n          '<div class=\"path-option\" onclick=\"goalDecompSelectSeason(this,\\'司庆季\\')\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\">司庆季</div>' +\n          '</div>' +\n          '<div class=\"path-option\" onclick=\"goalDecompSelectSeason(this,\\'6-8月服务季\\')\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\">6-8月服务季</div>' +\n          '</div>' +\n        '</div>' +\n      '</div>' +\n      '<div class=\"mq-step\" id=\"gdStep2\" style=\"display:none;opacity:0;\">' +\n        '<div class=\"path-response-header\" id=\"gdStep2Header\">请确认深圳分公司的业务季推动目标（万元）</div>' +\n        '<div class=\"path-options-wrap\">' +\n          '<div class=\"path-option\" onclick=\"selectGoalDecompPreset(this,3000)\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\" id=\"gdPresetLabel\">总部下发推动目标3000万</div>' +\n          '</div>' +\n          '<div class=\"nbev-input-wrap\" style=\"padding-left:14px;\" onclick=\"this.querySelector(\\'input\\').focus()\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\" style=\"flex-shrink:0;\">自定义目标</div>' +\n            '<input class=\"nbev-input\" type=\"text\" inputmode=\"decimal\" placeholder=\"去年同期3100\" ' +\n              'oninput=\"this.closest(\\'.nbev-input-wrap\\').classList.toggle(\\'has-value\\',!!this.value.trim())\" ' +\n              'onfocus=\"this.closest(\\'.path-options-wrap\\').querySelectorAll(\\'.path-option\\').forEach(function(o){o.classList.remove(\\'selected\\')})\" />' +\n            '<span class=\"nbev-unit\">万</span>' +\n            '<button class=\"nbev-confirm-btn\" onclick=\"confirmGoalDecompTarget(event)\">确认</button>' +\n          '</div>' +\n        '</div>' +\n    '</div>';\n  msgs.appendChild(row);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\n/* ── 达成路径：三步合一追问卡 ── */\nvar achievePlanAnswers = { season: '', nbev: '' };\n\nfunction appendAchievePlanCard() {\n  achievePlanAnswers = { season: '', nbev: '' };\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row achieve-plan-card-row';\n  row.innerHTML =\n    '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble\">' +\n      '<div class=\"mq-card-header\">' +\n        '<span class=\"mq-card-title\">开始规划前请确认</span>' +\n        '<span class=\"mq-step-tag\" id=\"achievePlanStepTag\">1 / 3</span>' +\n      '</div>' +\n      /* Step 1: 月度 */\n      '<div class=\"mq-step\" id=\"achievePlanStep1\">' +\n        '<div class=\"path-response-header\">请选择本次规划的月度</div>' +\n        '<div class=\"path-options-wrap\">' +\n          '<div class=\"path-option\" onclick=\"achievePlanSelectSeason(this,\\'2026年6月\\')\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\">2026年6月</div>' +\n          '</div>' +\n          '<div class=\"path-option\" onclick=\"achievePlanSelectSeason(this,\\'2026年7月\\')\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\">2026年7月</div>' +\n          '</div>' +\n          '<div class=\"path-option\" onclick=\"achievePlanSelectSeason(this,\\'2026年8月\\')\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\">2026年8月</div>' +\n          '</div>' +\n        '</div>' +\n      '</div>' +\n      /* Step 2: NBEV目标 */\n      '<div class=\"mq-step\" id=\"achievePlanStep2\" style=\"display:none;opacity:0;\">' +\n        '<div class=\"path-response-header\" id=\"achievePlanNbevHeader\">请确认深圳分公司NBEV目标（万元）</div>' +\n        '<div class=\"path-options-wrap\">' +\n          '<div class=\"path-option\" onclick=\"achievePlanSelectNbevPreset(this,3000)\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\" id=\"achievePlanNbevLabel\">深圳分公司2026年6月的推动目标 3000万</div>' +\n          '</div>' +\n          '<div class=\"nbev-input-wrap\" style=\"padding-left:14px;\" onclick=\"this.querySelector(\\'input\\').focus()\">' +\n            '<div class=\"path-option-dot\"><div class=\"path-option-dot-inner\"></div></div>' +\n            '<div class=\"path-option-label\" style=\"flex-shrink:0;\">自定义目标</div>' +\n            '<input class=\"nbev-input\" type=\"text\" inputmode=\"decimal\" placeholder=\"去年同期3100\" ' +\n              'oninput=\"this.closest(\\'.nbev-input-wrap\\').classList.toggle(\\'has-value\\',!!this.value.trim())\" ' +\n              'onfocus=\"this.closest(\\'.path-options-wrap\\').querySelectorAll(\\'.path-option\\').forEach(function(o){o.classList.remove(\\'selected\\')})\" />' +\n            '<span class=\"nbev-unit\">万</span>' +\n            '<button class=\"nbev-confirm-btn\" onclick=\"achievePlanConfirmNbevCustom(event)\">确认</button>' +\n          '</div>' +\n        '</div>' +\n      '</div>' +\n      /* Step 3: 路径维度多选 */\n      '<div class=\"mq-step\" id=\"achievePlanStep3\" style=\"display:none;opacity:0;\">' +\n        '<div class=\"path-response-header\">请选择您要规划的路径维度</div>' +\n        '<div style=\"font-size:13px;color:var(--text-secondary);margin:8px 0 12px;line-height:1.6;\">可多选，AI 将分别为每条路径生成测算方案</div>' +\n        '<div class=\"path-options-wrap path-options-multi\">' +\n          '<div class=\"path-option path-option-multi\" onclick=\"mqTogglePill(this)\">' +\n            '<div class=\"path-option-check\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg></div>' +\n            '<div class=\"path-option-label\">队伍</div>' +\n          '</div>' +\n          '<div class=\"path-option path-option-multi\" onclick=\"mqTogglePill(this)\">' +\n            '<div class=\"path-option-check\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg></div>' +\n            '<div class=\"path-option-label\">客户</div>' +\n          '</div>' +\n          '<div class=\"path-option path-option-multi\" onclick=\"mqTogglePill(this)\">' +\n            '<div class=\"path-option-check\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg></div>' +\n            '<div class=\"path-option-label\">产品</div>' +\n          '</div>' +\n        '</div>' +\n        '<div class=\"path-multi-confirm-row\">' +\n          '<button class=\"path-multi-confirm-btn\" id=\"mqPathConfirmBtn\" disabled onclick=\"achievePlanConfirmAll()\">确认</button>' +\n        '</div>' +\n      '</div>' +\n    '</div>';\n  msgs.appendChild(row);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nfunction achievePlanSelectSeason(el, season) {\n  selectedGoalDecompSeason = season;\n  achievePlanAnswers.season = season;\n  el.closest('.path-options-wrap').querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });\n  el.classList.add('selected');\n  var header = document.getElementById('achievePlanNbevHeader');\n  var label  = document.getElementById('achievePlanNbevLabel');\n  if (header) header.textContent = '请确认深圳分公司NBEV目标（万元）';\n  if (label)  label.textContent  = '深圳分公司' + season + '的推动目标 3000万';\n  var step1 = document.getElementById('achievePlanStep1');\n  var step2 = document.getElementById('achievePlanStep2');\n  var tag   = document.getElementById('achievePlanStepTag');\n  step1.style.opacity = '0';\n  setTimeout(function() {\n    step1.style.display = 'none';\n    if (tag) tag.textContent = '2 / 3';\n    step2.style.display = 'block';\n    setTimeout(function() { step2.style.opacity = '1'; }, 20);\n    var msgs = document.querySelector('.chat-messages');\n    if (msgs) msgs.scrollTop = msgs.scrollHeight;\n  }, 180);\n}\n\nfunction achievePlanSelectNbevPreset(el, val) {\n  el.closest('.path-options-wrap').querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });\n  var inputWrap = el.closest('.path-options-wrap').querySelector('.nbev-input-wrap');\n  if (inputWrap) {\n    inputWrap.classList.remove('has-value', 'confirmed');\n    var inp = inputWrap.querySelector('.nbev-input');\n    if (inp) { inp.value = ''; inp.readOnly = false; }\n    var btn = inputWrap.querySelector('.nbev-confirm-btn');\n    if (btn) btn.innerHTML = '确认';\n  }\n  el.classList.add('selected');\n  userNbevTarget = val;\n  pendingNbevValue = String(val);\n  achievePlanAnswers.nbev = String(val);\n  achievePlanGoToStep3();\n}\n\nfunction achievePlanConfirmNbevCustom(e) {\n  e.stopPropagation();\n  var wrap  = e.target.closest('.nbev-input-wrap');\n  var input = wrap.querySelector('.nbev-input');\n  var val   = input.value.trim();\n  if (!val) return;\n  wrap.classList.add('confirmed');\n  input.readOnly = true;\n  e.target.innerHTML = '✓ 已确认';\n  userNbevTarget = parseFloat(val) || 300;\n  pendingNbevValue = val;\n  achievePlanAnswers.nbev = val;\n  achievePlanGoToStep3(); tml;\n      // Bind clicks\n      list.querySelectorAll('.askbob-rec-item-static').forEach(function(el) {\n        el.addEventListener('click', function() {\n          var q = el.getAttribute('data-q');\n          if (askBobInput) askBobInput.value = q;\n          switchToAiAssistant(q);\n        });\n      });\n    }\n    renderAskRecList();\n    var refreshBtn = shadow.getElementById('askRecRefresh');\n    if (refreshBtn) {\n      refreshBtn.addEventListener('click', function() {\n        askbobRecOffset = (askbobRecOffset + 3) % askbobQuestions.length;\n        renderAskRecList();\n      });\n    }\n\n    // Set todo deadline to tomorrow's date\n    var deadlineEl = shadow.querySelector('.todo-deadline');\n    if (deadlineEl) {\n      var tomorrow = new Date();\n      tomorrow.setDate(tomorrow.getDate() + 1);\n      var m = tomorrow.getMonth() + 1;\n      var d = tomorrow.getDate();\n      deadlineEl.textContent = '紧急 · 截止' + m + '月' + d + '日';\n    }\n\n    // Bind todo task click -> jump to AI assistant\n    var todoItem = shadow.querySelector('.todo-task-item');\n    if (todoItem) {\n      todoItem.addEventListener('click', function() {\n        switchToAiAssistant('规划司庆季达成路径');\n      });\n    }\n  }\n\nfunction switchToAiAssistant(userQuestion) {\n  // Restore AI content\n  var appBody = document.getElementById('aiAppBody');\n  appBody.innerHTML = aiContent.html;\n  appBody.style.display = 'flex';\n  isClassicMode = false;\n\n  // Update nav label to show we're on AI assistant page\n  document.querySelector('.nav-menu a.active').textContent = '首页';\n\n  // Re-grab avatar src\n  aiAvatarSrc = document.querySelector('.msg-avatar.ai img') ? document.querySelector('.msg-avatar.ai img').src : '';\n\n  // Inject user question as first interaction\n  if (userQuestion) {\n    setTimeout(function(){\n      appendUserMsg(userQuestion);\n      routeQuery(userQuestion);\n    }, 300);\n  }\n}\n\nfunction goBackToHomepage() {\n  // Save current AI content before switching \n  routeQuery(text);\n}\n\n// Fade out follow-up cards (追问卡片) when user sends a query, keep atomic tool cards\nfunction fadeOutFollowupCards() {\n  // 追问卡片 selectors — fade out all of these on user query\n  var followupSelectors = [\n    '.followup-cards',\n    '.path-card-row',        // 达成路径类型追问\n    '.nbev-card-added',      // NBEV目标值追问\n    '.multi-q-card-row',     // 统一多问题卡片\n    '.target-followup-row',  // 目标值调整追问\n    '.path-type-followup-row', // 路径类型追问 (legacy)\n    '.goal-decomp-followup-row' // 目标拆解推动目标追问\n  ];\n  \n  followupSelectors.forEach(function(sel) {\n    document.querySelectorAll(sel).forEach(function(card) {\n      if (card.style.opacity === '0') return; // already fading\n      card.style.transition = 'opacity 0.8s ease-out';\n      card.style.opacity = '0';\n      setTimeout(function() {\n        card.style.transition = 'max-height 0.6s ease, margin 0.6s ease, padding 0.6s ease';\n        card.style.maxHeight = card.scrollHeight + 'px';\n        card.offsetHeight;\n        card.style.maxHeight = '0';\n        card.style.overflow = 'hidden';\n        card.style.marginBottom = '0';\n      }, 800);\n      setTimeout(function() { card.remove(); }, 1500);\n    });\n  });\n\n  // Also fade out \"追问卡片\" labels\n  document.querySelectorAll('.ta-next-label').forEach(function(label) {\n    if (label.textContent.trim() === '追问卡片') {\n      label.style.transition = 'opacity 0.8s ease-out';\n      label.style.opacity = '0';\n      setTimeout(function() { label.remove(); }, 900);\n    }\n  });\n  \n  // NOTE: 原子化工具卡片 (.team-profile-added, .team-achieve-added, .client-profile-added)\n  // are NEVER touched here — they always remain visible\n}\n\n// (Path type follow-up is now handled by appendPathTypeCard via routeQuery)\n\n// Follow-up card click handler\nfunction triggerFollowup(cardName) {\n  fadeOutFollowupCards();\n  if (cardName === '路径类型追问') {\n    appendUserBubble('帮我规划达成路径');\n    setTimeout(function(){ appendPathTypeCard(); }, 400);\n  } else if (cardName === 'NBEV目标值追问') {\n    appendUserBubble('我要调整目标');\n    showTargetFollowUp();\n  }\n}\n\n// Atomic tool trigger - old cards stay visible, new ones append below\nfunction triggerAtomicTool(toolName) {\n  appendUserBubble('查看' + toolName);\n  if (toolName === '队伍画像分析') {\n    // Allow new card by clearing guard class on old one\n    var old = document.querySelector('.team-profile-added');\n    if (old) old.classList.remove('team-profile-added');\n    setTimeout(function(){ appendTeamProfileCard(); }, 600);\n  } else if (toolName === '队伍达成测算') {\n    var old = document.querySelector('.team-achieve-added');\n    if (old) old.classList.remove('team-achieve-added');\n    setTimeout(function(){ appendTeamAchieveCard(); }, 600);\n  } else if (toolName === '客户画像分析') {\n    var old = document.querySelector('.client-profile-added');\n    if (old) old.classList.remove('client-profile-added');\n    setTimeout(function(){ appendClientProfileCard(); }, 600);\n  }\n}\n\n// Recommend scroll is now CSS-based horizontal animation (no JS timer needed)\n\n// AI Thinking card\nvar thinkingTexts = [\n  '正在分析您的NBEV目标与当前团队产能数据...',\n  '对比深圳市机构历史达成率，识别关键差距因子...',\n  '正在匹配产品组合策略：重疾险+年金险+医疗险的最优配比...',\n  '基于352人团队规模，计算人均产能要求与分层目标...',\n  '评估钻石会员客户转化潜力，预估高净值客户贡献占比...',\n  '正在生成增员与留存双轨并行方案，优化团队结构...',\n  '综合分析客户画像分布，匹配差异化营销场景...',\n  '整合季度活动日历，规划关键节点冲刺节奏...',\n  '正在生成完整的达成路径规划方案，请稍候...'\n];\n\n// Build thinking texts tailored to the selected multi-path dimensions\nfunction buildMultiPathThinkingTexts(paths) {\n  var lines = [];\n  lines.push('正在分析您的NBEV目标 ' + (userNbevTarget || 300) + ' 万元与当前经营数据...');\n  lines.push('识别达成缺口，锁定【' + paths.join('、') + '】' + paths.length + '个维度的关键抓手...');\n  if (paths.indexOf('队伍') !== -1) {\n    lines.push('【队伍维度】评估352人团队的钻石等级分布、近6个月产能趋势与人均NBEV贡献...');\n    lines.push('【队伍维度】测算双金钻/金钻核心力量的产能缺口，识别可激活的非活动人力...');\n  }\n  if (paths.indexOf('客户') !== -1) {\n    lines.push('【客户维度】分析存量客户的客温×客价二维分布，定位高价值转化机会...');\n    lines.push('【客户维度】匹配差异化经营策略：高温A类重点攻坚、中低温BC类 e;\nvar generationStopped = false;\n\nfunction setGenerating(val) {\n  isGenerating = val;\n  var voiceBtn  = document.getElementById('voiceBtn');\n  var attachBtn = document.getElementById('attachBtn');\n  var sendBtn   = document.getElementById('sendBtn');\n  var stopBtn   = document.getElementById('stopBtn');\n  if (!voiceBtn || !sendBtn || !stopBtn) return;\n  if (val) {\n    voiceBtn.style.display  = 'none';\n    attachBtn.style.display = 'none';\n    sendBtn.style.display   = 'none';\n    stopBtn.classList.add('visible');\n  } else {\n    voiceBtn.style.display  = '';\n    attachBtn.style.display = '';\n    sendBtn.style.display   = '';\n    stopBtn.classList.remove('visible');\n  }\n}\n\nfunction stopGeneration() {\n  generationStopped = true;\n  setGenerating(false);\n}\n\nfunction typewriteThinking(lineIdx, charIdx) {\n  if (generationStopped) return;\n\n  if (lineIdx >= thinkingTexts.length) {\n    // Done\n    var cursor = document.querySelector('.thinking-body .cursor');\n    if (cursor) cursor.remove();\n    document.getElementById('thinkingSpinner').classList.add('done');\n    document.getElementById('thinkingLabel').textContent = '思考完成';\n    if (multiPathMode && multiPathQueue && multiPathQueue.length > 0) {\n      setTimeout(function(){ if (!generationStopped) processMultiPathQueue(); }, 80);\n      return;\n    }\n    if (selectedPathLabel === '队伍') {\n      setTimeout(function(){ if (!generationStopped) appendTeamProfileCard(); }, 80);\n    } else if (selectedPathLabel === '客户') {\n      setTimeout(function(){ if (!generationStopped) appendClientProfileCardForPath(); }, 80);\n    } else if (selectedPathLabel === '产品') {\n      calculateBestSubProduct();\n      setTimeout(function(){ if (!generationStopped) appendProductProfileCard(); }, 80);\n    }\n    return;\n  }\n\n  var body = document.getElementById('thinkingBody');\n  if (!body) return;\n\n  var line = thinkingTexts[lineIdx];\n\n  if (charIdx === 0 && lineIdx > 0) {\n    thinkingFullText += ' ';\n  }\n\n  if (charIdx < line.length) {\n    thinkingFullText += line[charIdx];\n    body.innerHTML = thinkingFullText + '<span class=\"cursor\"></span>';\n\n    checkThinkingOverflow();\n\n    if (!thinkingExpanded) {\n      body.scrollTop = body.scrollHeight;\n    }\n\n    var msgs = document.querySelector('.chat-messages');\n    msgs.scrollTop = msgs.scrollHeight;\n\n    setTimeout(function() { typewriteThinking(lineIdx, charIdx + 1); }, 3);\n  } else {\n    setTimeout(function() { typewriteThinking(lineIdx + 1, 0); }, 20);\n  }\n}\n\nfunction checkThinkingOverflow() {\n  var body = document.getElementById('thinkingBody');\n  var toggle = document.getElementById('thinkingToggle');\n  if (!body || !toggle) return;\n  // Compare scrollHeight vs 3-line height (~4.8em ≈ 67px at 14px base)\n  if (body.scrollHeight > body.clientHeight + 4) {\n    toggle.classList.add('visible');\n  }\n}\n\nfunction toggleThinking() {\n  var body = document.getElementById('thinkingBody');\n  var toggle = document.getElementById('thinkingToggle');\n  var label = document.getElementById('thinkingToggleText');\n  if (!body) return;\n  \n  thinkingExpanded = !thinkingExpanded;\n  \n  if (thinkingExpanded) {\n    body.classList.remove('collapsed');\n    body.style.maxHeight = body.scrollHeight + 'px';\n    label.textContent = '收起';\n    toggle.classList.add('expanded');\n  } else {\n    body.classList.add('collapsed');\n    body.style.maxHeight = '';\n    label.textContent = '展开全部';\n    toggle.classList.remove('expanded');\n    body.scrollTop = body.scrollHeight;\n  }\n}\n\n\n// ===== Atomic Tool: Team Profile Card =====\nvar teamData = {\n  // idx 0-5: 2024年11月~2025年4月 | idx 6-7: 2025年5月~6月 | idx 8-10: 2026年3月~5月\n  monthLabels: ['11月', '12月', '1月', '2月', '3月', '4月', '5月', '6月', '3月', '4月', '5月'],\n  monthYears:  ['2024', '2024', '2025', '2025', '2025', '2025', '2025', '2025', '2026', '2026', '2026'],\n  levels: [\n    [18, 35, 52, 78, 120],\n    [20, 38, 55, 75, 124],\n    [22, 40, 58, 72, 127],\n    [19, 42, 60, 76, 130],\n    [24, 45, 56, 80, 132],\n    [26, 48, 62, 82, 134],\n    [28, 50, 64, 80, 136],\n    [30, 52, 66, 78, 138],\n    [32, 55, 68, 85, 140],\n    [34, 58, 72, 88, 144],\n    [35, 60, 74, 90, 146]\n  ],\n  levelNbevPer: [8.2, 5.6, 3.4, 1.8, 0.6],\n  nonActiveCounts: [75, 68, 62, 60, 58, 56, 54, 52, 70, 58, 52],\n  nbev:    [386, 412, 445, 398, 437, 463, 475, 490, 510, 520, 535],\n  targets: [400, 420, 450, 430, 450, 460, 470, 480, 500, 510, 525]\n};\nvar levelNames  = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];\nvar levelColors = ['#1e40af', '#2563eb', '#3b82f6', '#60a5fa', '#94a3b8'];\nvar lvClasses   = ['lv5','lv4','lv3','lv2'];\n\n// Compute NBEV for a level in a given month (万元, 1 decimal)\nfunction getLevelMonthNbev(li, mi) {\n  var count = teamData.levels[mi][li];\n  return Math.round(count * teamData.levelNbevPer[li] * 10) / 10;\n}\n\nfunction appendTeamProfileCard(skipAchieve) {\n  var oldCard = document.querySelector('.team-profile-added');\n  if (oldCard) oldCard.remove();\n  var msgs = document.querySelector('.chat-messages');\n  var row = document.createElement('div');\n  row.className = 'msg-row team-profile-added';\n\n  // Unique suffix to avoid duplicate IDs\n  var uid = '_' + Date.now();\n\n  var _tpYears = ['2024', '2024', '2025', '2025', '2025', '2025'];\n  var _tpOpts = teamData.monthLabels.map(function(m, mi) {\n    var isSel = (mi === teamData.monthLabels.length - 1) ? ' selected' : '';\n    return '<option value=\"' + mi + '\"' + isSel + '>' + _tpYears[mi] + '年' + m + '</option>';\n  }).join('');\n\n  row.innerHTML = '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble tool-bubble\">' +\n      '<div style=\"margin-bottom:6px;font-size:13px;color:var(--text-secondary);\">深圳市南山营业区 过往数据分析</div>' +\n      '<div class=\"team-profile-card\">' +\n        '<div class=\"tp-chart-section\">' +\n          '<div id=\"tpTable' + uid + '\"></div>' +\n        '</div>' +\n        '<div class=\"tp-trend-section\">' +\n          '<div class=\"tp-trend-title\">NBEV月度达成（万元）</div>' +\n          '<div class=\"tp-trend-chart\" id=\"tpTrendChart' + uid + '\"></div>' +\n          '<div class=\"tp-trend-labels\" id=\"tpTrendLabels' + uid + '\"></div>' +\n          '<div class=\"tp-trend-legend\">' +\n            '<span><span class=\"tp-trend-legend-dot\" style=\"background:#2563eb;\"></span>实际达成</span>' +\n          '</div>' +\n        '</div>' +\n        '<div class=\"cp-dim-section\" style=\"border-bottom:none;margin-top:8px;\">' +\n          '<div style=\"display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:#eff6ff;border-radius:8px;border:1px solid #bfdbfe;\">' +\n            '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:2px;\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>' +\n            '<div style=\"font-size:12px;color:#1e40af;line-height:1.7;\"><strong>同类机构均值：</strong>当前机构类型为<strong>战略机构</strong>，以下对比基准取同类战略机构（剔除中心城市）均值。</div>' +\n          '</div>' +\n        '</div>' +\n      '</div>' +\n    '</div>';\n\n  if (skipAchieve) {\n    msgs.appendChild(row);\n    msgs.scrollTop = msgs.scrollHeight;\n    window['_tpIdxs_' + uid] = [5, 6, 7];\n    renderVbarChart(uid);\n    renderTrendLineChart(uid);\n  } else {\n    var profileCard = row.querySelector('.team-profile-card');\n    var profileWrap = document.getElementById('achieveTeamProfileWrap');\n    if (profileWrap && profileCard) {\n      var innerDiv = document.createElement('div');\n      innerDiv.style.cssText = 'padding:0;';\n      innerDiv.appendChild(profileCard.cloneNode(true));\n      profileWrap.innerHTML = '';\n      profileWrap.appendChild(innerDiv);\n      profileWrap.style.display = 'block';\n      window['_tpIdxs_' + uid] = [5, 6, 7];\n      renderVbarChart(uid);\n      renderTrendLineChart(uid);\n    }\n    var _tpHead = document.getElementById('achieveTeamProfileHeadWrap');\n    if (_tpHead) {\n      _tpHead.innerHTML =\n        '<span style=\"font-size:12px;color:var(--text-muted);\">对比期间</span>' +\n        '<div class=\"month-switcher\">' +\n          '<button class=\"month-tab active\" onclick=\"switchTeamProfileTab(\\'' + uid + '\\', \\'yoy\\', this)\">同比</button>' +\n          '<button class=\"month-tab\" onclick=\"switchTeamProfileTab(\\'' + uid + '\\', \\'qoq\\', this)\">环比</button>' +\n        '</div>';\n    }\n    setTimeout(function(){ appendTeamAchieveCard(); }, 300);\n  }\n}\n\nfunction getTeamVisibleMonthIdxs(uid) {\n  var stored = window['_tpIdxs_' + uid];\n  if (stored) return { idxs: stored, refIdx: stored[stored.length - 1] };\n  return { idxs: [5, 6, 7], refIdx: 7 }; // default: 同比\n}\n\nfunction switchTeamProfileTab(uid, mode, btn) {\n  btn.closest('.month-switcher').querySelectorAll('.month-tab').forEach(function(t) {\n    t.classList.remove('active');\n  });\n  btn.classList.add('active');\n  window['_tpIdxs_' + uid] = (mode === 'yoy') ? [5, 6, 7] : [8, 9, 10];\n  renderVbarChart(uid);\n  renderTrendLineChart(uid);\n}\n\nvar levelNatPcts   = ['3.2%', '8.5%', '15.3%', '58.6%', '14.4%'];\nvar levelPeerPcts  = ['3.8%', '9.2%', '16.7%', '57.1%', '13.2%'];\nvar levelElitePcts = ['4.8%', '11.3%', '19.5%', '53.2%', '11.2%'];\n\nfunction renderVbarChart(uid) {\n  var vis = getTeamVisibleMonthIdxs(uid);\n  var visIdxs = vis.idxs, refIdx = vis.refIdx;\n  var html = '<div style=\"overflow-x:auto;\"><table class=\"tp-table tp-table-split\">';\n  html += '<colgroup><col class=\"tp-col-first\"/>';\n  visIdxs.forEach(function() {\n    html += '<col class=\"tp-col-data\"/><col class=\"tp-col-data\"/><col class=\"tp-col-data\"/><col class=\"tp-col-data\"/><col class=\"tp-col-data\"/><col class=\"tp-col-data\"/>';\n  });\n  html += '</colgroup><thead>';\n  html += '<tr><th rowspan=\"2\">钻石等级</th>';\n  visIdxs.forEach(function(mi) {\n    var cls = (mi === refIdx) ? ' class=\"tp-month-current\"' : '';\n    html += '<th colspan=\"6\"' + cls + '>' + (teamData.monthYears[mi] || '') + '年' + teamData.monthLabels[mi] + '</th>';\n  });\n  html += '</tr><tr>';\n  visIdxs.forEach(function(mi) {\n    var cls = (mi === refIdx) ? ' class=\"tp-month-current\"' : '';\n    html += '<th' + cls + '>人力</th><th' + cls + '>人力占比</th>' +\n            '<th' + cls + ' style=\"font-size:11px;white-space:nowrap;\">全系统<br>人力占比</th>' +\n            '<th' + cls + ' style=\"font-size:11px;white-space:nowrap;\">同类机构<br>人力占比</th>' +\n            '<th' + cls + ' style=\"font-size:11px;white-space:nowrap;\">全国TOP1机构<br>人力占比</th>' +\n            '<th' + cls + '>人均NBEV</th><th' + cls + '>NBEV(万)</th>';\n  });\n  html += '</tr></thead><tbody>';\n\n  levelNames.forEach(function(name, li) {\n    html += '<tr><td><span class=\"tp-level-tag\"><span class=\"tp-level-dot\" style=\"background:' + levelColors[li] + ';\"></span>' + name + '</span></td>';\n    visIdxs.forEach(function(mi) {\n      var cnt = teamData.levels[mi][li];\n      var totalActive = teamData.levels[mi].reduce(function(a,b){return a+b;},0);\n      var hcPct = totalActive > 0 ? (cnt / totalActive * 100).toFixed(1) + '%' : '—';\n      var nbevPer = teamData.levelNbevPer[li].toFixed(1);\n      var nbev = getLevelMonthNbev(li, mi).toFixed(2);\n      var cls = (mi === refIdx) ? ' class=\"tp-month-current\"' : '';\n      html += '<td' + cls + '>' + cnt + '</td>' +\n              '<td' + cls + ' style=\"color:var(--text-secondary);\">' + hcPct + '</td>' +\n              '<td' + cls + ' style=\"color:var(--text-secondary);\">' + (levelNatPcts[li] || '—') + '</td>' +\n              '<td' + cls + ' style=\"color:var(--text-secondary);\">' + (levelPeerPcts[li] || '—') + '</td>' +\n              '<td' + cls + ' style=\"color:var(--text-secondary);\">' + (levelElitePcts[li] || '—') + '</td>' +\n              '<td' + cls + ' style=\"color:var(--text-secondary); h(function(v, vi) {\n    var rowSum = 0;\n    var cells = '';\n    clientData.temperature.forEach(function(t, ti) {\n      var cnt = matrix[vi][ti];\n      rowSum += cnt;\n      cells += '<td>' + cnt + '</td>';\n    });\n    tableHtml += '<tr><td><span class=\"tp-level-tag\"><span class=\"tp-level-dot\" style=\"background:' + v.color + ';\"></span>' + v.name + '</span></td>' + cells + '<td style=\"font-weight:600;background:#f8faff;\">' + rowSum + '</td></tr>';\n  });\n\n  tableHtml += '</tbody></table></div>';\n  return tableHtml;\n}\n\nfunction buildClientProfileCardHTML(uid, totalClients, totalTemp) {\n  return '<div class=\"msg-avatar ai\"><img src=\"' + aiAvatarSrc + '\" alt=\"助手\"/></div>' +\n    '<div class=\"msg-bubble ai-bubble tool-bubble\">' +\n      '<div style=\"margin-bottom:6px;font-size:13px;color:var(--text-secondary);\">深圳市南山营业区 过往数据分析</div>' +\n      '<div class=\"team-profile-card\">' +\n        '<div class=\"team-profile-header\">' +\n          '<div class=\"team-profile-icon\" style=\"background:#eff6ff;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87\"/><path d=\"M16 3.13a4 4 0 010 7.75\"/></svg></div>' +\n          '<div class=\"team-profile-title\">过往数据分析</div>' +\n          '<div class=\"team-profile-subtitle\">投保客户 ' + totalClients + ' 人</div>' +\n        '</div>' +\n        buildClientTenureAnalysisHTML(uid) +\n        /* 维度1: 客温×客价 二维表 */\n        '<div class=\"cp-dim-section\">' +\n          '<div class=\"client-compare-head\">' +\n            '<div class=\"cp-dim-title\" style=\"margin:0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"><path d=\"M12 20V10\"/><path d=\"M18 20V4\"/><path d=\"M6 20v-4\"/></svg> 客温 × 客价 分布（当前月数据）</div>' +\n            '<span class=\"client-current-month-tag\">当前月：202
