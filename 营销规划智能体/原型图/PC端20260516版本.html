<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平安DO - 智能工作台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #2563eb;
    --primary-light: #3b82f6;
    --primary-dark: #1e40af;
    --bg-deep: #0f172a;
    --bg-nav: #1e293b;
    --bg-sidebar: #f8fafc;
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --accent-orange: #f59e0b;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== TOP NAV ===== */
  .top-nav {
    background: var(--bg-deep);
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    color: #fff;
    z-index: 100;
    position: relative;
  }
  .top-nav::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
  }

  .nav-logo { display: flex; align-items: center; gap: 10px; margin-right: 28px; }
  .nav-logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
    letter-spacing: -0.5px;
    box-shadow: 0 2px 8px rgba(37,99,235,0.4);
  }
  .nav-logo-text { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .nav-logo-sub { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: -1px; }

  .nav-menu { display: flex; flex: 1; }
  .nav-menu a {
    color: rgba(255,255,255,0.6); text-decoration: none;
    padding: 0 14px; height: 52px;
    display: flex; align-items: center; font-size: 13px;
    transition: all 0.25s; position: relative;
    font-weight: 400;
  }
  .nav-menu a:hover { color: rgba(255,255,255,0.9); }
  .nav-menu a.active {
    color: #fff; font-weight: 500;
  }
  .nav-menu a.active::after {
    content: ''; position: absolute; bottom: 0; left: 14px; right: 14px;
    height: 2px; background: var(--primary-light); border-radius: 2px 2px 0 0;
  }

  .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-right-icon {
    width: 18px; height: 18px; cursor: pointer; opacity: 0.5;
    transition: opacity 0.2s;
  }
  .nav-right-icon:hover { opacity: 0.9; }
  .nav-avatar {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 4px 8px; border-radius: 20px;
    transition: background 0.2s;
  }
  .nav-avatar:hover { background: rgba(255,255,255,0.08); }
  .nav-avatar-circle {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== 3-COLUMN LAYOUT ===== */
  .app-body {
    display: flex;
    height: calc(100vh - 52px);
    overflow: hidden;
  }

  /* ===== LEFT SIDEBAR: Claude-style Light ===== */
  .sidebar-left {
    width: 260px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    color: var(--text-primary);
  }
  .sidebar-brand {
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-brand-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }
  .sidebar-collapse-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .sidebar-collapse-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-secondary); }

  .sidebar-back-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .sidebar-back-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }

  .sidebar-nav {
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .sidebar-nav-item:hover { background: rgba(0,0,0,0.04); color: var(--text-primary); }
  .sidebar-nav-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    opacity: 0.6;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 18px 16px;
  }

  /* New Chat Button — Claude Code style */
  .sidebar-new-chat {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 8px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
    border: 1px dashed var(--border);
    background: transparent;
  }
  .sidebar-new-chat:hover {
    background: rgba(0,0,0,0.04);
    color: var(--text-primary);
    border-color: var(--text-muted);
  }
  .sidebar-new-chat svg {
    opacity: 0.6;
    flex-shrink: 0;
  }
  .sidebar-new-chat:hover svg {
    opacity: 1;
  }

  .sidebar-section-label {
    font-size: 12px;
    color: var(--text-muted);
    padding: 10px 16px 6px;
    font-weight: 500;
  }

  .chat-list {
    max-height: 304px;
    overflow-y: auto;
    padding: 0 8px 12px;
    flex-shrink: 0;
  }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 4px; }
  .chat-list::-webkit-scrollbar-track { background: transparent; }

  .chat-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .chat-item:hover { background: rgba(0,0,0,0.04); color: var(--text-primary); }
  .chat-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border);
    box-shadow: var(--shadow-sm);
  }
  .chat-item-title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .chat-item-more {
    opacity: 0;
    transition: opacity 0.15s;
    color: var(--text-muted);
    font-size: 16px;
    letter-spacing: -3px;
    flex-shrink: 0;
    padding-left: 8px;
    line-height: 1;
  }
  .chat-item:hover .chat-item-more { opacity: 1; }

  /* ===== CENTER: AI Chat ===== */
  .center-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-main);
    min-width: 0;
    padding: 16px;
  }
  .chat-frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .chat-frame-topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
  }
  .exit-chat-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .exit-chat-btn:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
    background: #fef2f2;
  }
  .exit-chat-btn svg {
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .exit-chat-btn:hover svg {
    opacity: 1;
    stroke: var(--accent-red);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    background: #fafbfd;
  }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* AI Welcome */
  .ai-welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 20px;
  }
  .ai-avatar-large {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(37,99,235,0.25);
    margin-bottom: 12px;
    border: 2px solid #dbeafe;
  }
  .ai-avatar-large img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .ai-welcome h2 {
    font-size: 18px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .ai-welcome p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Message Bubbles */
  .msg-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    max-width: 100%;
    animation: msgIn 0.3s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .msg-avatar.ai {
    background: transparent;
    overflow: hidden;
    border-radius: 50%;
  }
  .msg-avatar.ai img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .msg-avatar.user-av {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
  }
  .msg-bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-primary);
  }
  .msg-bubble.ai-bubble {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .msg-bubble.user-bubble {
    background: var(--primary);
    color: #fff;
    border-top-right-radius: 4px;
  }

  /* ===== DASHBOARD: Two Panel Layout ===== */
  .dashboard-wrap {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .dashboard-panel {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
  }
  .dashboard-panel.panel-biz { flex: 2; }
  .dashboard-panel.panel-hr { flex: 1; }
  .panel-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border-light);
  }
  .panel-title .icon-wrap {
    width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-title .icon-wrap.biz-icon { background: #fff7ed; }
  .panel-title .icon-wrap.hr-icon { background: #eff6ff; }
  .kpi-row-db { display: flex; gap: 8px; margin-bottom: 8px; }
  .kpi-card {
    flex: 1; background: var(--bg-sidebar); border-radius: var(--radius-sm);
    padding: 8px 10px;
  }
  .kpi-card-label {
    font-size: 12px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  .kpi-card-dot { width: 7px; height: 7px; border-radius: 50%; }
  .kpi-card-dot.orange { background: #f97316; }
  .kpi-card-dot.teal { background: #0d9488; }
  .kpi-card-value { font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .kpi-card-unit { font-size: 12px; font-weight: 400; color: var(--text-muted); }
  .chart-section { margin-top: 2px; }
  .chart-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .chart-legend { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .chart-legend-dot { width: 7px; height: 7px; border-radius: 50%; }
  .chart-filter-btn {
    margin-left: auto; padding: 3px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-xs);
    font-size: 11px; color: var(--text-secondary); background: var(--bg-card); cursor: pointer;
  }
  .chart-area-db { position: relative; height: 100px; margin: 4px 0; }
  .chart-x-axis-db {
    display: flex; justify-content: space-between;
    color: var(--text-muted); font-size: 11px; padding-top: 6px;
  }
  .hr-stat-grid { display: flex; gap: 4px; margin-bottom: 2px; }
  .hr-stat-card { flex: 1; }
  .hr-stat-card {
    background: var(--bg-sidebar); border-radius: var(--radius-sm);
    padding: 4px 8px; text-align: center;
  }
  
  .hr-stat-label { font-size: 10px; color: var(--text-muted); margin-bottom: 1px; }
  .hr-stat-value { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .hr-stat-sub { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
  .radar-section {
    padding-top: 2px; border-top: 1px solid var(--border-light);
    display: flex; flex-direction: column; align-items: center;
  }
  .radar-section-title {
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px; align-self: flex-start;
  }
  .radar-stats { display: flex; justify-content: space-around; width: 100%; margin-top: 2px; }
  .radar-stat-item { text-align: center; }
  .radar-stat-label { font-size: 9px; color: var(--text-muted); }
  .radar-stat-val { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-top: 1px; }
  .chart-svg { width: 100%; height: 100%; }
  .grid-line { stroke: #f0f0f0; stroke-width: 1; }

  
  /* Sidebar collapse: icon-only rail */
  .sidebar-left {
    transition: width 0.25s ease;
    overflow: hidden;
  }
  .sidebar-left.collapsed {
    width: 52px !important;
  }
  .sidebar-left.collapsed .sidebar-brand-name,
  .sidebar-left.collapsed .sidebar-nav-item span,
  .sidebar-left.collapsed .sidebar-section-label,
  .sidebar-left.collapsed .chat-list,
  .sidebar-left.collapsed .sidebar-divider,
  .sidebar-left.collapsed .sidebar-new-chat span {
    display: none;
  }
  .sidebar-left.collapsed .sidebar-brand {
    padding: 14px 0;
    justify-content: center;
  }
  .sidebar-left.collapsed .sidebar-collapse-btn {
    margin: 0;
  }
  .sidebar-left.collapsed .sidebar-nav {
    padding: 4px 0;
    align-items: center;
    gap: 2px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-left.collapsed .sidebar-nav:last-of-type {
    border-bottom: none;
  }
  .sidebar-exit-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 8px 12px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    background: var(--bg-card);
    font-family: inherit;
    width: calc(100% - 16px);
    transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .sidebar-exit-btn:hover {
    background: #fef2f2;
    border-color: #fca5a5;
    color: var(--accent-red);
    box-shadow: none;
  }
  .sidebar-exit-btn svg { flex-shrink: 0; transition: all 0.15s; }
  .sidebar-exit-btn:hover svg { stroke: var(--accent-red); }
  .sidebar-left.collapsed .sidebar-exit-btn span { display: none; }
  .sidebar-left.collapsed .sidebar-exit-btn {
    width: 36px; height: 36px;
    padding: 0; margin: 0 auto 12px;
    justify-content: center;
  }
  .sidebar-left.collapsed .sidebar-nav-item {
    width: 36px; height: 36px;
    padding: 0;
    justify-content: center;
    border-radius: 8px;
    gap: 0;
  }
  .sidebar-left.collapsed .sidebar-new-chat {
    width: 36px; height: 36px;
    padding: 0;
    justify-content: center;
    border-radius: 8px;
    gap: 0;
    margin: 0 auto;
    border-style: solid;
  }
  .sidebar-left.collapsed .sidebar-nav-icon {
    width: 20px; height: 20px;
  }
  .center-panel {
    transition: flex 0.25s ease;
  }
  /* Hide expand btn - no longer needed */
  .sidebar-expand-btn { display: none !important; }

  
  /* Fullscreen button on dashboard panels */
  .panel-fullscreen-btn {
    width: 24px; height: 24px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--bg-card);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); transition: all 0.15s; margin-left: auto; flex-shrink: 0;
  }
  .panel-fullscreen-btn:hover { background: var(--bg-sidebar); color: var(--text-primary); }
  .dashboard-panel.fullscreen-mode {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1000; border-radius: 0; border: none;
    padding: 24px 32px; overflow-y: auto;
  }
  .dashboard-panel.fullscreen-mode .chart-area-db { height: 300px; }
  .fullscreen-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 999;
  }
  .fullscreen-overlay.active { display: block; }

  /* Path dimension options — polished AI style */
  .path-options-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .path-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }
  .path-option::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--primary);
    opacity: 0;
    transition: opacity 0.25s;
    border-radius: 0 2px 2px 0;
  }
  .path-option:hover {
    border-color: #c7d2fe;
    background: #f8faff;
    transform: translateX(2px);
  }
  .path-option:hover::before {
    opacity: 0.4;
  }
  .path-option.selected {
    border-color: var(--primary-light);
    background: #eef2ff;
  }
  .path-option.selected::before {
    opacity: 1;
  }
  .path-option-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s;
    background: var(--bg-card);
  }
  .path-option.selected .path-option-dot {
    border-color: var(--primary);
    background: var(--primary);
  }
  .path-option-dot-inner {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .path-option.selected .path-option-dot-inner {
    opacity: 1;
  }
  .path-option-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    transition: color 0.2s;
  }
  .path-option.selected .path-option-label {
    color: var(--primary);
    font-weight: 600;
  }
  /* Multi-select variant: square checkbox */
  .path-option-check {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    background: var(--bg-card);
  }
  .path-option-check svg {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .path-option-multi.selected .path-option-check {
    border-color: var(--primary);
    background: var(--primary);
  }
  .path-option-multi.selected .path-option-check svg {
    opacity: 1;
  }
  .path-multi-confirm-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .path-multi-confirm-btn {
    padding: 7px 22px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .path-multi-confirm-btn:hover:not(:disabled) {
    background: var(--primary-dark, #1d4ed8);
    transform: translateY(-1px);
  }
  .path-multi-confirm-btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }
  /* ===== Multi-question unified card header ===== */
  .mq-step { transition: opacity 0.18s; }
  .mq-card-disabled {
    opacity: 0.38;
    pointer-events: none;
    user-select: none;
  }
  .mq-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -14px -16px 16px;
    padding: 10px 16px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border-light);
    border-radius: 12px 12px 0 0;
  }
  .mq-card-title {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .mq-step-tag {
    font-size: 11px;
    font-weight: 600;
    color: #2563eb;
    background: #eff6ff;
    border-radius: 20px;
    padding: 2px 10px;
  }
  /* Section separator for each path in multi-path flow */
  .path-section-header-bubble {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #eff6ff;
    border: 1px solid #dbeafe;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin-left: 8px;
  }
  .path-response-header {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    line-height: 1.5;
  }

  /* NBEV target input card */
  .nbev-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: all 0.25s;
    cursor: text;
  }
  .nbev-input-wrap:focus-within {
    border-color: var(--primary-light);
    background: #f8faff;
  }
  .nbev-input-wrap.has-value {
    border-color: var(--primary);
    background: #eef2ff;
  }
  .nbev-input-wrap.has-value .path-option-dot {
    border-color: var(--primary);
    background: var(--primary);
  }
  .nbev-input-wrap.has-value .path-option-dot-inner {
    opacity: 1;
  }
  
  
  /* Custom target confirm button */
  .nbev-confirm-btn {
    display: none;
    align-items: center;
    justify-content: center;
    padding: 3px 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .nbev-confirm-btn:hover { background: var(--primary-dark); }
  .nbev-input-wrap.has-value .nbev-confirm-btn { display: flex; }
  .nbev-input-wrap.confirmed {
    border-color: var(--primary);
    background: #eef2ff;
    pointer-events: none;
  }
  .nbev-input-wrap.confirmed .nbev-input {
    color: var(--primary);
    font-weight: 600;
  }
  .nbev-input-wrap.confirmed .nbev-confirm-btn {
    display: flex;
    background: #10b981;
    pointer-events: none;
  }
  .nbev-input-wrap.confirmed .path-option-dot {
    border-color: var(--primary);
    background: var(--primary);
  }
  .nbev-input-wrap.confirmed .path-option-dot-inner {
    opacity: 1;
  }

  /* Hide number input spinners */
  .nbev-input::-webkit-outer-spin-button,
  .nbev-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .nbev-input[type=number] { -moz-appearance: textfield; }

  .nbev-input {
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    width: 60px;
    padding: 2px 0;
  }
  .nbev-input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
  }
  .nbev-unit {
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }


  /* Recommend questions above input — horizontal left-to-right scroll */
  .recommend-section {
    padding: 0 28px 6px;
    background: var(--bg-card);
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  }
  .recommend-viewport {
    overflow: hidden;
    position: relative;
  }
  .recommend-track {
    display: flex;
    gap: 8px;
    animation: recScrollLR 22s linear infinite;
    will-change: transform;
    white-space: nowrap;
  }
  .recommend-section:hover .recommend-track {
    animation-play-state: paused;
  }
  @keyframes recScrollLR {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .recommend-page {
    display: contents;
  }
  .recommend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .recommend-item:hover {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: var(--primary);
  }
  .recommend-arrow {
    flex-shrink: 0;
    width: 10px; height: 12px;
    display: inline-flex;
    align-items: center;
    opacity: 0.4;
    transition: opacity 0.15s;
    margin-left: 20px;
  }
  .recommend-item:hover .recommend-arrow { opacity: 0.8; }


  /* AI Thinking card */
  .thinking-card {
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-top: 8px;
    position: relative;
  }

  /* Shared width for all tool output bubbles */
  .msg-bubble.tool-bubble {
    max-width: 75%;
    width: 75%;
  }
  .thinking-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .thinking-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .thinking-spinner.done { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thinking-body {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    overflow: hidden;
    transition: max-height 0.3s ease;
    width: 100%;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .thinking-body.collapsed {
    max-height: 4.8em; /* ~3 lines at 1.6 line-height */
  }
  .thinking-body .cursor {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: var(--primary);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.6s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 8px;
    padding: 4px 0;
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.2s;
    border: none;
    background: none;
    font-family: inherit;
    width: 100%;
  }
  .thinking-toggle:hover { opacity: 0.7; }
  .thinking-toggle.visible { display: flex; }
  .thinking-toggle svg { transition: transform 0.3s; }
  .thinking-toggle.expanded svg { transform: rotate(180deg); }


  /* ===== Atomic Tool: Team Profile Card ===== */
  .team-profile-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 8px;
  }
  .team-profile-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
  }
  .team-profile-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: #eff6ff;
    display: flex; align-items: center; justify-content: center;
  }
  .team-profile-title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
  }
  .team-profile-subtitle {
    font-size: 11px; color: var(--text-muted); margin-left: auto;
  }

  /* Team level table */
  .tp-chart-section { margin-bottom: 12px; }
  .tp-chart-title {
    font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;
  }
  .tp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .tp-table th {
    padding: 6px 4px;
    font-weight: 500;
    color: var(--text-muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg-sidebar);
    font-size: 11px;
  }
  .tp-table th:first-child {
    text-align: left;
    padding-left: 10px;
    min-width: 80px;
  }
  .tp-table td {
    padding: 7px 4px;
    text-align: center;
    color: var(--text-primary);
    font-weight: 500;
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
  }
  .tp-table td:first-child {
    text-align: left;
    padding-left: 6px;
  }
  .tp-table tr:last-child td { border-bottom: none; }
  .tp-table tr:hover td { background: #f8fafc; }
  .tp-level-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tp-level-dot {
    width: 8px; height: 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .tp-table .tp-row-total td {
    font-weight: 700;
    color: var(--text-primary);
    border-top: 1px solid var(--border);
    background: var(--bg-sidebar);
  }

  /* Split table with 2 sub-columns per month (人力 / NBEV) */
  .tp-table-split {
    font-size: 11px;
    min-width: 560px;
    table-layout: fixed;
    width: 100%;
  }
  .tp-table-split col.tp-col-first { width: 62px; }
  .tp-table-split col.tp-col-data { width: 40px; }
  .tp-table-split th {
    padding: 5px 2px;
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tp-table-split thead tr:first-child th {
    border-bottom: 1px solid var(--border-light);
  }
  .tp-table-split thead tr:first-child th[colspan="2"] {
    border-left: 1px solid var(--border-light);
  }
  .tp-table-split thead tr:first-child th:first-child {
    border-left: none;
  }
  .tp-table-split td {
    padding: 6px 2px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Visual divider between months: left border on first sub-col (人力) of each month except the very first */
  .tp-table-split tbody td:nth-child(2n),
  .tp-table-split thead tr:nth-child(2) th:nth-child(2n) {
    border-left: 1px solid var(--border-light);
  }
  .tp-table-split tbody td:first-child,
  .tp-table-split thead tr:nth-child(2) th:first-child {
    border-left: none;
  }
  /* Current month: bold only, no background fill */
  .tp-table-split .tp-month-current {
    color: var(--text-primary);
    font-weight: 700;
  }

  /* NBEV trend section — line chart */
  .tp-trend-section {
    margin-top: 12px;
  }
  .tp-trend-title {
    font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;
  }
  .tp-trend-chart {
    position: relative;
    height: 110px;
  }
  .tp-trend-chart svg { width: 100%; height: 100%; }
  .tp-trend-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 8px 0;
  }
  .tp-trend-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .tp-trend-legend-dot {
    display: inline-block;
    width: 12px; height: 3px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .tp-trend-legend-line {
    display: inline-block;
    width: 14px; height: 0;
    border-top: 2px dashed #f59e0b;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* ===== Team Achievement Estimation Card ===== */
  .team-achieve-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 8px;
  }

  /* ===== AI Model Data Interpretation ===== */
  .ai-interpret-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
  }
  .ai-interpret-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .ai-interpret-header svg {
    flex-shrink: 0;
  }
  .ai-interpret-body {
    background: var(--bg-sidebar);

    margin-bottom: 6px;

  .ai-interpret-body p:last-child {

  }
  .ai-interpret-body strong {
    color: var(--text-primary);
    font-weight: 600;
  }
  .team-achieve-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
  }
  .team-achieve-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: #eff6ff;
    display: flex; align-items: center; justify-content: center;
  }
  .team-achieve-title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
  }
  .team-achieve-subtitle {
    font-size: 11px; color: var(--text-muted); margin-left: auto;
  }

  /* Pie chart layout */
  .ta-pie-section {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .ta-pie-wrap {
    width: 150px; height: 150px;
    flex-shrink: 0;
    position: relative;
  }
  .ta-pie-wrap svg { width: 100%; height: 100%; }
  .ta-pie-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ta-pie-center-val {
    font-size: 18px; font-weight: 700; color: var(--text-primary);
  }
  .ta-pie-center-label {
    font-size: 10px; color: var(--text-muted);
  }

  .ta-legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .ta-legend-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px 5px;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 2px;
  }
  .ta-legend-hd {
    font-size: 10px !important;
    font-weight: 500 !important;
    color: var(--text-muted) !important;
  }
  .ta-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 6px;
    transition: background 0.15s;
    cursor: default;
  }
  .ta-legend-item:hover { background: var(--bg-sidebar); }
  .ta-legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .ta-legend-name {
    font-size: 12px;
    color: var(--text-secondary);
    flex: 1;
  }
  .ta-legend-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    min-width: 30px;
    text-align: right;
  }
  .ta-legend-nbev {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    min-width: 44px;
    text-align: right;
  }
  .tp-row-act-rate td {
    font-size: 11px;

    border-top: 1px solid var(--border-light);
    font-weight: 600;
  }
  .ta-legend-pct {
    font-size: 11px;
    color: var(--text-muted);
    min-width: 36px;
    text-align: right;
  }

  /* NBEV prediction summary */
  .ta-nbev-summary {
    padding: 12px 16px;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ta-nbev-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #eff6ff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ta-nbev-info { flex: 1; }
  .ta-nbev-label {
    font-size: 11px; color: var(--text-secondary); margin-bottom: 2px;
  }
  .ta-nbev-row {
    display: flex; align-items: baseline; gap: 6px;
  }
  .ta-nbev-val {
    font-size: 22px; font-weight: 700; color: var(--primary-dark);
    letter-spacing: -0.5px;
  }
  .ta-nbev-unit {
    font-size: 12px; color: var(--text-secondary); font-weight: 500;
  }
  .ta-nbev-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: #dcfce7;
    color: #16a34a;
    margin-left: auto;
    flex-shrink: 0;
  }
  .ta-nbev-badge.warning {
    background: #fef3c7;
    color: #d97706;
  }

  /* Inline metrics: target + predicted side by side */
  .ta-metrics-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .ta-metric-card {
    flex: 1;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-sidebar);
  }
  .ta-metric-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .ta-metric-val-row {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .ta-metric-val {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }
  .ta-metric-val.primary { color: var(--primary-dark); }
  .ta-metric-unit {
    font-size: 11px;
    color: var(--text-muted);
  }
  .ta-metric-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 6px;
    vertical-align: middle;
  }
  .ta-metric-badge.green { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .ta-metric-badge.yellow { background: #fefce8; color: #92400e; border: 1px solid #fde68a; }

  /* Next step recommendations */
  .ta-next-steps {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
  }
  /* Outer next-steps (below card) */

  .ta-next-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);

  /* Atomic tool cards - accent border */

    border-left: 3px solid var(--primary);

    color: #cbd5e1;
    font-weight: 400;
    padding-top: 3px;
    line-height: 1;

  .cfa-result-row {

  .cfa-total-inner {
    display: flex;

    gap: 3px;

  .cag-table th {
    font-size: 11px; font-weight: 500; padding: 0 4px 6px; text-align: center; white-space: nowrap;

  .cag-table th:first-child { text-align: left; color: var(--text-muted); font-size: 10px; }

  .cag-cell {
    background: #f8fafc; border-radius: 8px; padding: 8px 4px; text-align: center;
  }
  .cag-cell-count { font-size: 15px; font-weight: 700; color: #1e293b; line-height: 1.2; }

  }
  .cag-grand-count { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.2; }
  .cag-grand-nbev { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 3px; }

  /* 3-value sub-cell layout in 客户达成测算 */

<script>
function toggleSidebar() {
  document.querySelector('.sidebar-left').classList.toggle('collapsed');
}

function newChat() {
  const msgs = document.querySelector('.chat-messages');
  if (msgs) {
    // Keep only the welcome message
    const allRows = msgs.querySelectorAll('.msg-row');
    allRows.forEach((row, i) => { if (i > 0) row.remove(); });
  }
  // Deselect active chat
  document.querySelectorAll('.chat-item').forEach(c => c.classList.remove('active'));
}

var aiAvatarSrc = document.querySelector('.msg-avatar.ai img') ? document.querySelector('.msg-avatar.ai img').src : '';

function isPathQuery(text) {
  var t = text.trim();
  return t === '帮我规划达成路径';
}

function isSpecificPathQuery(text) {
  var t = text.trim();
  return t === '帮我规划队伍达成路径' || t === '帮我规划客户达成路径' || t === '帮我规划产品达成路径';
}

function isTeamProfileQuery(text) {
  return text.indexOf('队伍是如何分布') !== -1 || text.indexOf('队伍是怎么分布') !== -1;
}

function isClientProfileQuery(text) {
  return text.indexOf('客户是如何分布') !== -1 || text.indexOf('客户是怎么分布') !== -1;
}

// Queries semantically equivalent to "帮我规划达成路径" (multi-path planning)
function isPlanAchievementQuery(text) {
  var t = text.trim();
  if (t === '帮我规划达成路径') return true;
  if (t.indexOf('规划') !== -1 && t.indexOf('达成路径') !== -1) return true;
  if (t.indexOf('怎么达成') !== -1 && t.indexOf('NBEV') !== -1) return true;
  if (t.indexOf('完成NBEV目标') !== -1) return true;
  if (t.indexOf('如何才能完成') !== -1) return true;
  return false;
}

// Central query router — routes any query to the correct card/tool
function routeQuery(query) {
  if (isPlanAchievementQuery(query)) {
    // 帮我规划达成路径 / 怎么达成这个月的NBEV / 我要如何才能完成NBEV目标？
    // → 先NBEV目标追问，再路径类型多选
    multiPathMode = true;
    selectedPathLabel = '';
    nbevCardDone = false;
    pathCardDone  = false;
    pendingNbevValue    = null;
    pendingPathSelected = [];
    setTimeout(function(){ appendMultiQuestionCard(); }, 400);
  } else if (isSpecificPathQuery(query)) {
    // 帮我规划X达成路径 → 单路径流程，NBEV目标值追问
    multiPathMode = false;
    var match = query.match(/帮我规划(.+)达成路径/);
    if (match) selectedPathLabel = match[1];
    setTimeout(function(){ appendNbevCard(); }, 400);
  } else if (query === '我要调整目标') {
    // 我要调整目标 → NBEV目标值追问
    setTimeout(function(){ showTargetFollowUp(); }, 400);
  } else if (isTeamProfileQuery(query)) {
    // 队伍画像分析
    var old = document.querySelector('.team-profile-added');
    if (old) old.classList.remove('team-profile-added');
    setTimeout(function(){ appendTeamProfileCard(true); }, 400);
  } else if (isClientProfileQuery(query)) {
    // 客户画像分析
    setTimeout(function(){ appendClientProfileCard(); }, 400);
  }
}

  var query = '帮我规划' + pathLabel + '达成路径';
  appendUserBubble(query);
  selectedPathLabel = pathLabel;

  // Skip NBEV question — reuse existing target, go directly to thinking/cards

    setTimeout(function(){ appendProductInputCard(); }, 500);
  } else {
    setTimeout(function(){ appendThinkingCard(); }, 500);
  }

// Process queue of paths one by one. For each path, fire the profile card
// which internally chains to its achieve card. Fixed delay between paths
// allows profile+achieve to render fully before starting the next.
function processMultiPathQueue() {
  if (!multiPathQueue || multiPathQueue.length === 0) {
    finishMultiPathFlow();
    return;
  }
  var next = multiPathQueue.shift();
  var isLast = multiPathQueue.length === 0;
  var label = next;

  // Announce current path section (AI-side header)
  appendPathSectionHeader(label);

  if (label === '队伍') {
    // appendTeamProfileCard chains to appendTeamAchieveCard internally (~1.2s)
    setTimeout(function(){ appendTeamProfileCard(); }, 500);
    setTimeout(function(){
      if (isLast) { finishMultiPathFlow(); } else { processMultiPathQueue(); }
    }, 4800);
  } else if (label === '客户') {
    // appendClientProfileCardForPath chains to appendClientAchieveCard (~1.2s)
    setTimeout(function(){ appendClientProfileCardForPath(); }, 500);
    setTimeout(function(){
      if (isLast) { finishMultiPathFlow(); } else { processMultiPathQueue(); }
    }, 4800);
  } else if (label === '产品') {
    // Auto-pick the highest nbevPer main product — no user input required
    selectedPathLabel = '产品';
    var best = productData.mainProducts[0];
    productData.mainProducts.forEach(function(p) {
      if (p.nbevPer > best.nbevPer) best = p;
    });
    selectedMainProduct = best;
    calculateBestSubProduct();
    // Show product profile first, which chains to product achieve card
    setTimeout(function(){ appendProductProfileCard(); }, 500);
    setTimeout(function(){
      if (isLast) { finishMultiPathFlow(); } else { processMultiPathQueue(); }
    }, 5000);
  }
}

// Finalize multi-path flow: show unified next-step recommendation row

  if (!multiPathInProgress) return;
  multiPathInProgress = false;
  multiPathMode = false;
  setTimeout(function(){ appendUnifiedNextStepRow(); }, 600);
}

function appendUnifiedNextStepRow() {
  // Collect which tool types were shown in this conversation
  var shownKeys = [];
  if (shownAchieveCards.product) shownKeys.push('product');
  if (shownAchieveCards.client)  shownKeys.push('client');
  if (shownAchieveCards.team)    shownKeys.push('team');
  // Fallback: if none tracked yet, apply all rules
  if (!shownKeys.length) shownKeys = ['product', 'client', 'team'];

  var btns = buildNextStepHtml(shownKeys);
  if (!btns) return;

  var msgs = document.querySelector('.chat-messages');
  var nextRow = document.createElement('div');
  nextRow.className = 'msg-row multi-path-next-row';

  msgs.appendChild(nextRow);
  msgs.scrollTop = msgs.scrollHeight;
  setGenerating(false);
}

// 根据已展示的工具集合生成下一步按钮 HTML（去重 + 过滤已展示的达成路径）
function buildNextStepHtml(toolKeys) {
  var seen = {};
  var buttons = [];
  toolKeys.forEach(function(key) {
    (nextStepRules[key] || []).forEach(function(name) {
      if (seen[name]) return;
      if (name === '规划产品达成路径' && shownAchieveCards.product) return;
      if (name === '规划客户达成路径' && shownAchieveCards.client)  return;
      if (name === '规划队伍达成路径' && shownAchieveCards.team)    return;
      seen[name] = true;
      buttons.push(name);
    });
  });
  if (!buttons.length) return '';
  return buttons.map(function(name) {
    return '<div class="ta-next-btn" onclick="triggerAnyNextStep(\'' + name + '\')">' +
      (nextStepIcons[name] || '') + name + '</div>';
  }).join('');
}

// 统一 next-step 点击处理
function triggerAnyNextStep(name) {
  document.querySelectorAll(
    '.product-achieve-next-row, .client-achieve-next-row, .team-achieve-next-row, .multi-path-next-row'
  ).forEach(function(el) { fadeOutCard(el); });

  if (name === '调整目标值') {
    appendUserBubble('我要调整目标');
    routeQuery('我要调整目标');
  } else if (name === '调整产品分布') {
    appendUserBubble('我要调整产品分布');
    if (!selectedMainProduct) selectedMainProduct = productData.mainProducts[0];
    if (!selectedSubProduct)  selectedSubProduct  = productData.subProducts[0];
    setTimeout(function() { appendProductFeeCalcCard(); }, 600);
  } else if (name === '调整客户分布') {
    appendUserBubble('我要调整客户分布');
    setTimeout(function() { appendClientDistAdjustCard(); }, 600);
  } else if (name === '调整队伍分布') {
    appendUserBubble('我要调整队伍分布');
    setTimeout(function() { appendTeamDistAdjustCard(); }, 600);
  } else if (name === '规划产品达成路径') {
    triggerCrossPath('产品');
  } else if (name === '规划客户达成路径') {
    triggerCrossPath('客户');
  } else if (name === '规划队伍达成路径') {
    triggerCrossPath('队伍');
  }
}

function fadeOutCard(el) {
  if (!el) return;
  el.style.transition = 'opacity 1s ease-out';
  el.style.opacity = '0';
  setTimeout(function(){
    el.style.transition = 'max-height 0.8s ease, margin 0.8s ease';
    el.style.maxHeight = el.scrollHeight + 'px';
    // Force reflow
    el.offsetHeight;
    el.style.maxHeight = '0';
    el.style.overflow = 'hidden';
    el.style.marginBottom = '0';
  }, 1000);
  setTimeout(function(){ el.remove(); }, 1900);
}

var userNbevTarget = 300; // default assigned value

function selectNbevOption(el, type) {
  var wrap = el.closest('.msg-bubble');
  wrap.querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });
  var inputWrap = wrap.querySelector('.nbev-input-wrap');
  inputWrap.classList.remove('has-value');
  inputWrap.classList.remove('confirmed');
  var input = wrap.querySelector('.nbev-input');
  input.value = '';
  input.readOnly = false;
  var btn = inputWrap.querySelector('.nbev-confirm-btn');
  if (btn) btn.innerHTML = '确认';
  el.classList.add('selected');
  
  userNbevTarget = 300;

  // Hide the NBEV card
  var nbevRow = el.closest('.nbev-card-added');
  fadeOutCard(nbevRow);

  if (multiPathMode) {
    pendingNbevValue = '300';
    nbevCardDone = true;
    setTimeout(function(){ appendPathTypeCard(); }, 500);
  } else {
    appendUserBubble('NBEV目标值是300万');
    if (selectedPathLabel === '产品') {
      setTimeout(function(){ appendProductInputCard(); }, 500);
    } else {
      setTimeout(function(){ appendThinkingCard(); }, 500);
    }
  }
}


function confirmNbevCustom(e) {
  e.stopPropagation();
  var wrap = e.target.closest('.nbev-input-wrap');
  var input = wrap.querySelector('.nbev-input');
  if (!input.value.trim()) return;
  
  // Lock the selection
  wrap.classList.add('confirmed');
  input.readOnly = true;
  
  // Update button text to checkmark
  e.target.innerHTML = '✓ 已选';
  
  // Deselect option 1 if it was selected
  var bubble = wrap.closest('.msg-bubble');
  bubble.querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });
  
  userNbevTarget = parseFloat(input.value) || 300;
  var customVal = input.value;

  // Hide the NBEV card
  var nbevRow = wrap.closest('.nbev-card-added');
  fadeOutCard(nbevRow);
  
  if (multiPathMode) {
    pendingNbevValue = customVal;
    nbevCardDone = true;
    setTimeout(function(){ appendPathTypeCard(); }, 500);
  } else {
    appendUserBubble('NBEV目标值是' + customVal + '万');
    if (selectedPathLabel === '产品') {
      setTimeout(function(){ appendProductInputCard(); }, 500);
    } else {
      setTimeout(function(){ appendThinkingCard(); }, 500);
    }
  }
}


function selectNbevCustom(input) {
  var wrap = input.closest('.msg-bubble');
  wrap.querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });
  input.closest('.nbev-input-wrap').classList.add('has-value');
}

function onNbevInput(input) {
  // Legacy path (old nbev-input-wrap style)
  var wrap = input.closest('.nbev-input-wrap');
  if (wrap) {
    var bubble = input.closest('.msg-bubble');
    if (bubble) bubble.querySelectorAll('.path-option').forEach(function(o){ o.classList.remove('selected'); });
    if (input.value.trim()) { wrap.classList.add('has-value'); } else { wrap.classList.remove('has-value'); }
  }
  // New mq-card style
  var mqOpt = input.closest('.mq-nbev-opt');
  if (mqOpt) {
    var btn = mqOpt.querySelector('.nbev-confirm-btn');
    if (btn) btn.style.display = input.value.trim() ? 'flex' : 'none';
  }
}

var thinkingCharIndex = 0;
var thinkingLineIndex = 0;
var thinkingFullText = '';
var thinkingExpanded = false;
var isGenerating = false;
var generationStopped = false;

function setGenerating(val) {
  isGenerating = val;
  var voiceBtn  = document.getElementById('voiceBtn');
  var attachBtn = document.getElementById('attachBtn');
  var sendBtn   = document.getElementById('sendBtn');
  var stopBtn   = document.getElementById('stopBtn');
  if (!voiceBtn || !sendBtn || !stopBtn) return;
  if (val) {
    voiceBtn.style.display  = 'none';
    attachBtn.style.display = 'none';
    sendBtn.style.display   = 'none';
    stopBtn.classList.add('visible');
  } else {
    voiceBtn.style.display  = '';
    attachBtn.style.display = '';
    sendBtn.style.display   = '';
    stopBtn.classList.remove('visible');
  }
}

function stopGeneration() {
  generationStopped = true;
  setGenerating(false);
}

function typewriteThinking(lineIdx, charIdx) {
  if (generationStopped) return;

  if (lineIdx >= thinkingTexts.length) {
    // Done
    var cursor = document.querySelector('.thinking-body .cursor');
    if (cursor) cursor.remove();
    document.getElementById('thinkingSpinner').classList.add('done');
    document.getElementById('thinkingLabel').textContent = '思考完成';
    if (multiPathMode && multiPathQueue && multiPathQueue.length > 0) {
      setTimeout(function(){ if (!generationStopped) processMultiPathQueue(); }, 400);
      return;
    }
    if (selectedPathLabel === '队伍') {
      setTimeout(function(){ if (!generationStopped) appendTeamProfileCard(); }, 400);
    } else if (selectedPathLabel === '客户') {
      setTimeout(function(){ if (!generationStopped) appendClientProfileCardForPath(); }, 400);
    } else if (selectedPathLabel === '产品') {
      calculateBestSubProduct();
      setTimeout(function(){ if (!generationStopped) appendProductProfileCard(); }, 400);
    }
    return;
  }

  var body = document.getElementById('thinkingBody');
  if (!body) return;

  var line = thinkingTexts[lineIdx];

  if (charIdx === 0 && lineIdx > 0) {
    thinkingFullText += ' ';
  }

  if (charIdx < line.length) {
    thinkingFullText += line[charIdx];
    body.innerHTML = thinkingFullText + '<span class="cursor"></span>';

    checkThinkingOverflow();

    if (!thinkingExpanded) {
      body.scrollTop = body.scrollHeight;
    }

    var msgs = document.querySelector('.chat-messages');
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(function() { typewriteThinking(lineIdx, charIdx + 1); }, 8);
  } else {
    setTimeout(function() { typewriteThinking(lineIdx + 1, 0); }, 80);
  }
}

function checkThinkingOverflow() {
  var body = document.getElementById('thinkingBody');
  var toggle = document.getElementById('thinkingToggle');
  if (!body || !toggle) return;
  // Compare scrollHeight vs 3-line height (~4.8em ≈ 67px at 14px base)
  if (body.scrollHeight > body.clientHeight + 4) {
    toggle.classList.add('visible');
  }
}

function toggleThinking() {
  var body = document.getElementById('thinkingBody');
  var toggle = document.getElementById('thinkingToggle');
  var label = document.getElementById('thinkingToggleText');
  if (!body) return;
  
  thinkingExpanded = !thinkingExpanded;
  
  if (thinkingExpanded) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    label.textContent = '收起';
    toggle.classList.add('expanded');
  } else {
    body.classList.add('collapsed');
    body.style.maxHeight = '';
    label.textContent = '展开全部';
    toggle.classList.remove('expanded');
    body.scrollTop = body.scrollHeight;
  }
}

  monthLabels: ['11月', '12月', '1月', '2月', '3月', '4月'],
  levels: [
    [18, 35, 52, 78, 120],
    [20, 38, 55, 75, 124],
    [22, 40, 58, 72, 127],
    [19, 42, 60, 76, 130],
    [24, 45, 56, 80, 132],
    [26, 48, 62, 82, 134]
  ],
  // Per-level NBEV per person (万元) — used to derive monthly NBEV per level
  levelNbevPer: [8.2, 5.6, 3.4, 1.8, 0.6],
  // Non-active headcount per month (excluded from active levels, used for 活动率 denominator)
  nonActiveCounts: [75, 68, 62, 60, 58, 56],
  nbev:    [386, 412, 445, 398, 437, 463],
  targets: [400, 420, 450, 430, 450, 460]
};
var levelNames  = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];
var levelColors = ['#1e40af', '#2563eb', '#3b82f6', '#60a5fa', '#94a3b8'];
var lvClasses   = ['lv5','lv4','lv3','lv2'];

// Compute NBEV for a level in a given month (万元, 1 decimal)
function getLevelMonthNbev(li, mi) {
  var count = teamData.levels[mi][li];
  return Math.round(count * teamData.levelNbevPer[li] * 10) / 10;
}

function renderVbarChart(uid) {
  var lastIdx = teamData.monthLabels.length - 1;
  var html = '<div style="overflow-x:auto;"><table class="tp-table tp-table-split">';
  // colgroup — first col wider for level names, all data cols equal width
  html += '<colgroup><col class="tp-col-first"/>';
  teamData.monthLabels.forEach(function() {
    html += '<col class="tp-col-data"/><col class="tp-col-data"/>';
  });
  html += '</colgroup><thead>';
  // Row 1: month headers (each spans 2 cols)
  html += '<tr><th rowspan="2">钻石等级</th>';
  teamData.monthLabels.forEach(function(m, mi) {
    var cls = (mi === lastIdx) ? ' class="tp-month-current"' : '';
    html += '<th colspan="2"' + cls + '>' + m + '</th>';
  });
  html += '</tr>';
  // Row 2: 人力 / NBEV sub-headers
  html += '<tr>';
  teamData.monthLabels.forEach(function(m, mi) {
    var cls = (mi === lastIdx) ? ' class="tp-month-current"' : '';
    html += '<th' + cls + '>人力</th><th' + cls + '>NBEV(万)</th>';
  });
  html += '</tr></thead><tbody>';

  levelNames.forEach(function(name, li) {
    html += '<tr><td><span class="tp-level-tag"><span class="tp-level-dot" style="background:' + levelColors[li] + ';"></span>' + name + '</span></td>';
    teamData.levels.forEach(function(row, mi) {
      var cnt = row[li];
      var nbev = getLevelMonthNbev(li, mi).toFixed(2);
      var cls = (mi === lastIdx) ? ' class="tp-month-current"' : '';
      html += '<td' + cls + '>' + cnt + '</td><td' + cls + '>' + nbev + '</td>';
    });
    html += '</tr>';
  });

  // 活动率 row: (active levels sum) / (active + non-active)
  html += '<tr class="tp-row-act-rate"><td>活动率</td>';
  teamData.levels.forEach(function(row, mi) {
    var activeCnt = row.reduce(function(a,b){return a+b;},0);
    var totalInService = activeCnt + (teamData.nonActiveCounts[mi] || 0);
    var actRate = totalInService > 0 ? (activeCnt / totalInService * 100).toFixed(1) : '0.0';
    var cls = (mi === lastIdx) ? ' class="tp-month-current"' : '';
    html += '<td colspan="2"' + cls + ' style="font-weight:600;color:#2563eb;">' + actRate + '%</td>';
  });
  html += '</tr></tbody></table></div>';

  document.getElementById('tpTable' + uid).innerHTML = html;
}

function renderTrendLineChart(uid) {
  // Compute monthly NBEV totals from levels × nbevPer to match the table above
  var vals = teamData.monthLabels.map(function(m, mi) {
    var total = 0;
    for (var li = 0; li < teamData.levelNbevPer.length; li++) { total += getLevelMonthNbev(li, mi); }
    return Math.round(total * 10) / 10;
  });
  var _unused = teamData.nbev; // kept for reference
  var minV = Math.min.apply(null, vals) * 0.9;
  var maxV = Math.max.apply(null, vals) * 1.08;
  var W = 400, H = 100, pad = 12, padR = 12;
  var cW = W - pad - padR, cH = H - 20;

  function x(i) { return pad + (i / (vals.length - 1)) * cW; }
  function y(v) { return 10 + (1 - (v - minV) / (maxV - minV)) * cH; }

  var gradId = 'nbevGrad' + uid;

  // Grid lines
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  for (var g = 0; g < 4; g++) {
    var gy = 10 + (g / 3) * cH;
    svg += '<line x1="' + pad + '" y1="' + gy + '" x2="' + (W-padR) + '" y2="' + gy + '" stroke="#f0f0f0" stroke-width="0.8" stroke-dasharray="3,3"/>';
  }

  // Gradient fill under actual line
  svg += '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>' +
    '<stop offset="100%" stop-color="#2563eb" stop-opacity="0.01"/>' +
    '</linearGradient></defs>';

  // Actual values area fill
  var pts = [];
  vals.forEach(function(v, i) { pts.push(x(i) + ',' + y(v)); });
  svg += '<path d="M' + pts.join(' L') + ' L' + x(vals.length-1) + ',' + (10+cH) + ' L' + x(0) + ',' + (10+cH) + ' Z" fill="url(#' + gradId + ')"/>';

  // Actual solid line
  svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';

  // Dots + value labels
  vals.forEach(function(v, i) {
    var cx = x(i), cy = y(v);
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>';
    svg += '<text x="' + cx + '" y="' + (cy - 7) + '" text-anchor="middle" font-size="9" font-weight="600" fill="#1e293b">' + v + '</text>';
  });

  svg += '</svg>';
  document.getElementById('tpTrendChart' + uid).innerHTML = svg;

  // Month labels
  var labels = '';
  teamData.monthLabels.forEach(function(m) { labels += '<span>' + m + '</span>'; });
  document.getElementById('tpTrendLabels' + uid).innerHTML = labels;
}

// ===== Grouped row/col definitions for simplified 2D matrix =====
// Rows: A (A1+A2+A3+A4), BC (B+C), DEF (D+E+F)
// Cols: 中高温 (中温+高温), 低温, 冷却
var GROUPED_ROWS = [
  { name: 'A',   valIdxs: [0,1,2,3], color: '#1e40af' },
  { name: 'BC',  valIdxs: [4,5],     color: '#0891b2' },
  { name: 'DEF', valIdxs: [6,7,8],   color: '#f59e0b' }
];
// clientData.temperature order: 冷却(0), 低温(1), 中温(2), 高温(3)
var GROUPED_COLS = [
  { name: '冷却',   tempIdxs: [0],   color: '#94a3b8' },
  { name: '低温',   tempIdxs: [1],   color: '#0891b2' },
  { name: '中高温', tempIdxs: [2,3], color: '#ef4444' }
];

// Build aggregated matrix: groupedMatrix[rowGroupIdx][colGroupIdx] = sum
function buildGroupedMatrix() {
  var m = getClientMatrix();
  var out = [];
  GROUPED_ROWS.forEach(function(rg) {
    var row = [];
    GROUPED_COLS.forEach(function(cg) {
      var s = 0;
      rg.valIdxs.forEach(function(vi) {
        cg.tempIdxs.forEach(function(ti) {
          s += (m[vi] && m[vi][ti]) || 0;
        });
      });
      row.push(s);
    });
    out.push(row);
  });
  return out;
}

// ===== Build 2D Matrix HTML for 客户画像分析 (read-only, same style as 客户达成测算) =====
function buildProfileMatrixHTML(uid) {
  var matrix = getClientMatrix();
  var tempNames = clientData.temperature.map(function(t) { return t.name; });
  var tempColors = clientData.temperature.map(function(t) { return t.color; });

  // Column totals (整体 row)
  var colTotals = [];
  for (var ti = 0; ti < tempNames.length; ti++) {
    var colSum = 0;
    for (var vi = 0; vi < clientData.value.length; vi++) { colSum += matrix[vi][ti]; }
    colTotals.push(colSum);
  }
  var totalCount = 0; colTotals.forEach(function(c) { totalCount += c; });

  // Header row
  var tableHtml = '<div style="overflow-x:auto;"><table class="tp-table client-2d-table"><thead><tr><th style="min-width:60px;">客价 \\ 客温</th>';
  tempNames.forEach(function(n, i) {
    tableHtml += '<th><span class="tp-level-tag"><span class="tp-level-dot" style="background:' + tempColors[i] + ';"></span>' + n + '</span></th>';
  });
  tableHtml += '<th style="background:#eef2ff;font-weight:600;">合计</th></tr></thead><tbody>';

  // 整体 row (column totals)
  tableHtml += '<tr class="tp-row-total"><td style="font-weight:700;">整体</td>';
  colTotals.forEach(function(c) {
    tableHtml += '<td style="font-weight:700;">' + c + '</td>';
  });
  tableHtml += '<td style="font-weight:800;background:#eef2ff;">' + totalCount + '</td></tr>';

  // Data rows (each 客价)
  clientData.value.forEach(function(v, vi) {
    var rowSum = 0;
    var cells = '';
    clientData.temperature.forEach(function(t, ti) {
      var cnt = matrix[vi][ti];
      rowSum += cnt;
      cells += '<td>' + cnt + '</td>';
    });
    tableHtml += '<tr><td><span class="tp-level-tag"><span class="tp-level-dot" style="background:' + v.color + ';"></span>' + v.name + '</span></td>' + cells + '<td style="font-weight:600;background:#f8faff;">' + rowSum + '</td></tr>';
  });

  tableHtml += '</tbody></table></div>';
  return tableHtml;
}

// ===== 客温 饼图 =====
function renderCpTempPieChart(total, uid) {
  var R = 58, cx = 75, cy = 75, gap = 1.5;
  var svg = '<svg viewBox="0 0 150 150">';
  var startAngle = -90;

  clientData.temperature.forEach(function(item) {
    var pct = item.count / total;
    var angle = pct * 360;
    var drawAngle = Math.max(angle - gap, 0.5);
    var startRad = (startAngle + gap / 2) * Math.PI / 180;
    var endRad = (startAngle + gap / 2 + drawAngle) * Math.PI / 180;
    var x1 = cx + R * Math.cos(startRad);
    var y1 = cy + R * Math.sin(startRad);
    var x2 = cx + R * Math.cos(endRad);
    var y2 = cy + R * Math.sin(endRad);
    var large = drawAngle > 180 ? 1 : 0;

    svg += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 +
           ' A' + R + ',' + R + ' 0 ' + large + ',1 ' + x2 + ',' + y2 +
           ' Z" fill="' + item.color + '" opacity="0.85">' +
           '<animate attributeName="opacity" from="0" to="0.85" dur="0.5s" fill="freeze"/>' +
           '</path>';
    startAngle += angle;
  });

  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="white"/>';
  svg += '</svg>';

  var wrap = document.getElementById('cpTempPie' + uid);
  if (wrap) {
    wrap.innerHTML = svg +
      '<div class="ta-pie-center">' +
        '<div class="ta-pie-center-val">' + total + '</div>' +
        '<div class="ta-pie-center-label">总客户</div>' +
      '</div>';
  }
}

// ===== 客价 柱状图 (X轴=客价, Y轴=数量) =====
function renderCpValVerticalBar(containerId, data) {
  var maxCount = 0;
  data.forEach(function(d) { if (d.count > maxCount) maxCount = d.count; });

  var W = 480, H = 180;
  var padL = 40, padR = 10, padT = 16, padB = 32;
  var chartW = W - padL - padR;
  var chartH = H - padT - padB;
  var barCount = data.length;
  var barGap = 6;
  var barW = Math.floor((chartW - barGap * (barCount - 1)) / barCount);
  if (barW > 42) barW = 42;
  var totalBarW = barW * barCount + barGap * (barCount - 1);
  var offsetX = padL + (chartW - totalBarW) / 2;

  // Y-axis grid: 5 ticks
  var yMax = Math.ceil(maxCount / 20) * 20;
  var yStep = yMax / 4;

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:100%;">';

  // Y-axis grid lines & labels
  for (var i = 0; i <= 4; i++) {
    var yVal = yStep * i;
    var yPos = padT + chartH - (yVal / yMax) * chartH;
    svg += '<line x1="' + padL + '" y1="' + yPos + '" x2="' + (W - padR) + '" y2="' + yPos + '" stroke="#f0f0f0" stroke-width="0.8"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (yPos + 3) + '" text-anchor="end" font-size="10" fill="#94a3b8">' + yVal + '</text>';
  }

  // Bars
  data.forEach(function(d, idx) {
    var bx = offsetX + idx * (barW + barGap);
    var barH = (d.count / yMax) * chartH;
    var by = padT + chartH - barH;

    svg += '<rect x="' + bx + '" y="' + (padT + chartH) + '" width="' + barW + '" height="0" rx="3" fill="' + d.color + '" opacity="0.85">' +
           '<animate attributeName="y" from="' + (padT + chartH) + '" to="' + by + '" dur="0.5s" fill="freeze" begin="' + (idx * 0.05) + 's"/>' +
           '<animate attributeName="height" from="0" to="' + barH + '" dur="0.5s" fill="freeze" begin="' + (idx * 0.05) + 's"/>' +
           '</rect>';

    // Value label on top of bar
    svg += '<text x="' + (bx + barW / 2) + '" y="' + (by - 4) + '" text-anchor="middle" font-size="10" font-weight="600" fill="' + d.color + '" opacity="0">' +
           d.count +

// ===== 2D Matrix: client distribution (rows=客价, cols=客温) =====
// Default matrix distributes clientData proportionally: matrix[valIdx][tempIdx]
function buildDefaultMatrix() {
  var tempTotal = 0; clientData.temperature.forEach(function(t) { tempTotal += t.count; });
  var valTotal = 0; clientData.value.forEach(function(v) { valTotal += v.count; });
  var matrix = [];
  clientData.value.forEach(function(v, vi) {
    var row = [];
    var rowSum = 0;
    clientData.temperature.forEach(function(t, ti) {
      var cell = Math.round(v.count * t.count / tempTotal * 2 / 5);
      row.push(cell);
      rowSum += cell;
    });
    matrix.push(row);
  });
  return matrix;
}

var adjustedClientMatrix = null; // null = use default

function getClientMatrix() {
  if (adjustedClientMatrix) return adjustedClientMatrix;
  return buildDefaultMatrix();
}

// Derive temp/val counts from matrix for backward compatibility
function getClientTempCounts() {
  var m = getClientMatrix();
  var tempCounts = [];
  for (var ti = 0; ti < clientData.temperature.length; ti++) {
    var sum = 0;
    for (var vi = 0; vi < clientData.value.length; vi++) { sum += m[vi][ti]; }
    tempCounts.push(sum);
  }
  return tempCounts;
}
function getClientValCounts() {
  var m = getClientMatrix();
  var valCounts = [];
  for (var vi = 0; vi < clientData.value.length; vi++) {
    var sum = 0;
    for (var ti = 0; ti < clientData.temperature.length; ti++) { sum += m[vi][ti]; }
    valCounts.push(sum);
  }
  return valCounts;
}

// Compute NBEV for a cell: use geometric mean of tempNbev and valNbev per person
function getCellNbev(valIdx, tempIdx, count) {
  var tPer = clientAchieveData.tempNbev[tempIdx].nbevPer;
  var vPer = clientAchieveData.valNbev[valIdx].nbevPer;
  return Math.round(count * Math.sqrt(tPer * vPer) * 100) / 100;
}

  // Calculate total NBEV from 2D matrix
  var rawNbev = 0;

  clientData.value.forEach(function(v, vi) {
    clientData.temperature.forEach(function(t, ti) {
      var cnt = matrix[vi][ti];
      rawNbev += getCellNbev(vi, ti, cnt);
      grandTotal += cnt;
    });
  });
  rawNbev = Math.round(rawNbev * 10) / 10;

  // After client adjustment: use stored confirmed NBEV, otherwise random scale-up
  var predictedNbev;
  if (clientAdjustedPredictedNbev !== null) {

  }

  var achieveRate = Math.round(predictedNbev / target * 1000) / 10;

  // Col totals + grand total

// Distribute grouped matrix back to underlying 9x4 matrix proportionally
function expandGroupedMatrixToFull(newGm) {
  var baseMatrix = buildDefaultMatrix();
  var valLen = clientData.value.length;
  var tempLen = clientData.temperature.length;
  var fullMatrix = [];
  for (var vi = 0; vi < valLen; vi++) { fullMatrix.push([]); for (var ti = 0; ti < tempLen; ti++) { fullMatrix[vi].push(0); } }

  GROUPED_ROWS.forEach(function(rg, ri) {
    GROUPED_COLS.forEach(function(cg, ci) {
      var targetTotal = newGm[ri][ci];
      // Collect base cells in this group
      var baseCells = [];
      var baseSum = 0;
      rg.valIdxs.forEach(function(vi) {
        cg.tempIdxs.forEach(function(ti) {
          var bv = baseMatrix[vi][ti] || 0;
          baseCells.push({ vi: vi, ti: ti, base: bv });
          baseSum += bv;
        });
      });
      if (baseSum === 0) {
        // Spread evenly
        var n = baseCells.length;
        var each = Math.floor(targetTotal / n);
        var rem = targetTotal - each * n;
        baseCells.forEach(function(c, idx) {
          fullMatrix[c.vi][c.ti] = each + (idx < rem ? 1 : 0);
        });
      } else {
        // Proportional allocation with remainder distribution
        var allocated = 0;
        var fractions = [];
        baseCells.forEach(function(c) {
          var exact = targetTotal * c.base / baseSum;
          var flo = Math.floor(exact);
          fullMatrix[c.vi][c.ti] = flo;
          allocated += flo;
          fractions.push({ vi: c.vi, ti: c.ti, frac: exact - flo });
        });
        var rem = targetTotal - allocated;
        fractions.sort(function(a, b) { return b.frac - a.frac; });
        for (var k = 0; k < rem && k < fractions.length; k++) {
          fullMatrix[fractions[k].vi][fractions[k].ti]++;
        }
      }
    });
  });
  return fullMatrix;
}

  var activeLevels = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];
  var pieData = achieveData.levels.map(function(lv) {
    var isActive = activeLevels.indexOf(lv.name) !== -1;
    return { name: lv.name, count: lv.count, color: isActive ? lv.color : '#e9ecef', isInactive: !isActive };
  });
  // Compute 活动率 for center display
  var activeCnt = achieveData.levels.filter(function(lv){ return activeLevels.indexOf(lv.name) !== -1; })
                                    .reduce(function(s,lv){return s+lv.count;},0);
  var actRatePct = (activeCnt / total * 100).toFixed(1);

  pieData.forEach(function(lv) {
    var pct = lv.count / total;
    var angle = pct * 360;
    var drawAngle = Math.max(angle - gap, 0.5);
    var startRad = (startAngle + gap / 2) * Math.PI / 180;
    var endRad = (startAngle + gap / 2 + drawAngle) * Math.PI / 180;
    var x1 = cx + R * Math.cos(startRad);
    var y1 = cy + R * Math.sin(startRad);
    var x2 = cx + R * Math.cos(endRad);
    var y2 = cy + R * Math.sin(endRad);
    var large = drawAngle > 180 ? 1 : 0;
    var strokeAttr = lv.isInactive ? ' stroke="#d1d5db" stroke-width="0.5"' : '';

    svg += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 +
           ' A' + R + ',' + R + ' 0 ' + large + ',1 ' + x2 + ',' + y2 +
           ' Z" fill="' + lv.color + '"' + strokeAttr + ' opacity="0.9">' +
           '<animate attributeName="opacity" from="0" to="0.9" dur="0.5s" fill="freeze"/>' +
           '</path>';
    startAngle += angle;
  });

  // Center donut hole
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="white"/>';
  svg += '</svg>';

  var wrap = document.getElementById('taPieChart' + uid);
  wrap.innerHTML = svg +
    '<div class="ta-pie-center">' +
      '<div class="ta-pie-center-val">' + actRatePct + '%</div>' +
      '<div class="ta-pie-center-label">活动率</div>' +
    '</div>';
}

function onDistInputChange(uid) {
  var countInputs  = document.querySelectorAll('.td-input[data-type="count"][data-uid="' + uid + '"]');
  var nbevPerInputs = document.querySelectorAll('.td-input[data-type="nbevper"][data-uid="' + uid + '"]');
  var inServiceCount = window['_tdInService_' + uid] || 0;
  var activeSum = 0;
  var totalNbev = 0;
  var hasError = false;

  countInputs.forEach(function(inp, i) {
    var cnt = parseInt(inp.value);
    var nbevPerInp = nbevPerInputs[i];
    var nbevPer = nbevPerInp ? parseFloat(nbevPerInp.value) : 0;

    if (isNaN(cnt) || cnt < 0) {
      inp.classList.add('td-input-error');
      hasError = true;
    } else {
      inp.classList.remove('td-input-error');
      activeSum += cnt;
      if (!isNaN(nbevPer) && nbevPer >= 0) {
        var nbev = Math.round(nbevPer * cnt * 10) / 10;
        totalNbev += nbev;
        var nbevEl = document.getElementById('tdRowNbev' + uid + '_' + i);
        if (nbevEl) nbevEl.textContent = nbev;
      }
    }
    if (nbevPerInp) {
      if (isNaN(parseFloat(nbevPerInp.value)) || parseFloat(nbevPerInp.value) < 0) {
        nbevPerInp.classList.add('td-input-error');
        hasError = true;
      } else {
        nbevPerInp.classList.remove('td-input-error');
      }
    }
  });

  var nonActiveVal = inServiceCount - activeSum;
  var nonActiveEl  = document.getElementById('tdNonActive' + uid);
  var totalNbevEl  = document.getElementById('tdTotalNbev' + uid);
  var actRateEl    = document.getElementById('tdActRate' + uid);
  var errorEl      = document.getElementById('tdError' + uid);
  var errorTextEl  = document.getElementById('tdErrorText' + uid);
  var confirmBtn   = document.getElementById('tdConfirmBtn' + uid);

  if (nonActiveEl) nonActiveEl.textContent = nonActiveVal >= 0 ? nonActiveVal : 0;
  if (totalNbevEl) totalNbevEl.textContent = (Math.round(totalNbev * 10) / 10) + '万';

  var actRate = inServiceCount > 0 ? (Math.max(activeSum, 0) / inServiceCount * 100).toFixed(1) : '0.0';
  if (actRateEl) actRateEl.textContent = actRate + '%';

  if (hasError) {
    errorEl.classList.add('visible');
    errorTextEl.textContent = '请输入有效的非负数值';
    confirmBtn.disabled = true;
  } else if (nonActiveVal < 0) {
    errorEl.classList.add('visible');
    errorTextEl.textContent = '各层级人数之和不能超过在职人力 ' + inServiceCount + ' 人（当前超出 ' + Math.abs(nonActiveVal) + ' 人）';
    confirmBtn.disabled = true;
    if (nonActiveEl) nonActiveEl.style.color = 'var(--accent-red)';
  } else {
    errorEl.classList.remove('visible');
    confirmBtn.disabled = false;
    if (nonActiveEl) nonActiveEl.style.color = '';
  }
}

function resetDistInputs(uid) {
  var countInputs   = document.querySelectorAll('.td-input[data-type="count"][data-uid="' + uid + '"]');
  var nbevPerInputs = document.querySelectorAll('.td-input[data-type="nbevper"][data-uid="' + uid + '"]');
  var nbevPers = window['_tdNbevPer_' + uid] || [];
  var activeNames = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];
  var editIdx = 0;
  achieveData.levels.forEach(function(lv) {
    if (activeNames.indexOf(lv.name) !== -1) {
      if (countInputs[editIdx]) {
        countInputs[editIdx].value = lv.count;
        countInputs[editIdx].classList.remove('td-input-error');
      }
      if (nbevPerInputs[editIdx]) {
        nbevPerInputs[editIdx].value = nbevPers[editIdx] !== undefined ? nbevPers[editIdx] : lv.nbevPer;
        nbevPerInputs[editIdx].classList.remove('td-input-error');
      }
      editIdx++;
    }
  });
  onDistInputChange(uid);
}

function confirmDistAdjust(uid) {
  var countInputs   = document.querySelectorAll('.td-input[data-type="count"][data-uid="' + uid + '"]');
  var nbevPerInputs = document.querySelectorAll('.td-input[data-type="nbevper"][data-uid="' + uid + '"]');
  var inServiceCount = window['_tdInService_' + uid] || 0;
  var activeNames = ['双金钻', '金钻', '银钻', '钻石', '活动非钻'];
  var newLevels = [];
  var activeSum = 0;
  var editIdx = 0;

  achieveData.levels.forEach(function(lv) {
    if (activeNames.indexOf(lv.name) !== -1) {
      var val = parseInt(countInputs[editIdx] ? countInputs[editIdx].value : 0) || 0;
      var nbevPer = parseFloat(nbevPerInputs[editIdx] ? nbevPerInputs[editIdx].value : lv.nbevPer) || lv.nbevPer;
      newLevels.push({ name: lv.name, count: val, color: lv.color, nbevPer: nbevPer });
      activeSum += val;
      editIdx++;
    }
  });

  // 非活动人力 auto-calculated
  var nonActiveCount = inServiceCount - activeSum;
  newLevels.push({ name: '非活动人力', count: Math.max(nonActiveCount, 0), color: '#cbd5e1', nbevPer: 0 });

  // Save adjusted levels
  adjustedLevels = newLevels;

  // Build user summary bubble
  var summary = '完成队伍达成规划，';
  var activeParts = newLevels.filter(function(lv){ return lv.name !== '非活动人力'; });
  activeParts.forEach(function(lv) {
    summary += lv.name + '人力' + lv.count + '人，人均NBEV ' + (Math.round(lv.nbevPer * 10) / 10) + '万，';
  });
  summary = summary.replace(/，$/, '');

  // Fade out the adjust card
  var card = document.querySelector('.team-dist-adjust-row');
  if (card) {

function typewriteAdjustThinking(lineIdx, charIdx) {
  if (lineIdx >= adjustThinkingTexts.length) {
    var cursor = document.querySelector('#adjustThinkingBody .cursor');
    if (cursor) cursor.remove();
    var spinner = document.getElementById('adjustThinkingSpinner');
    if (spinner) spinner.classList.add('done');
    var label = document.getElementById('adjustThinkingLabel');
    if (label) label.textContent = '思考完成';

    // Sync adjusted levels back into achieveData so appendTeamAchieveCard reads new values
    if (adjustedLevels) { achieveData.levels = adjustedLevels; }
    var old1 = document.querySelector('.team-achieve-added');
    if (old1) old1.remove();
    setTimeout(function(){ appendTeamAchieveCard(); }, 600);
    return;
  }

  var body = document.getElementById('adjustThinkingBody');
  if (!body) return;

  var line = adjustThinkingTexts[lineIdx];

  if (charIdx === 0 && lineIdx > 0) {
    adjustThinkingFullText += ' ';
  }

  if (charIdx < line.length) {
    adjustThinkingFullText += line[charIdx];
    body.innerHTML = adjustThinkingFullText + '<span class="cursor"></span>';

    // Check overflow
    var toggle = document.getElementById('adjustThinkingToggle');
    if (toggle && body.scrollHeight > body.clientHeight + 4) {
      toggle.classList.add('visible');
    }

    if (!adjustThinkingExpanded) {
      body.scrollTop = body.scrollHeight;
    }

    var msgs = document.querySelector('.chat-messages');
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(function() { typewriteAdjustThinking(lineIdx, charIdx + 1); }, 30);
  } else {
    setTimeout(function() { typewriteAdjustThinking(lineIdx + 1, 0); }, 300);
  }
}

function toggleAdjustThinking() {
  var body = document.getElementById('adjustThinkingBody');
  var toggle = document.getElementById('adjustThinkingToggle');
  var label = document.getElementById('adjustThinkingToggleText');
  if (!body) return;

  adjustThinkingExpanded = !adjustThinkingExpanded;

  if (adjustThinkingExpanded) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    label.textContent = '收起';
    toggle.classList.add('expanded');
  } else {
    body.classList.add('collapsed');
    body.style.maxHeight = '';
    label.textContent = '展开全部';
    toggle.classList.remove('expanded');
    body.scrollTop = body.scrollHeight;
  }
}
