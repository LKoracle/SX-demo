function renderPremPieChart(total, uid) {
  var R = 58, cx = 75, cy = 75, gap = 1.5;
  var svg = '<svg viewBox="0 0 150 150">';
  var startAngle = -90;

  // Merge non-diamond levels into '非钻'
  var diamondNames = ['双金钻', '金钻', '银钻', '钻石'];
  var pieData = [];
  var otherCount = 0;
  adjustedLevels.forEach(function(lv) {
    if (diamondNames.indexOf(lv.name) !== -1) {
      pieData.push(lv);
    } else {
      otherCount += lv.count;
    }
  });
  pieData.push({ name: '非钻', count: otherCount, color: '#cbd5e1' });

  pieData.forEach(function(lv) {
    var pct = lv.count / total;
    var angle = pct * 360;
    var drawAngle = Math.max(angle - gap, 0.5);
    var startRad = (startAngle + gap / 2) * Math.PI / 180;
    var endRad = (startAngle + gap / 2 + drawAngle) * Math.PI / 180;
    var x1 = cx + R * Math.cos(startRad);
    var y1 = cy + R * Math.sin(startRad);
    var x2 = cx + R * Math.cos(endRad);
    var y2 = cy + R * Math.sin(endRad);
    var large = drawAngle > 180 ? 1 : 0;

    svg += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 +
           ' A' + R + ',' + R + ' 0 ' + large + ',1 ' + x2 + ',' + y2 +
           ' Z" fill="' + lv.color + '" opacity="0.85">' +
           '<animate attributeName="opacity" from="0" to="0.85" dur="0.5s" fill="freeze"/>' +
           '</path>';
    startAngle += angle;
  });

  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="white"/>';
  svg += '</svg>';

  var wrap = document.getElementById('premPieChart' + uid);
  if (wrap) {
    wrap.innerHTML = svg +
      '<div class="ta-pie-center">' +
        '<div class="ta-pie-center-val">' + total + '</div>' +
        '<div class="ta-pie-center-label">总人力</div>' +
      '</div>';
  }
}

function renderPremPieLegend(total, uid) {

  // Find the sub product whose contribution best fills the gap to slightly exceed target
  var gap = target - selectedMainProduct._contrib;
  var bestSub = null;
  var bestDiff = Infinity;

  productData.subProducts.forEach(function(sub) {
    // Sub product contribution estimate: enough to cover gap + small surplus
    var subContrib = gap * (1.02 + Math.random() * 0.08); // 102%-110% of gap
    var diff = Math.abs(subContrib - gap);
    if (!bestSub || sub.nbevPer > bestSub.nbevPer) {

  });

  // Pick the sub product with highest nbevPer to maximize achievability

function typewriteProdSubThinking(lineIdx, charIdx) {
  if (lineIdx >= prodSubThinkingTexts.length) {
    var cursor = document.querySelector('#prodSubThinkBody .cursor');
    if (cursor) cursor.remove();
    var spinner = document.getElementById('prodSubThinkSpinner');
    if (spinner) spinner.classList.add('done');
    var label = document.getElementById('prodSubThinkLabel');
    if (label) label.textContent = '思考完成';

    setTimeout(function() { appendProductAchieveCard(); }, 600);
    return;
  }

  var body = document.getElementById('prodSubThinkBody');
  if (!body) return;

  var line = prodSubThinkingTexts[lineIdx];

  if (charIdx === 0 && lineIdx > 0) {
    prodSubThinkFullText += ' ';
  }

  if (charIdx < line.length) {
    prodSubThinkFullText += line[charIdx];
    body.innerHTML = prodSubThinkFullText + '<span class="cursor"></span>';

    var toggle = document.getElementById('prodSubThinkToggle');
    if (toggle && body.scrollHeight > body.clientHeight + 4) {
      toggle.classList.add('visible');
    }

    if (!prodSubThinkExpanded) {
      body.scrollTop = body.scrollHeight;
    }

    var msgs = document.querySelector('.chat-messages');
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(function() { typewriteProdSubThinking(lineIdx, charIdx + 1); }, 30);
  } else {
    setTimeout(function() { typewriteProdSubThinking(lineIdx + 1, 0); }, 300);
  }
}

function toggleProdSubThinking() {
  var body = document.getElementById('prodSubThinkBody');
  var toggle = document.getElementById('prodSubThinkToggle');
  var label = document.getElementById('prodSubThinkToggleText');
  if (!body) return;

  prodSubThinkExpanded = !prodSubThinkExpanded;

  if (prodSubThinkExpanded) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    label.textContent = '收起';
    toggle.classList.add('expanded');
  } else {
    body.classList.add('collapsed');
    body.style.maxHeight = '';
    label.textContent = '展开全部';
    toggle.classList.remove('expanded');
    body.scrollTop = body.scrollHeight;
  }
}

function renderProductPieChart(uid, pieData) {
  var R = 58, cx = 75, cy = 75, gap = 2;
  var svg = '<svg viewBox="0 0 150 150">';
  var startAngle = -90;
  var total = 0;
  pieData.forEach(function(d) { total += d.pct; });

  pieData.forEach(function(d) {
    var angle = d.pct / total * 360;
    var drawAngle = Math.max(angle - gap, 0.5);
    var startRad = (startAngle + gap / 2) * Math.PI / 180;
    var endRad = (startAngle + gap / 2 + drawAngle) * Math.PI / 180;
    var x1 = cx + R * Math.cos(startRad);
    var y1 = cy + R * Math.sin(startRad);
    var x2 = cx + R * Math.cos(endRad);
    var y2 = cy + R * Math.sin(endRad);
    var large = drawAngle > 180 ? 1 : 0;

    svg += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 +
           ' A' + R + ',' + R + ' 0 ' + large + ',1 ' + x2 + ',' + y2 +
           ' Z" fill="' + d.color + '" opacity="0.85">' +
           '<animate attributeName="opacity" from="0" to="0.85" dur="0.5s" fill="freeze"/>' +
           '</path>';
    startAngle += angle;
  });

  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="white"/>';
  svg += '</svg>';

  var wrap = document.getElementById('prodPieChart' + uid);
  if (wrap) {
    var totalNbev = 0;
    pieData.forEach(function(d) { totalNbev += d.nbev; });
    wrap.innerHTML = svg +
      '<div class="ta-pie-center">' +
        '<div class="ta-pie-center-val">' + Math.round(totalNbev * 10) / 10 + '</div>' +
        '<div class="ta-pie-center-label">预测万元</div>' +
      '</div>';
  }
}

function renderProductPieLegend(uid, pieData) {
  var html = '';
  pieData.forEach(function(d) {
    html += '<div class="ta-legend-item">' +
      '<div class="ta-legend-dot" style="background:' + d.color + ';"></div>' +
      '<div class="ta-legend-name">' + d.name + '</div>' +
      '<div class="ta-legend-count">' + d.nbev + '万</div>' +
      '<div class="ta-legend-pct">' + d.pct + '%</div>' +
    '</div>';
  });
  var el = document.getElementById('prodPieLegend' + uid);
  if (el) el.innerHTML = html;
}

// ===== 产品保费测算卡片 =====
var feeCalcData = {};
var confirmedFeeRows = null; // set by confirmFeeCalc, consumed by appendProductAchieveCard
function nbevOf(fyp, pp, hc, ar, mg) {
  return Math.round(fyp * pp * hc * (ar / 100) * (mg / 100) / 10000 * 10) / 10;
}

function appendProductFeeCalcCard() {
  var msgs = document.querySelector('.chat-messages');
  var row = document.createElement('div');
  row.className = 'msg-row prod-fee-calc-row';

  var uid = 'fee' + Date.now();
  var target = userNbevTarget || 300;

  // Expand series name to individual product names.
  // Only splits when brackets contain multiple products (separated by 、).
  // Single-product entries keep the full series name.
  function extractProdNames(seriesName) {
    var m = seriesName.match(/（([^）]+)）/);
    if (!m) return [seriesName];
    var inner = m[1];
    if (inner.indexOf('、') !== -1) {
      return inner.split('、').map(function(s){ return s.trim(); });
    }
    return [seriesName]; // single product: use full name
  }

  // Build feeCalcData from prodAchieveRows (carry values from 产品达成测算).
  // 件均FYP is back-calculated from the actual nbev so the formula stays consistent.
  var srcRows = prodAchieveRows.length ? prodAchieveRows : [
    { name: selectedMainProduct ? selectedMainProduct.name : '金越系列（平安御享金越(2026)终身寿险、平安御享金越年金保险）',
      tag: '主推', color: '#2563eb', perPolicies: 1.6, headcount: 120, actRate: 68, margin: 24.5,
      nbev: (selectedMainProduct && selectedMainProduct._contrib) || 195 },
    { name: selectedSubProduct ? selectedSubProduct.name : '平安e生保（百万医疗险）',
      tag: '辅推', color: '#10b981', perPolicies: 2.4, headcount: 120, actRate: 42, margin: 16.8,
      nbev: (selectedSubProduct && selectedSubProduct._contrib) || 115 }
  ];

  feeCalcData[uid] = [];
  srcRows.forEach(function(series) {
    var names   = extractProdNames(series.name);
    var n       = names.length;
    var pp      = series.perPolicies;
    var hc      = series.headcount;
    var ar      = series.actRate;
    var mg      = series.margin;
    // Divide nbev equally across expanded products; back-calculate FYP per product
    var nbevEach = Math.round(series.nbev / n * 10) / 10;
    // FYP = nbev(万) × 10000 / (pp × hc × ar% × mg%)
    var denominator = pp * hc * (ar / 100) * (mg / 100);
    var calcFyp = denominator > 0 ? Math.round(nbevEach * 10000 / denominator) : (series.fyp || 28600);

    // Last-year same-period baselines (2025年4月 去年同期)
    var lyF = series.tag === '主推'
      ? { ar: 0.955, pp: 0.9375, fyp: 0.968, mg: 1.02 }
      : { ar: 0.952, pp: 0.9167, fyp: 0.982, mg: 0.997 };
    var lyAr  = Math.round(ar       * lyF.ar  * 10)  / 10;
    var lyPp  = Math.round(pp       * lyF.pp  * 100) / 100;
    var lyFyp = Math.round(calcFyp  * lyF.fyp);
    var lyMg  = Math.round(mg       * lyF.mg  * 10)  / 10;

    names.forEach(function(prodName) {
      feeCalcData[uid].push({
        name:        prodName,
        tag:         series.tag,
        color:       series.color,
        fyp:         calcFyp,
        perPolicies: pp,
        headcount:   hc,
        actRate:     ar,
        margin:      mg,
        // original values for reset
        _origFyp:    calcFyp,
        _origPp:     pp,
        _origHc:     hc,
        _origAr:     ar,
        _origMg:     mg,
        // last-year same-period baselines (去年同期)
        _lyAr:       lyAr,
        _lyPp:       lyPp,
        _lyFyp:      lyFyp,
        _lyMg:       lyMg
      });
    });
  });

  // Shared headcount: use headcount from first row (all rows share the same value)
  var sharedHc = feeCalcData[uid].length ? feeCalcData[uid][0].headcount : 120;
  feeCalcData[uid]._sharedHc = sharedHc;

  // First pass: collect NBEVs to compute initial pcts
  var rowNbevs = [];
  var totalNbev = 0;
  feeCalcData[uid].forEach(function(r, i) {
    r.headcount = sharedHc;
    var nbev = nbevOf(r.fyp, r.perPolicies, sharedHc, r.actRate, r.margin);
    rowNbevs.push(nbev);
    totalNbev += nbev;
  });
  totalNbev = Math.round(totalNbev * 10) / 10;

  // YoY badge: compares current value vs 去年同期 baseline
  // Red(↑)=上升, Green(↓)=下降 (Chinese finance convention)
  function yoyHtml(cur, ly) {
    if (!ly) return '<span style="font-size:10px;color:#94a3b8;">—</span>';
    var chg = Math.round((cur - ly) / ly * 1000) / 10;
    if (chg > 0)  return '<span style="font-size:10px;font-weight:600;color:#ef4444;white-space:nowrap;">↑' + chg + '%</span>';
    if (chg < 0)  return '<span style="font-size:10px;font-weight:600;color:#16a34a;white-space:nowrap;">↓' + Math.abs(chg) + '%</span>';
    return '<span style="font-size:10px;color:#94a3b8;">持平</span>';
  }
  function yoySpan(uid, field, idx, cur, ly) {
    return '<span id="' + uid + '_yoy_' + field + '_' + idx + '" title="与2025年4月去年同期对比" style="cursor:default;">' + yoyHtml(cur, ly) + '</span>';
  }
  function feeCell(inputHtml, badge) {
    return '<td style="white-space:nowrap;"><div style="display:flex;align-items:center;gap:3px;">' + inputHtml + badge + '</div></td>';
  }

  // Second pass: build table rows with pct + initial YoY badges
  var tableBody = '';
  feeCalcData[uid].forEach(function(r, i) {
    var nbev = rowNbevs[i];
    var pct = totalNbev > 0 ? Math.round(nbev / totalNbev * 1000) / 10 : 0;
    tableBody +=
      '<tr>' +
        '<td style="text-align:left;white-space:normal;line-height:1.5;">' +
          '<span class="tp-level-tag"><span class="tp-level-dot" style="background:' + r.color + ';"></span>' + r.tag + '</span>' +
          '<span style="display:block;margin-top:3px;font-size:12px;color:var(--text-primary);">' + r.name + '</span>' +
        '</td>' +
        feeCell('<input class="fee-input" id="' + uid + '_ar_'  + i + '" type="number" step="0.1" value="' + r.actRate     + '" oninput="recalcFee(\'' + uid + '\',' + i + ')">', yoySpan(uid, 'ar',  i, r.actRate,     r._lyAr))  +
        feeCell('<input class="fee-input" id="' + uid + '_pp_'  + i + '" type="number" step="0.1" value="' + r.perPolicies + '" oninput="recalcFee(\'' + uid + '\',' + i + ')">', yoySpan(uid, 'pp',  i, r.perPolicies, r._lyPp))  +
        feeCell('<input class="fee-input" id="' + uid + '_fyp_' + i + '" type="number"             value="' + r.fyp         + '" oninput="recalcFee(\'' + uid + '\',' + i + ')">', yoySpan(uid, 'fyp', i, r.fyp,         r._lyFyp)) +
        feeCell('<input class="fee-input" id="' + uid + '_mg_'  + i + '" type="number" step="0.1" value="' + r.margin      + '" oninput="recalcFee(\'' + uid + '\',' + i + ')">', yoySpan(uid, 'mg',  i, r.margin,      r._lyMg))  +
        '<td id="' + uid + '_nbev_' + i + '" style="font-weight:600;color:var(--text-primary);white-space:nowrap;min-width:72px;">' + nbev + '</td>' +
        '<td id="' + uid + '_pct_'  + i + '" style="font-weight:600;color:var(--text-primary);white-space:nowrap;min-width:72px;">' + pct + '%</td>' +
      '</tr>';
  });
  var achieveRate = Math.round(totalNbev / target * 1000) / 10;
  var isOnTrack = achieveRate >= 100;

  row.innerHTML =
    '<div class="msg-avatar ai"><img src="' + aiAvatarSrc + '" alt="助手"/></div>' +
    '<div class="msg-bubble ai-bubble tool-bubble">' +
      '<div style="margin-bottom:6px;font-size:13px;color:var(--text-secondary);">深圳市南山营业区 产品保费测算</div>' +
      '<div class="team-achieve-card">' +
        '<div class="team-achieve-header">' +
          '<div class="team-achieve-icon" style="background:#eff6ff;">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>' +
          '</div>' +
          '<div class="team-achieve-title">产品保费测算</div>' +
          '<div class="team-achieve-subtitle">NBEV目标 ' + target + ' 万元</div>' +
        '</div>' +
        '<div class="ta-metrics-row">' +
          '<div class="ta-metric-card">' +
            '<div class="ta-metric-label">NBEV目标值</div>' +
            '<div class="ta-metric-val-row"><span class="ta-metric-val">' + target + '</span><span class="ta-metric-unit">万元</span></div>' +
          '</div>' +
          '<div class="ta-metric-card">' +
            '<div class="ta-metric-label">测算达成值</div>' +
            '<div class="ta-metric-val-row">' +
              '<span class="ta-metric-val primary" id="' + uid + '_total">' + totalNbev + '</span>' +
              '<span class="ta-metric-unit">万元</span>' +
              '<span class="ta-metric-badge ' + (isOnTrack ? 'green' : 'yellow') + '" id="' + uid + '_rate">' + (isOnTrack ? '✓ ' : '⚠ ') + achieveRate + '%</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="cp-dim-section" style="border-bottom:none;">' +
          '<div class="cp-dim-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> 产品组合明细</div>' +
          '<div class="fee-formula-tip">NBEV(万) = 月初人力 × 活动率(%) × 人均件数 × 件均FYP(元) × Margin(%) ÷ 10000，修改任意字段后实时重算</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:6px 0 8px;font-size:12px;">' +
            '<div style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);">' +
              '<span>月初人力：</span>' +
              '<input class="fee-input" id="' + uid + '_shared_hc" type="number" value="' + sharedHc + '" style="width:60px;" oninput="recalcFeeAllRows(\'' + uid + '\')">' +
              '<span style="color:var(--text-muted);">人（所有产品共用）</span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:3px;font-size:11px;color:#94a3b8;white-space:nowrap;">' +
              '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
              '<span>数值右侧 <strong style="color:#ef4444;">↑</strong><strong style="color:#16a34a;">↓</strong> 为与去年同期对比</span>' +
            '</div>' +
          '</div>' +
          '<div class="fee-table-scroll" style="overflow-x:auto;-webkit-overflow-scrolling:touch;">' +
            '<table class="tp-table" style="min-width:680px;">' +
              '<thead><tr>' +
                '<th style="text-align:left;min-width:180px;">产品名称</th>' +
                '<th>活动率(%)</th>' +
                '<th>人均件数</th>' +
                '<th>件均FYP(元)</th>' +
                '<th>Margin(%)</th>' +
                '<th style="white-space:nowrap;min-width:72px;">NBEV(万)</th>' +
                '<th style="white-space:nowrap;min-width:72px;">NBEV占比</th>' +
              '</tr></thead>' +
              '<tbody>' + tableBody + '</tbody>' +
              '<tfoot><tr class="tp-row-total">' +
                '<td colspan="5">合计</td>' +
                '<td id="' + uid + '_total_cell" style="font-weight:800;white-space:nowrap;min-width:72px;">' + totalNbev + '</td>' +
                '<td id="' + uid + '_pct_total" style="font-weight:800;white-space:nowrap;min-width:72px;">100%</td>' +
              '</tr></tfoot>' +
            '</table>' +
          '</div>' +
          '<div class="fee-action-row">' +
            '<button class="fee-btn fee-btn-reset" id="' + uid + '_resetBtn" onclick="resetFeeCalc(\'' + uid + '\')">重置</button>' +
            '<button class="fee-btn fee-btn-confirm" id="' + uid + '_confirmBtn" onclick="confirmFeeCalc(\'' + uid + '\')">确认</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function resetFeeCalc(uid) {
  var rows = feeCalcData[uid];
  if (!rows) return;
  var sharedHcEl = document.getElementById(uid + '_shared_hc');
  if (sharedHcEl && rows._sharedHc !== undefined) sharedHcEl.value = rows._sharedHc;
  rows.forEach(function(r, i) {
    var setVal = function(suffix, val) {
      var el = document.getElementById(uid + '_' + suffix + '_' + i);
      if (el) el.value = val;
    };
    setVal('fyp', r._origFyp);
    setVal('pp',  r._origPp);
    setVal('ar',  r._origAr);
    setVal('mg',  r._origMg);
    recalcFee(uid, i);
  });
}

function confirmFeeCalc(uid) {
  var rows = feeCalcData[uid];
  if (!rows) return;

  // Collect confirmed values (headcount from shared input)
  var sharedHcEl = document.getElementById(uid + '_shared_hc');
  var sharedHc = sharedHcEl ? (parseFloat(sharedHcEl.value) || 0) : 0;
  var confirmedRows = rows.map(function(r, i) {
    return {
      name:        r.name,
      tag:         r.tag,
      fyp:         parseFloat(document.getElementById(uid + '_fyp_' + i).value) || r.fyp,
      perPolicies: parseFloat(document.getElementById(uid + '_pp_'  + i).value) || r.perPolicies,
      headcount:   sharedHc,
      actRate:     parseFloat(document.getElementById(uid + '_ar_'  + i).value) || r.actRate,
      margin:      parseFloat(document.getElementById(uid + '_mg_'  + i).value) || r.margin
    };
  });
  var confirmedNbev = parseFloat(document.getElementById(uid + '_total').textContent) || 0;

  // Disable inputs and buttons
  var sharedHcElD = document.getElementById(uid + '_shared_hc');
  if (sharedHcElD) { sharedHcElD.disabled = true; sharedHcElD.style.background = '#f8fafc'; }
  rows.forEach(function(r, i) {
    ['fyp','pp','ar','mg'].forEach(function(f) {
      var el = document.getElementById(uid + '_' + f + '_' + i);
      if (el) { el.disabled = true; el.style.background = '#f8fafc'; el.style.color = 'var(--text-primary)'; }
    });
  });
  var resetBtn   = document.getElementById(uid + '_resetBtn');
  var confirmBtn = document.getElementById(uid + '_confirmBtn');
  if (resetBtn)   { resetBtn.disabled = true; }
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = '已确认'; }

  // Show confirmed badge next to card title
  var titleEl = confirmBtn && confirmBtn.closest('.team-achieve-card') &&
                confirmBtn.closest('.team-achieve-card').querySelector('.team-achieve-title');
  if (titleEl && !titleEl.querySelector('.fee-confirmed-badge')) {
    var badge = document.createElement('span');
    badge.className = 'fee-confirmed-badge';
    badge.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> 已确认';
    titleEl.appendChild(badge);
  }

  // Sum displayed NBEV by tag and update _contrib so appendProductAchieveCard is consistent
  var mainNbev = 0, subNbev = 0;
  rows.forEach(function(r, i) {
    var nbevEl = document.getElementById(uid + '_nbev_' + i);
    var nbev = nbevEl ? (parseFloat(nbevEl.textContent) || 0) : nbevOf(r.fyp, r.perPolicies, r.headcount, r.actRate, r.margin);
    if (r.tag === '主推') mainNbev += nbev;
    else                  subNbev  += nbev;
  });
  if (selectedMainProduct) selectedMainProduct._contrib = Math.round(mainNbev * 10) / 10;
  if (selectedSubProduct)  selectedSubProduct._contrib  = Math.round(subNbev  * 10) / 10;

  // User summary bubble
  var userSummary = '完成产品达成规划，';
  confirmedRows.forEach(function(r) {
    userSummary += r.name + '件均FYP ' + r.fyp.toLocaleString() + '元，人均' + r.perPolicies + '件，';
  });
  userSummary = userSummary.replace(/，$/, '');
  appendUserBubble(userSummary);

  // Store confirmed rows so appendProductAchieveCard uses adjusted values
  confirmedFeeRows = confirmedRows;

  // Re-render product achieve card (same style as first render, updated values)
  var oldProd = document.querySelector('.product-achieve-added');
  if (oldProd) oldProd.remove();
  setTimeout(function(){ appendProductAchieveCard(); }, 600);

}

function recalcFeeAllRows(uid) {
  var rows = feeCalcData[uid];
  if (!rows) return;
  rows.forEach(function(r, i) { recalcFee(uid, i); });
}

function recalcFee(uid, i) {
  var fyp  = parseFloat(document.getElementById(uid + '_fyp_' + i).value) || 0;
  var pp   = parseFloat(document.getElementById(uid + '_pp_'  + i).value) || 0;
  var hcEl = document.getElementById(uid + '_shared_hc');
  var hc   = hcEl ? (parseFloat(hcEl.value) || 0) : 0;
  var ar   = parseFloat(document.getElementById(uid + '_ar_'  + i).value) || 0;
  var mg   = parseFloat(document.getElementById(uid + '_mg_'  + i).value) || 0;

  var nbev = Math.round(fyp * pp * hc * (ar / 100) * (mg / 100) / 10000 * 10) / 10;
  var nbevEl = document.getElementById(uid + '_nbev_' + i);
  if (nbevEl) nbevEl.textContent = nbev;

  // Recalculate total across all rows
  var rows = feeCalcData[uid];
  var total = 0;
  rows.forEach(function(r, idx) {
    var el = document.getElementById(uid + '_nbev_' + idx);
    total += el ? (parseFloat(el.textContent) || 0) : 0;
  });
  total = Math.round(total * 10) / 10;

  var target = userNbevTarget || 300;
  var achieveRate = Math.round(total / target * 1000) / 10;
  var isOnTrack = achieveRate >= 100;

  var totalEl     = document.getElementById(uid + '_total');
  var totalCellEl = document.getElementById(uid + '_total_cell');
  var rateEl      = document.getElementById(uid + '_rate');

  if (totalEl)     totalEl.textContent = total;
  if (totalCellEl) totalCellEl.textContent = total;
  if (rateEl) {
    rateEl.textContent = (isOnTrack ? '✓ ' : '⚠ ') + achieveRate + '%';
    rateEl.className = 'ta-metric-badge ' + (isOnTrack ? 'green' : 'yellow');
  }

  // Refresh NBEV占比 for every row
  rows.forEach(function(r, idx) {
    var nEl = document.getElementById(uid + '_nbev_' + idx);
    var pEl = document.getElementById(uid + '_pct_'  + idx);
    if (nEl && pEl) {
      var n = parseFloat(nEl.textContent) || 0;
      pEl.textContent = (total > 0 ? Math.round(n / total * 1000) / 10 : 0) + '%';
    }
  });
  var pctTotalEl = document.getElementById(uid + '_pct_total');
  if (pctTotalEl) pctTotalEl.textContent = '100%';

  // Update YoY badges vs 去年同期 baselines (red=↑, green=↓)
  var r = rows[i];
  [['ar', r._lyAr], ['pp', r._lyPp], ['fyp', r._lyFyp], ['mg', r._lyMg]].forEach(function(pair) {
    var field = pair[0], ly = pair[1];
    var inputEl = document.getElementById(uid + '_' + field + '_' + i);
    var badgeEl = document.getElementById(uid + '_yoy_' + field + '_' + i);
    if (!inputEl || !badgeEl) return;
    var cur = parseFloat(inputEl.value) || 0;
    if (!ly) { badgeEl.innerHTML = '<span style="font-size:10px;color:#94a3b8;">—</span>'; return; }
    var chg = Math.round((cur - ly) / ly * 1000) / 10;
    if (chg > 0)
      badgeEl.innerHTML = '<span style="font-size:10px;font-weight:600;color:#ef4444;white-space:nowrap;">↑' + chg + '%</span>';
    else if (chg < 0)
      badgeEl.innerHTML = '<span style="font-size:10px;font-weight:600;color:#16a34a;white-space:nowrap;">↓' + Math.abs(chg) + '%</span>';
    else
      badgeEl.innerHTML = '<span style="font-size:10px;color:#94a3b8;">持平</span>';
  });
}
